<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131c">
  <title>Sky Stations - Quiz Overlay</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --ink: #eaf5f6;
      --muted: #9ab0b9;
      --cyan: #66e4e6;
      --amber: #ffcb71;
      --orange: #ff9a4f;
      --panel: rgba(5, 15, 23, 0.96);
      --line: rgba(126, 207, 213, 0.28);
      --question-size: 40px;
      --answer-size: 22px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--ink);
    }

    .overlay {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .settings-panel {
      position: fixed;
      z-index: 5;
      top: 24px;
      left: 50%;
      width: min(460px, calc(100vw - 32px));
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(5, 15, 23, 0.98);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
      transform: translateX(-50%);
    }

    .settings-panel[hidden] {
      display: none;
    }

    .settings-header,
    .settings-actions,
    .setting-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-header {
      margin-bottom: 18px;
    }

    .settings-title {
      margin: 0;
      color: var(--ink);
      font-size: 22px;
    }

    .settings-hint,
    .settings-status {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .text-setting {
      margin-top: 16px;
    }

    .setting-label {
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .setting-value {
      color: var(--amber);
      font-variant-numeric: tabular-nums;
    }

    .text-setting input {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .settings-actions {
      justify-content: flex-end;
      margin-top: 16px;
    }

    .settings-button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid rgba(102, 228, 230, 0.42);
      border-radius: 4px;
      background: rgba(31, 74, 81, 0.42);
      color: var(--cyan);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .settings-button:hover {
      background: rgba(31, 74, 81, 0.78);
    }

    .settings-toggle {
      display: grid;
      width: 42px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(102, 228, 230, 0.42);
      border-radius: 4px;
      background: rgba(31, 74, 81, 0.42);
      color: var(--cyan);
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .settings-toggle:hover {
      background: rgba(31, 74, 81, 0.78);
    }

    .settings-button:focus-visible,
    .settings-toggle:focus-visible,
    .text-setting input:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    .quiz-ticket {
      position: absolute;
      right: 4%;
      bottom: 3%;
      left: 4%;
      display: grid;
      height: auto;
      min-height: min(460px, 64vh);
      max-height: 94vh;
      grid-template-columns: minmax(0, 1fr) 250px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 3px solid var(--cyan);
      border-right: 3px solid var(--orange);
      border-radius: 12px;
      background:
        linear-gradient(125deg, rgba(10, 29, 39, 0.86), transparent 62%),
        var(--panel);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.38), inset 0 0 28px rgba(70, 181, 190, 0.05);
      backdrop-filter: blur(10px);
    }

    .ticket-main {
      display: grid;
      min-width: 0;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      padding: 22px 28px 18px;
    }

    .quiz-header,
    .header-controls,
    .brand,
    .ticket-footer {
      display: flex;
      align-items: center;
    }

    .quiz-header,
    .ticket-footer {
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      gap: 9px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .signal {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px rgba(255, 203, 113, 0.75);
    }

    .quiz-kind,
    .stub-label,
    .timer-unit,
    .barcode-number {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .quiz-kind {
      color: var(--amber);
      text-align: right;
    }

    .question-area {
      display: flex;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
      gap: 13px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: var(--question-size);
      font-weight: 650;
      line-height: 1.22;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .answer {
      display: flex;
      min-width: 0;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(147, 184, 193, 0.2);
      border-radius: 5px;
      background: rgba(17, 35, 44, 0.72);
      color: var(--ink);
      font: inherit;
      font-size: var(--answer-size);
      line-height: 1.25;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    button.answer {
      cursor: pointer;
    }

    button.answer:hover:not(:disabled) {
      border-color: var(--cyan);
      background: rgba(31, 74, 81, 0.72);
    }

    button.answer:focus-visible,
    .next-button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    .answer-key {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border: 1px solid rgba(102, 228, 230, 0.34);
      border-radius: 3px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 700;
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      border-color: rgba(117, 230, 174, 0.74);
      background: rgba(24, 91, 67, 0.35);
    }

    .answer.correct .answer-key {
      border-color: #75e6ae;
      color: #75e6ae;
    }

    .answer.incorrect {
      border-color: rgba(255, 130, 120, 0.72);
      background: rgba(112, 42, 43, 0.32);
    }

    .answer.incorrect .answer-key {
      border-color: #ff8278;
      color: #ff8278;
    }

    .answer.dimmed {
      opacity: 0.54;
    }

    .feedback {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .ticket-footer {
      padding-top: 12px;
      border-top: 1px solid rgba(126, 207, 213, 0.2);
    }

    .footer-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .boarding-stub {
      position: relative;
      display: grid;
      min-width: 0;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto auto;
      gap: 10px;
      padding: 21px 20px 17px;
      border-left: 1px dashed rgba(102, 228, 230, 0.48);
      background: linear-gradient(145deg, rgba(16, 39, 49, 0.78), rgba(7, 19, 28, 0.4));
    }

    .round-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.1em;
    }

    .timer-display {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .timer-value {
      color: var(--amber);
      font-size: clamp(64px, 7vw, 88px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
    }

    .timer-unit {
      color: var(--muted);
      text-align: center;
    }

    .timer-track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(159, 186, 194, 0.18);
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(1);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
    }

    .next-button {
      min-height: 37px;
      padding: 8px 10px;
      border: 1px solid rgba(102, 228, 230, 0.42);
      border-radius: 4px;
      background: rgba(31, 74, 81, 0.42);
      color: var(--cyan);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .next-button:hover:not(:disabled) {
      background: rgba(31, 74, 81, 0.78);
    }

    .next-button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .barcode {
      width: 100%;
      height: 34px;
      border: 4px solid rgba(234, 245, 246, 0.92);
      background:
        repeating-linear-gradient(
          90deg,
          #eaf5f6 0 2px,
          transparent 2px 4px,
          #eaf5f6 4px 5px,
          transparent 5px 8px,
          #eaf5f6 8px 11px,
          transparent 11px 13px
        );
    }

    .barcode-number {
      font-size: 8px;
      letter-spacing: 0.12em;
      text-align: center;
    }

    @media (max-width: 700px) {
      .quiz-ticket {
        right: 3%;
        bottom: 3%;
        left: 3%;
        height: auto;
        min-height: 0;
        display: flex;
        max-height: 98vh;
        overflow-y: auto;
        flex-direction: column;
      }

      .ticket-main {
        gap: 10px;
        padding: 14px 16px 12px;
      }

      .quiz-header {
        justify-content: space-between;
        gap: 8px;
      }

      .header-controls {
        gap: 0;
      }

      .quiz-kind {
        display: none;
      }

      .quiz-kind {
        text-align: left;
      }

      .question-area {
        gap: 9px;
      }

      h1 {
        line-height: 1.15;
      }

      .answers {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .answer {
        min-height: 48px;
        gap: 10px;
        padding: 8px 10px;
      }

      .answer-key {
        width: 28px;
        height: 28px;
        flex-basis: 28px;
        font-size: 14px;
      }

      .feedback {
        font-size: 14px;
      }

      .ticket-footer {
        display: none;
      }

      .boarding-stub {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto minmax(92px, 1fr) auto;
        gap: 7px 10px;
        padding: 9px 16px 11px;
        border-top: 1px dashed rgba(102, 228, 230, 0.48);
        border-left: 0;
      }

      .round-label {
        text-align: right;
      }

      .timer-display {
        grid-column: 1 / -1;
        gap: 5px;
      }

      .timer-value {
        font-size: clamp(56px, 16vw, 76px);
      }

      .timer-track {
        max-width: 240px;
      }

      .next-button {
        grid-column: 1 / -1;
        min-height: 44px;
        font-size: 13px;
      }

      .barcode,
      .barcode-number {
        display: none;
      }

      .stub-label {
        font-size: 10px;
      }
    }

    @media (max-width: 700px) and (max-height: 720px) {
      .quiz-ticket {
        max-height: 98vh;
      }

      .ticket-main {
        gap: 7px;
        padding: 10px 14px;
      }

      .question-area {
        gap: 7px;
      }

      .answer {
        min-height: 40px;
        padding: 6px 10px;
      }

      .answer-key {
        width: 24px;
        height: 24px;
        flex-basis: 24px;
      }

      .feedback {
        font-size: 12px;
      }

      .ticket-footer {
        display: none;
      }

      .quiz-kind,
      .feedback {
        display: none;
      }

      .boarding-stub {
        grid-template-rows: auto minmax(64px, 1fr) auto;
        gap: 5px 8px;
        padding: 6px 12px 8px;
      }

      .timer-value {
        font-size: 46px;
      }

      .timer-display {
        gap: 3px;
      }

      .timer-unit,
      .stub-label {
        font-size: 8px;
      }

      .next-button {
        min-height: 36px;
        font-size: 11px;
      }

      .settings-panel {
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="overlay" aria-label="Aviation quiz overlay">
    <section class="settings-panel" id="settings-panel" role="dialog" aria-labelledby="settings-title" hidden>
      <header class="settings-header">
        <div>
          <h2 class="settings-title" id="settings-title">Text size</h2>
          <p class="settings-hint">Changes apply instantly. Press Esc or Done to close.</p>
        </div>
        <button class="settings-button" id="close-settings" type="button">Done</button>
      </header>

      <div class="text-setting">
        <label class="setting-label" for="question-size">
          <span>Question</span>
          <output class="setting-value" id="question-size-value" for="question-size">40 px</output>
        </label>
          <input id="question-size" type="range" min="28" max="48" step="1" value="40">
      </div>

      <div class="text-setting">
        <label class="setting-label" for="answer-size">
          <span>Answer options</span>
          <output class="setting-value" id="answer-size-value" for="answer-size">22 px</output>
        </label>
        <input id="answer-size" type="range" min="18" max="26" step="1" value="22">
      </div>

      <div class="settings-actions">
        <span class="settings-status" id="settings-status" role="status">Settings save automatically.</span>
        <button class="settings-button" id="reset-settings" type="button">Reset</button>
      </div>
    </section>

    <article class="quiz-ticket">
      <section class="ticket-main" aria-live="polite">
        <header class="quiz-header">
          <div class="brand"><span class="signal" aria-hidden="true"></span>Sky Stations</div>
          <div class="header-controls">
            <span class="quiz-kind">Aviation quiz / boarding pass</span>
            <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Open text size settings" aria-haspopup="dialog" aria-controls="settings-panel" aria-expanded="false">Aa</button>
          </div>
        </header>

        <div class="question-area">
          <h1 id="question">Preparing the quiz...</h1>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback">The quiz will begin shortly.</p>
        </div>

        <footer class="ticket-footer">
          <span class="footer-label">Answer with 1, 2, 3 or 4</span>
          <span class="footer-label">Flight SS 042</span>
        </footer>
      </section>

      <aside class="boarding-stub" aria-label="Quiz timer and controls">
        <span class="stub-label">Live quiz</span>
        <span class="round-label" id="round-label">GET READY</span>
        <div class="timer-display">
          <span class="timer-value" id="timer-value">20</span>
          <span class="timer-unit">Seconds left</span>
          <div class="timer-track" role="progressbar" aria-label="Time to answer" aria-valuemin="0" aria-valuemax="20" aria-valuenow="20">
            <div class="timer-fill" id="timer-fill"></div>
          </div>
        </div>
        <button class="next-button" id="next-button" type="button" disabled>PREPARING...</button>
        <div class="barcode" aria-hidden="true"></div>
        <span class="barcode-number">SS042 - QUIZ - A1B2C3</span>
      </aside>
    </article>
  </main>

  <script>
    const questions = [
      {
        question: "Which manufacturer builds the 737 and 787 Dreamliner?",
        answers: ["Airbus", "Boeing", "Embraer", "Bombardier"],
        correct: 1,
        detail: "The 737 and 787 Dreamliner are aircraft built by the American manufacturer Boeing."
      },
      {
        question: "Which aircraft is known as the Superjumbo?",
        answers: ["Airbus A380", "Boeing 757", "Embraer E195", "Airbus A321"],
        correct: 0,
        detail: "The Airbus A380 is the largest passenger airliner in service."
      },
      {
        question: "What does transponder code 7700 generally indicate?",
        answers: ["Training flight", "General emergency", "Communication failure", "State aircraft"],
        correct: 1,
        detail: "Code 7700 is used to signal a general emergency."
      },
      {
        question: "Which Brazilian manufacturer builds the E-Jet family?",
        answers: ["Cessna", "ATR", "Embraer", "Pilatus"],
        correct: 2,
        detail: "Embraer builds the E-Jet and E-Jet E2 families."
      },
      {
        question: "What is the main purpose of flaps on approach?",
        answers: ["Increase lift and drag", "Reduce weight", "Increase cabin pressurization", "Brake the wheels in flight"],
        correct: 0,
        detail: "Flaps help generate lift and drag at low speeds."
      },
      {
        question: "Which of these aircraft uses turboprop engines?",
        answers: ["Boeing 777", "Airbus A350", "ATR 72", "Boeing 787"],
        correct: 2,
        detail: "The ATR 72 is a turboprop aircraft commonly used on regional routes."
      }
    ];

    const duration = 20;
    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");
    const roundLabel = document.getElementById("round-label");
    const timerFill = document.getElementById("timer-fill");
    const timerValue = document.getElementById("timer-value");
    const timerTrack = document.querySelector(".timer-track");
    const nextButton = document.getElementById("next-button");
    const settingsPanel = document.getElementById("settings-panel");
    const settingsToggle = document.getElementById("settings-toggle");
    const questionSizeSlider = document.getElementById("question-size");
    const answerSizeSlider = document.getElementById("answer-size");
    const questionSizeValue = document.getElementById("question-size-value");
    const answerSizeValue = document.getElementById("answer-size-value");
    const settingsStatus = document.getElementById("settings-status");
    const defaultTextSizes = { question: 40, answer: 22 };
    const textSettingsKey = "sky-stations-quiz-text-sizes";

    let questionIndex = -1;
    let timerId = 0;
    let roundActive = false;

    function loadTextSizes() {
      let saved;
      try {
        saved = window.localStorage.getItem(textSettingsKey);
      } catch (error) {
        settingsStatus.textContent = "Saved text sizes are unavailable. Defaults are active.";
        return defaultTextSizes;
      }

      if (!saved) return defaultTextSizes;

      let sizes;
      try {
        sizes = JSON.parse(saved);
      } catch (error) {
        if (error instanceof SyntaxError) {
          settingsStatus.textContent = "Saved text sizes are invalid. Defaults are active.";
          return defaultTextSizes;
        }
        throw error;
      }

      if (!sizes || !Number.isInteger(sizes.question) || sizes.question < 28 || sizes.question > 48 ||
          !Number.isInteger(sizes.answer) || sizes.answer < 18 || sizes.answer > 26) {
        settingsStatus.textContent = "Saved text sizes are invalid. Defaults are active.";
        return defaultTextSizes;
      }

      return sizes;
    }

    function applyTextSizes(save) {
      const questionSize = Number(questionSizeSlider.value);
      const answerSize = Number(answerSizeSlider.value);
      document.documentElement.style.setProperty("--question-size", questionSize + "px");
      document.documentElement.style.setProperty("--answer-size", answerSize + "px");
      questionSizeValue.textContent = questionSize + " px";
      answerSizeValue.textContent = answerSize + " px";

      if (!save) return;

      try {
        window.localStorage.setItem(textSettingsKey, JSON.stringify({
          question: questionSize,
          answer: answerSize
        }));
        settingsStatus.textContent = "Settings saved automatically.";
      } catch (error) {
        settingsStatus.textContent = "Changes apply now but could not be saved.";
      }
    }

    const savedTextSizes = loadTextSizes();
    questionSizeSlider.value = String(savedTextSizes.question);
    answerSizeSlider.value = String(savedTextSizes.answer);
    applyTextSizes(false);

    questionSizeSlider.addEventListener("input", function () {
      applyTextSizes(true);
    });
    answerSizeSlider.addEventListener("input", function () {
      applyTextSizes(true);
    });
    function setSettingsOpen(open) {
      settingsPanel.hidden = !open;
      settingsToggle.setAttribute("aria-expanded", String(open));
      if (open) questionSizeSlider.focus();
      else settingsToggle.focus();
    }

    settingsToggle.addEventListener("click", function () {
      setSettingsOpen(true);
    });
    document.getElementById("reset-settings").addEventListener("click", function () {
      questionSizeSlider.value = String(defaultTextSizes.question);
      answerSizeSlider.value = String(defaultTextSizes.answer);
      applyTextSizes(true);
    });
    document.getElementById("close-settings").addEventListener("click", function () {
      setSettingsOpen(false);
    });

    function updateTimer(secondsLeft) {
      const progress = Math.max(0, secondsLeft / duration);
      timerFill.style.transform = "scaleX(" + progress + ")";
      timerValue.textContent = String(Math.ceil(secondsLeft));
      timerTrack.setAttribute("aria-valuenow", String(Math.ceil(secondsLeft)));
    }

    function finishQuestion(timedOut) {
      if (!roundActive) return;
      roundActive = false;
      window.clearInterval(timerId);

      const current = questions[questionIndex];
      answersElement.querySelectorAll(".answer").forEach(function (button, index) {
        button.disabled = true;
        if (index === current.correct) {
          button.classList.add("correct");
        } else if (button.dataset.selected === "true") {
          button.classList.add("incorrect");
        } else {
          button.classList.add("dimmed");
        }
      });

      if (timedOut) {
        feedbackElement.textContent = "Time's up. " + current.detail;
      } else {
        const selected = answersElement.querySelector('[data-selected="true"]');
        if (selected && Number(selected.dataset.index) === current.correct) {
          feedbackElement.textContent = "Correct! " + current.detail;
        } else {
          feedbackElement.textContent = "Not quite. " + current.detail;
        }
      }

      nextButton.disabled = false;
      nextButton.textContent = questionIndex === questions.length - 1
        ? "VIEW RESULTS"
        : "NEXT QUESTION";
    }

    function chooseAnswer(index) {
      if (!roundActive) return;
      const button = answersElement.querySelector('[data-index="' + index + '"]');
      if (!button) return;
      button.dataset.selected = "true";
      finishQuestion(false);
    }

    function showResults() {
      roundActive = false;
      questionElement.textContent = "Quiz complete!";
      answersElement.replaceChildren();
      feedbackElement.textContent = "That's the end of the quiz. Thanks for playing.";
      roundLabel.textContent = "ROUTE COMPLETE";
      timerValue.textContent = "--";
      timerFill.style.transform = "scaleX(0)";
      timerTrack.setAttribute("aria-valuenow", "0");
      nextButton.disabled = false;
      nextButton.textContent = "PLAY AGAIN";
    }

    function startQuestion() {
      if (questionIndex >= questions.length - 1) {
        showResults();
        return;
      }

      questionIndex += 1;
      roundActive = true;
      window.clearInterval(timerId);

      const current = questions[questionIndex];
      questionElement.textContent = current.question;
      roundLabel.textContent = "QUESTION " + String(questionIndex + 1).padStart(2, "0") +
        " / " + String(questions.length).padStart(2, "0");
      feedbackElement.textContent = "Choose an answer. You have " + duration + " seconds.";
      answersElement.replaceChildren();

      current.answers.forEach(function (answer, index) {
        const button = document.createElement("button");
        const key = document.createElement("span");
        const label = document.createElement("span");
        button.className = "answer";
        button.type = "button";
        button.dataset.index = String(index);
        key.className = "answer-key";
        key.textContent = String(index + 1);
        label.textContent = answer;
        button.append(key, label);
        button.addEventListener("click", function () {
          chooseAnswer(index);
        });
        answersElement.appendChild(button);
      });

      nextButton.disabled = true;
      nextButton.textContent = "CHOOSE AN ANSWER";
      updateTimer(duration);

      const startedAt = performance.now();
      timerId = window.setInterval(function () {
        const elapsed = (performance.now() - startedAt) / 1000;
        const remaining = Math.max(0, duration - elapsed);
        updateTimer(remaining);
        if (remaining <= 0) finishQuestion(true);
      }, 100);
    }

    nextButton.addEventListener("click", function () {
      if (nextButton.textContent === "PLAY AGAIN") {
        questionIndex = -1;
      }
      if (!roundActive) startQuestion();
    });

    window.addEventListener("keydown", function (event) {
      if (event.key === "F2") {
        event.preventDefault();
        setSettingsOpen(settingsPanel.hidden);
        return;
      }

      if (!settingsPanel.hidden) {
        if (event.key === "Escape") setSettingsOpen(false);
        return;
      }

      if (/^[1-4]$/.test(event.key)) {
        chooseAnswer(Number(event.key) - 1);
      } else if (event.key === "Enter" && !roundActive && !nextButton.disabled) {
        nextButton.click();
      }
    });

    window.setTimeout(startQuestion, 900);
  </script>
</body>
</html>
