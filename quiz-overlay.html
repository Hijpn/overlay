<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131c">
  <title>Sky Stations - Quiz Overlay</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <link rel="stylesheet" href="quiz-colors.css?v=20261127-4">
  <script src="quiz-airline.js?v=20261127-3"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --ink: #eaf5f6;
      --muted: #9ab0b9;
      --cyan: #66e4e6;
      --amber: #ffcb71;
      --orange: #ff9a4f;
      --panel: rgba(5, 15, 23, 0.96);
      --line: rgba(126, 207, 213, 0.28);
      --question-size: 40px;
      --answer-size: 44px;
      --answer-number-size: 13px;
      --explanation-size: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--ink);
    }

    .overlay {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .quiz-ticket {
      position: absolute;
      right: 4%;
      bottom: 3%;
      left: 4%;
      display: grid;
      height: auto;
      min-height: min(460px, 64vh);
      max-height: 94vh;
      grid-template-columns: minmax(0, 1fr) 250px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-left: 3px solid var(--cyan);
      border-right: 3px solid var(--orange);
      border-radius: 12px;
      background:
        linear-gradient(125deg, rgba(10, 29, 39, 0.86), transparent 62%),
        var(--panel);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.38), inset 0 0 28px rgba(70, 181, 190, 0.05);
      backdrop-filter: blur(10px);
    }

    .ticket-main {
      display: grid;
      min-width: 0;
      grid-template-rows: auto minmax(min-content, 1fr) auto;
      gap: 12px;
      padding: 22px 28px 18px;
    }

    .quiz-header,
    .brand,
    .ticket-footer {
      display: flex;
      align-items: center;
    }

    .quiz-header,
    .ticket-footer {
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      gap: 9px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .signal {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px rgba(255, 203, 113, 0.75);
    }

    .quiz-kind,
    .stub-label,
    .timer-unit {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .quiz-kind {
      color: var(--amber);
      text-align: right;
    }

    .question-area {
      display: flex;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
      gap: 13px;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: var(--question-size);
      font-weight: 650;
      line-height: 1.22;
      letter-spacing: -0.025em;
      text-align: left;
      text-wrap: wrap;
      overflow-wrap: anywhere;
    }

    .answers {
      display: grid;
      min-width: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .answer {
      display: flex;
      min-width: 0;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(147, 184, 193, 0.2);
      border-radius: 5px;
      background: rgba(17, 35, 44, 0.72);
      color: var(--ink);
      font: inherit;
      font-size: var(--answer-size);
      line-height: 1.25;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    .answer > span:last-child {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .answer-key {
      display: grid;
      width: max(27px, calc(var(--answer-number-size) + 14px));
      height: max(27px, calc(var(--answer-number-size) + 14px));
      flex: 0 0 max(27px, calc(var(--answer-number-size) + 14px));
      place-items: center;
      border: 1px solid rgba(102, 228, 230, 0.34);
      border-radius: 3px;
      color: var(--cyan);
      font-size: var(--answer-number-size);
      font-weight: 700;
    }

    .answer.correct {
      border-color: rgba(117, 230, 174, 0.74);
      background: rgba(24, 91, 67, 0.35);
    }

    .answer.correct .answer-key {
      border-color: #75e6ae;
      color: #75e6ae;
    }

    .answer.incorrect {
      border-color: rgba(255, 130, 120, 0.72);
      background: rgba(112, 42, 43, 0.32);
    }

    .answer.incorrect .answer-key {
      border-color: #ff8278;
      color: #ff8278;
    }

    .answer.dimmed {
      opacity: 0.54;
    }

    .feedback {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: var(--explanation-size);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .ticket-footer {
      padding-top: 12px;
      border-top: 1px solid rgba(126, 207, 213, 0.2);
    }

    .footer-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .boarding-stub {
      position: relative;
      display: grid;
      min-width: 0;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: 21px 20px 17px;
      border-left: 1px dashed rgba(102, 228, 230, 0.48);
      background: linear-gradient(145deg, rgba(16, 39, 49, 0.78), rgba(7, 19, 28, 0.4));
    }

    .round-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.1em;
    }

    .timer-display {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .timer-value {
      color: var(--amber);
      font-size: clamp(64px, 7vw, 88px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
    }

    .timer-unit {
      color: var(--muted);
      text-align: center;
    }

    .timer-track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(159, 186, 194, 0.18);
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(1);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
    }

    .quiz-status {
      display: grid;
      min-height: 37px;
      place-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(102, 228, 230, 0.42);
      border-radius: 4px;
      background: rgba(31, 74, 81, 0.42);
      color: var(--cyan);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
    }

    .quiz-ticket[data-theme="liquid-glass"] {
      --ink: #fff;
      --muted: rgba(245, 249, 255, 0.82);
      --cyan: #a9eaff;
      --amber: #ffe3a3;
      --orange: #ffc9ee;
      --panel: rgba(13, 25, 45, 0.48);
      --line: rgba(255, 255, 255, 0.46);
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 28px;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(255, 255, 255, 0.28), transparent 42%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(179, 218, 255, 0.08) 52%, rgba(255, 255, 255, 0.035)),
        rgba(13, 25, 45, 0.52);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.34),
        inset 0 -18px 42px rgba(147, 186, 255, 0.08),
        0 24px 70px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(28px) saturate(185%);
    }

    .quiz-ticket[data-theme="liquid-glass"] .ticket-main {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.07), transparent 66%);
    }

    .quiz-ticket[data-theme="liquid-glass"] .boarding-stub {
      border-color: rgba(255, 255, 255, 0.4);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(164, 199, 255, 0.055));
    }

    .quiz-ticket[data-theme="liquid-glass"] .answer {
      border-color: rgba(255, 255, 255, 0.52);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.055));
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.16), 0 8px 24px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(14px) saturate(150%);
    }

    .quiz-ticket[data-theme="liquid-glass"] .answer-key {
      border-color: rgba(255, 255, 255, 0.46);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .quiz-ticket[data-theme="liquid-glass"] .answer.correct {
      border-color: rgba(159, 255, 209, 0.9);
      background: linear-gradient(135deg, rgba(87, 231, 167, 0.88), rgba(66, 181, 154, 0.72));
      color: #06271d;
    }

    .quiz-ticket[data-theme="liquid-glass"] .timer-track {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.22), 0 0 18px rgba(143, 222, 255, 0.2);
    }

    .quiz-ticket[data-theme="liquid-glass"] .timer-fill {
      background: linear-gradient(90deg, #6cd9ff, #b9f4ff 48%, #f5bbeb);
    }

    .quiz-ticket[data-theme="liquid-glass"] .quiz-status {
      border-color: rgba(255, 255, 255, 0.46);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
    }

    .quiz-ticket[data-theme="liquid-glass"] .ticket-footer {
      border-color: rgba(255, 255, 255, 0.22);
    }

    .quiz-ticket[data-theme="glassmorphism"] {
      --ink: #f2f7ff;
      --muted: #c1d0e7;
      --cyan: #a9bfff;
      --amber: #f0c4ff;
      --orange: #e6a8ff;
      --panel: rgba(12, 21, 43, 0.48);
      --line: rgba(214, 225, 255, 0.4);
      border: 1px solid rgba(214, 225, 255, 0.42);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.14), transparent 48%),
        linear-gradient(145deg, rgba(22, 38, 72, 0.58), rgba(26, 22, 57, 0.52)),
        rgba(12, 21, 43, 0.48);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 24px 64px rgba(4, 7, 28, 0.42);
      backdrop-filter: blur(24px) saturate(155%);
    }

    .quiz-ticket[data-theme="glassmorphism"] .boarding-stub {
      border-color: rgba(197, 211, 255, 0.42);
      background: linear-gradient(150deg, rgba(112, 132, 203, 0.22), rgba(67, 45, 116, 0.2));
    }

    .quiz-ticket[data-theme="glassmorphism"] .answer {
      border-color: rgba(219, 225, 255, 0.48);
      border-radius: 12px;
      background: linear-gradient(115deg, rgba(119, 144, 226, 0.28), rgba(154, 100, 191, 0.2));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 8px 24px rgba(11, 12, 42, 0.16);
      backdrop-filter: blur(12px);
    }

    .quiz-ticket[data-theme="glassmorphism"] .answer-key {
      border-color: rgba(230, 234, 255, 0.56);
      border-radius: 50%;
      background: rgba(25, 30, 71, 0.34);
    }

    .quiz-ticket[data-theme="glassmorphism"] .answer.correct {
      border-color: rgba(118, 240, 189, 0.9);
      background: linear-gradient(120deg, rgba(57, 205, 157, 0.9), rgba(73, 163, 183, 0.82));
      color: #071d22;
    }

    .quiz-ticket[data-theme="glassmorphism"] .timer-track {
      background: rgba(23, 28, 62, 0.68);
      box-shadow: 0 0 20px rgba(141, 156, 255, 0.16);
    }

    .quiz-ticket[data-theme="glassmorphism"] .timer-fill {
      background: linear-gradient(90deg, #668cff, #ad89ff 55%, #f08edb);
    }

    .quiz-ticket[data-theme="glassmorphism"] .quiz-status {
      border-color: rgba(197, 211, 255, 0.52);
      border-radius: 10px;
      background: rgba(101, 116, 184, 0.2);
    }

    .quiz-ticket[data-theme="aurora"] {
      --ink: #f0fffc;
      --muted: #b7d9d4;
      --cyan: #8dffe1;
      --amber: #d7b4ff;
      --orange: #c49bff;
      --panel: rgba(5, 23, 31, 0.88);
      --line: rgba(141, 255, 225, 0.56);
      border-color: rgba(141, 255, 225, 0.58);
      border-radius: 18px;
      background:
        radial-gradient(ellipse at 5% 10%, rgba(42, 239, 177, 0.2), transparent 42%),
        radial-gradient(ellipse at 96% 100%, rgba(158, 95, 255, 0.23), transparent 46%),
        rgba(5, 23, 31, 0.92);
      box-shadow: 0 0 42px rgba(48, 231, 180, 0.13), 0 20px 55px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(16px);
    }

    .quiz-ticket[data-theme="aurora"] .boarding-stub {
      border-color: rgba(141, 255, 225, 0.46);
      background:
        radial-gradient(ellipse at 20% 5%, rgba(42, 239, 177, 0.16), transparent 56%),
        linear-gradient(150deg, rgba(19, 70, 65, 0.52), rgba(42, 34, 79, 0.4));
    }

    .quiz-ticket[data-theme="aurora"] .answer {
      border-color: rgba(141, 255, 225, 0.66);
      border-radius: 10px;
      background: linear-gradient(105deg, rgba(33, 155, 132, 0.34), rgba(96, 65, 144, 0.3));
    }

    .quiz-ticket[data-theme="aurora"] .answer-key {
      border-color: rgba(141, 255, 225, 0.72);
      border-radius: 50%;
    }

    .quiz-ticket[data-theme="aurora"] .answer.correct {
      border-color: #8affc7;
      background: linear-gradient(105deg, #62eeb7, #9bdbb7);
      color: #08251d;
    }

    .quiz-ticket[data-theme="aurora"] .timer-track {
      background: rgba(8, 41, 46, 0.9);
    }

    .quiz-ticket[data-theme="aurora"] .timer-fill {
      background: linear-gradient(90deg, #52f0bc, #8cebc8 48%, #b18bff);
    }

    .quiz-ticket[data-theme="aurora"] .quiz-status {
      border-color: rgba(141, 255, 225, 0.56);
      background: linear-gradient(105deg, rgba(33, 155, 132, 0.28), rgba(96, 65, 144, 0.26));
    }

    .quiz-ticket[data-theme="minimal-atc"] {
      --ink: #e5f7ff;
      --muted: #9bbcca;
      --cyan: #59dbff;
      --amber: #ffcf70;
      --orange: #38a9d8;
      --panel: rgba(3, 16, 27, 0.96);
      --line: rgba(89, 219, 255, 0.58);
      border: 1px solid rgba(89, 219, 255, 0.72);
      border-left: 6px solid var(--cyan);
      border-right: 1px solid rgba(89, 219, 255, 0.58);
      border-radius: 7px;
      background: rgba(3, 16, 27, 0.96);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45), inset 0 0 30px rgba(89, 219, 255, 0.06);
      backdrop-filter: blur(14px);
    }

    .quiz-ticket[data-theme="minimal-atc"] .ticket-main {
      background: linear-gradient(145deg, rgba(18, 45, 60, 0.42), transparent 68%);
    }

    .quiz-ticket[data-theme="minimal-atc"] .boarding-stub {
      border-left-style: solid;
      border-color: rgba(89, 219, 255, 0.48);
      background: rgba(8, 29, 42, 0.84);
    }

    .quiz-ticket[data-theme="minimal-atc"] .answer {
      border-color: rgba(131, 190, 210, 0.58);
      border-radius: 5px;
      background: rgba(12, 39, 54, 0.86);
    }

    .quiz-ticket[data-theme="minimal-atc"] .answer-key {
      border-color: rgba(89, 219, 255, 0.54);
      border-radius: 3px;
      background: rgba(89, 219, 255, 0.12);
    }

    .quiz-ticket[data-theme="minimal-atc"] .answer.correct {
      border-color: #80f2a5;
      background: rgba(55, 148, 105, 0.86);
      color: #effff7;
    }

    .quiz-ticket[data-theme="minimal-atc"] .timer-value {
      color: var(--cyan);
    }

    .quiz-ticket[data-theme="minimal-atc"] .timer-track {
      height: 6px;
      border-radius: 2px;
      background: rgba(89, 219, 255, 0.15);
    }

    .quiz-ticket[data-theme="minimal-atc"] .timer-fill {
      background: linear-gradient(90deg, #21b7ec, #6be5fa);
    }

    .quiz-ticket[data-theme="minimal-atc"] .quiz-status {
      border-color: rgba(89, 219, 255, 0.48);
      border-radius: 3px;
      background: rgba(18, 45, 60, 0.68);
    }

    @media (max-width: 700px) {
      .quiz-ticket {
        right: 3%;
        bottom: 3%;
        left: 3%;
        height: auto;
        min-height: 0;
        display: flex;
        max-height: 98vh;
        overflow-y: auto;
        flex-direction: column;
      }

      .ticket-main {
        gap: 10px;
        padding: 14px 16px 12px;
      }

      .quiz-header {
        justify-content: space-between;
        gap: 8px;
      }

      .quiz-kind {
        display: none;
      }

      .quiz-kind {
        text-align: left;
      }

      .question-area {
        gap: 9px;
      }

      h1 {
        line-height: 1.15;
      }

      .answers {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .answer {
        min-height: 48px;
        gap: 10px;
        padding: 8px 10px;
      }

      .answer-key {
        width: max(28px, calc(var(--answer-number-size) + 14px));
        height: max(28px, calc(var(--answer-number-size) + 14px));
        flex-basis: max(28px, calc(var(--answer-number-size) + 14px));
      }

      .ticket-footer {
        display: none;
      }

      .boarding-stub {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto minmax(92px, 1fr) auto;
        gap: 7px 10px;
        padding: 9px 16px 11px;
        border-top: 1px dashed rgba(102, 228, 230, 0.48);
        border-left: 0;
      }

      .round-label {
        text-align: right;
      }

      .timer-display {
        grid-column: 1 / -1;
        gap: 5px;
      }

      .timer-value {
        font-size: clamp(56px, 16vw, 76px);
      }

      .timer-track {
        max-width: 240px;
      }

      .quiz-status {
        grid-column: 1 / -1;
        min-height: 44px;
        font-size: 13px;
      }

      .stub-label {
        font-size: 10px;
      }
    }

    @media (max-width: 700px) and (max-height: 720px) {
      .quiz-ticket {
        max-height: 98vh;
      }

      .ticket-main {
        gap: 7px;
        padding: 10px 14px;
      }

      .question-area {
        gap: 7px;
      }

      .answer {
        min-height: 40px;
        padding: 6px 10px;
      }

      .answer-key {
        width: max(24px, calc(var(--answer-number-size) + 14px));
        height: max(24px, calc(var(--answer-number-size) + 14px));
        flex-basis: max(24px, calc(var(--answer-number-size) + 14px));
      }

      .ticket-footer {
        display: none;
      }

      .boarding-stub {
        grid-template-rows: auto minmax(64px, 1fr) auto;
        gap: 5px 8px;
        padding: 6px 12px 8px;
      }

      .timer-value {
        font-size: 46px;
      }

      .timer-display {
        gap: 3px;
      }

      .timer-unit,
      .stub-label {
        font-size: 8px;
      }

      .quiz-status {
        min-height: 36px;
        font-size: 11px;
      }

    }
  </style>
</head>
<body>
  <main class="overlay" aria-label="Aviation quiz overlay">
    <article class="quiz-ticket" id="quiz-ticket" data-theme="flight-deck">
      <section class="ticket-main" aria-live="polite">
        <header class="quiz-header">
          <div class="brand"><span class="signal" aria-hidden="true"></span>Sky Stations</div>
          <span class="quiz-kind">Boarding pass <span class="airline-name" id="airline-name"></span></span>
        </header>

        <div class="question-area">
          <h1 id="question">Waiting for the host...</h1>
          <div class="answers" id="answers" role="list" aria-label="Answer options"></div>
          <p class="feedback" id="feedback">Open Quiz Control and publish a question to begin.</p>
        </div>

        <footer class="ticket-footer">
          <span class="footer-label">Choose an answer before time runs out</span>
        </footer>
      </section>

      <aside class="boarding-stub" aria-label="Quiz timer and status">
        <span class="stub-label">Aviation quiz</span>
        <span class="round-label" id="round-label">WAITING</span>
        <div class="timer-display">
          <span class="timer-value" id="timer-value">--</span>
          <span class="timer-unit">Seconds left</span>
          <div class="timer-track" id="timer-track" role="progressbar" aria-label="Time to answer" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0">
            <div class="timer-fill" id="timer-fill"></div>
          </div>
        </div>
        <div class="quiz-status" id="quiz-status">WAITING FOR HOST</div>
      </aside>
    </article>
  </main>

  <script>
    const quizTicket = document.getElementById("quiz-ticket");
    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");
    const roundLabel = document.getElementById("round-label");
    const timerFill = document.getElementById("timer-fill");
    const timerValue = document.getElementById("timer-value");
    const timerTrack = document.getElementById("timer-track");
    const quizStatus = document.getElementById("quiz-status");
    const overlayThemes = QuizAirline.themes;

    let timerId = 0;
    let currentQuiz = null;
    let serverTimeOffset = 0;

    function applyRemoteTextSizes(snapshot) {
      const sizes = snapshot.exists() ? snapshot.val() : {};
      if (!sizes || typeof sizes !== "object") {
        console.error("Firebase returned invalid quiz text sizes:", sizes);
        return;
      }

      [
        ["question", "--question-size", 28, 50, 40],
        ["answer", "--answer-size", 18, 80, 44],
        ["answerNumber", "--answer-number-size", 13, 48, 13],
        ["explanation", "--explanation-size", 14, 48, 14]
      ].forEach(function (setting) {
        const value = Object.prototype.hasOwnProperty.call(sizes, setting[0]) ? sizes[setting[0]] : setting[4];
        if (!Number.isInteger(value) || value < setting[2] || value > setting[3]) {
          console.error("Invalid Firebase quiz text size:", setting[0], value);
          return;
        }
        document.documentElement.style.setProperty(setting[1], value + "px");
      });
    }

    function applyRemoteDesignTheme(snapshot) {
      const theme = snapshot.exists() ? snapshot.val() : "flight-deck";
      if (typeof theme !== "string" || !overlayThemes.includes(theme)) {
        console.error("Invalid Firebase quiz overlay design:", theme);
        return;
      }

      quizTicket.dataset.theme = theme;
    }

    function updateTimer(secondsLeft, durationSeconds) {
      const progress = durationSeconds > 0
        ? Math.max(0, Math.min(1, secondsLeft / durationSeconds))
        : 0;
      timerFill.style.transform = "scaleX(" + progress + ")";
      timerValue.textContent = String(Math.max(0, Math.ceil(secondsLeft)));
      timerTrack.setAttribute("aria-valuemax", String(durationSeconds));
      timerTrack.setAttribute("aria-valuenow", String(Math.max(0, Math.ceil(secondsLeft))));
    }

    function clearTimer() {
      window.clearInterval(timerId);
      timerId = 0;
    }

    function showWaiting(message, status) {
      clearTimer();
      currentQuiz = null;
      questionElement.textContent = message;
      answersElement.replaceChildren();
      feedbackElement.textContent = "";
      roundLabel.textContent = "WAITING";
      timerValue.textContent = "--";
      timerFill.style.transform = "scaleX(0)";
      timerTrack.setAttribute("aria-valuemax", "1");
      timerTrack.setAttribute("aria-valuenow", "0");
      quizStatus.textContent = status || "WAITING FOR HOST";
    }

    function renderAnswers(quiz, revealAnswer) {
      answersElement.replaceChildren();
      quiz.answers.forEach(function (answer, index) {
        const row = document.createElement("div");
        const key = document.createElement("span");
        const label = document.createElement("span");
        row.className = "answer";
        row.setAttribute("role", "listitem");
        if (revealAnswer) {
          row.classList.add(index === quiz.correctIndex ? "correct" : "dimmed");
        }
        key.className = "answer-key";
        key.textContent = String(index + 1);
        label.textContent = answer;
        row.append(key, label);
        answersElement.appendChild(row);
      });
    }

    function revealCurrentAnswer(timedOut) {
      if (!currentQuiz) return;
      clearTimer();
      renderAnswers(currentQuiz, true);
      feedbackElement.textContent = (timedOut ? "Time's up. " : "") + currentQuiz.explanation;
      quizStatus.textContent = timedOut ? "TIME UP" : "ANSWER";
    }

    function renderQuizState(state) {
      if (!state || state.status === "idle") {
        showWaiting("Waiting for the host to publish a question.", "WAITING FOR HOST");
        return;
      }

      if (state.status === "complete") {
        showWaiting("Quiz complete. Thanks for playing!", "QUIZ COMPLETE");
        return;
      }

      const durationSeconds = Number(state.durationSeconds);
      const endsAt = Number(state.endsAt);
      if ((state.status !== "active" && state.status !== "revealed") ||
          typeof state.question !== "string" ||
          !Array.isArray(state.answers) ||
          state.answers.length !== 4 ||
          !state.answers.every(function (answer) { return typeof answer === "string"; }) ||
          !Number.isInteger(Number(state.correctIndex)) ||
          Number(state.correctIndex) < 0 ||
          Number(state.correctIndex) >= state.answers.length ||
          !Number.isFinite(durationSeconds) || durationSeconds < 5 || durationSeconds > 120 ||
          !Number.isFinite(endsAt)) {
        showWaiting("The host sent invalid quiz data. Please republish the question.", "INVALID QUIZ DATA");
        return;
      }

      clearTimer();
      currentQuiz = {
        question: state.question,
        answers: state.answers,
        correctIndex: Number(state.correctIndex),
        explanation: typeof state.explanation === "string" ? state.explanation : "",
        durationSeconds: durationSeconds,
        endsAt: endsAt
      };
      questionElement.textContent = currentQuiz.question;

      const questionNumber = Number(state.questionNumber);
      const totalQuestions = Number(state.totalQuestions);
      roundLabel.textContent = Number.isInteger(questionNumber) && questionNumber > 0
        ? "QUESTION " + String(questionNumber).padStart(2, "0") +
          (Number.isInteger(totalQuestions) && totalQuestions >= questionNumber
            ? " / " + String(totalQuestions).padStart(2, "0")
            : "")
        : "LIVE QUESTION";

      const remaining = Math.max(0, (endsAt - (Date.now() + serverTimeOffset)) / 1000);
      updateTimer(remaining, durationSeconds);
      renderAnswers(currentQuiz, state.status === "revealed");

      if (state.status === "revealed") {
        feedbackElement.textContent = currentQuiz.explanation;
        quizStatus.textContent = "ANSWER";
        return;
      }

      feedbackElement.textContent = "Choose an answer before the timer ends.";
      quizStatus.textContent = "QUESTION LIVE";

      function tick() {
        const secondsLeft = Math.max(0, (endsAt - (Date.now() + serverTimeOffset)) / 1000);
        updateTimer(secondsLeft, durationSeconds);
        if (secondsLeft <= 0) revealCurrentAnswer(true);
      }

      tick();
      if (currentQuiz) timerId = window.setInterval(tick, 100);
    }

    function showFirebaseError(message, error) {
      if (error) console.error(message, error);
      showWaiting(message, "FIREBASE ERROR");
    }

    if (typeof firebase === "undefined") {
      showFirebaseError("Firebase could not load. Check the network connection.");
    } else {
      try {
        firebase.initializeApp({
          databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/"
        });
        const database = firebase.database();
        QuizAirline.connectOverlay(database.ref("quizAirlineSettings"), quizTicket, document.getElementById("airline-name"));
        database.ref(".info/serverTimeOffset").on("value", function (snapshot) {
          const value = snapshot.val();
          const offset = Number(value);
          if (typeof value === "number" && Number.isFinite(offset)) {
            serverTimeOffset = offset;
          }
        }, function (error) {
          console.error("Firebase server clock unavailable:", error);
        });
        database.ref("quizOverlayState").on("value", function (snapshot) {
          renderQuizState(snapshot.val());
        }, function (error) {
          showFirebaseError("Couldn't read the live quiz. Check Firebase database permissions.", error);
        });
        database.ref("quizOverlaySettings/fontSizes").on("value", applyRemoteTextSizes, function (error) {
          console.error("Firebase text-size listener failed:", error);
        });
        database.ref("quizOverlaySettings/designTheme").on("value", applyRemoteDesignTheme, function (error) {
          console.error("Firebase overlay-design listener failed:", error);
        });
      } catch (error) {
        showFirebaseError("Couldn't connect to Firebase. Check the database configuration.", error);
      }
    }

  </script>
</body>
</html>
