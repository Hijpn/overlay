<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- Leaflet CSS & JS for Interactive Radar Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

        :root {
            --top-bg: rgba(6, 21, 45, 0.85);
            --top-border-color: #38bdf8;
            --bottom-border-color: #F9A53E;
            --bar-width: 92%;
            --bar-height: 82px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.chroma-green {
            background-color: #00b140;
        }

        /* ================= CONTROL PANEL ================= */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 440px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            background: rgba(13, 27, 42, 0.96);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        #control-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .panel-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #F9A53E;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-group label span {
            color: #38bdf8;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #F9A53E;
            cursor: pointer;
        }

        /* Mini Radar Map inside Control Panel */
        #radar-container {
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
        }

        #radar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #1e293b;
            font-size: 10px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        #radar-map {
            width: 100%;
            height: 165px;
            z-index: 1;
        }

        .dark-map-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .btn-mini {
            padding: 4px 8px;
            font-size: 10px;
            background: #38bdf8;
            color: #0d1b2a;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn-mini:hover {
            background: #7dd3fc;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button.main-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-orange {
            background: #F9A53E;
            color: #0d1b2a;
        }

        .btn-orange:hover {
            background: #e08e29;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 16px;
            font-weight: 600;
        }

        /* ================= BROADCAST OVERLAY RESPONSIVO ================= */
        .overlay-wrapper {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: var(--bar-width, 92%);
            max-width: 1600px;
            transition: width 0.1s ease;
        }

        .broadcast-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--bar-height, 82px);
            padding: 0 clamp(12px, 2vw, 28px);
            border-radius: 12px;
            background: var(--top-bg, rgba(6, 21, 45, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 2px solid var(--top-border-color, #38bdf8);
            border-bottom: 2px solid var(--bottom-border-color, #F9A53E);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            gap: clamp(8px, 1.5vw, 20px);
        }

        .divider-v {
            width: 2px;
            height: 55%;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        /* Left: Weather Section */
        .weather-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(8px, 1.2vw, 14px);
            color: #ffffff;
            flex: 1;
            min-width: 0;
        }

        .weather-icon {
            width: clamp(36px, 4vw, 46px);
            height: clamp(36px, 4vw, 46px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .weather-icon:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .city-title {
            font-size: clamp(11px, 1.2vw, 15px);
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .weather-top-row {
            display: flex;
            align-items: baseline;
            gap: clamp(6px, 1vw, 10px);
        }

        .main-temp {
            font-size: clamp(20px, 2.5vw, 32px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .condition-text {
            font-size: clamp(11px, 1.2vw, 14px);
            font-weight: 600;
            color: #cbd5e1;
        }

        .weather-details {
            display: flex;
            gap: 6px;
            font-size: clamp(9px, 1vw, 12px);
            font-weight: 600;
            color: #94a3b8;
            margin-top: 3px;
        }

        .weather-details span {
            color: #e2e8f0;
        }

        /* Center: Flight Tracking Block */
        .flight-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.5vw, 16px);
            color: #ffffff;
            flex: 1.3;
            min-width: 0;
        }

        .flag-box {
            width: clamp(38px, 4vw, 48px);
            height: clamp(26px, 3vw, 32px);
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
        }

        .flag-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flight-main-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .flight-sub-header {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .callsign-text {
            font-size: clamp(12px, 1.3vw, 16px);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            color: #F9A53E;
        }

        .airline-badge {
            font-size: clamp(9px, 1vw, 11px);
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .route-text {
            font-size: clamp(14px, 1.8vw, 22px);
            font-weight: 800;
            color: #ffffff;
            margin-top: 2px;
            line-height: 1.1;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .route-arrow {
            color: #38bdf8;
            font-weight: 800;
        }

        .aircraft-telemetry {
            display: flex;
            gap: 8px;
            font-size: clamp(8px, 0.9vw, 10px);
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .aircraft-telemetry span {
            color: #e2e8f0;
        }

        /* Right: Clock Section with Static Live Indicator */
        .clock-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(8px, 1.2vw, 14px);
            color: #ffffff;
            flex: 1;
            min-width: 0;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: clamp(4px, 0.8vw, 6px) clamp(8px, 1vw, 12px);
            border-radius: 20px;
            white-space: nowrap;
        }

        .live-icon svg {
            display: block;
            fill: #ef4444;
        }

        .live-text {
            font-size: clamp(10px, 1.1vw, 12px);
            font-weight: 800;
            color: #fca5a5;
            letter-spacing: 0.5px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            white-space: nowrap;
        }

        .clock-time {
            font-size: clamp(22px, 2.8vw, 36px);
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: clamp(10px, 1.1vw, 13px);
            font-weight: 600;
            color: #cbd5e1;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .broadcast-bar {
                padding: 0 12px;
            }
            .divider-v {
                margin: 0 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="panel-header">
            <h3>Sky Stations • Control Panel</h3>
            <button class="main-btn btn-secondary" style="flex:0; padding:4px 10px;" onclick="togglePanel()">Hide</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Bar Width <span id="val-width">92%</span></label>
                <input type="range" id="slider-width" min="60" max="98" value="92" oninput="updateBarDimensions()">
            </div>
            <div class="form-group">
                <label>Bar Height <span id="val-height">82px</span></label>
                <input type="range" id="slider-height" min="68" max="120" value="82" oninput="updateBarDimensions()">
            </div>
        </div>

        <div id="radar-container">
            <div id="radar-header">
                <span>Live Radar (adsb.lol via Proxy)</span>
                <button class="btn-mini" onclick="refreshRadarFlights()">Scan Area</button>
            </div>
            <div id="radar-map"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City for Weather</label>
                <div style="display: flex; gap: 4px;">
                    <input type="text" id="input-city" value="Nagoya" placeholder="Ex: Nagoya, Osaka..." onchange="fetchAndApplyWeather(this.value)">
                    <button class="btn-mini" onclick="fetchAndApplyWeather(document.getElementById('input-city').value)">Go</button>
                </div>
            </div>

            <div class="form-group">
                <label>Flight Callsign</label>
                <input type="text" id="input-callsign" value="JAL921" placeholder="Ex: JAL921">
            </div>
        </div>

        <div class="form-group">
            <label>Route Display Label (Auto-City)</label>
            <input type="text" id="input-route" value="N/A → N/A" placeholder="Auto from ADS-B; N/A if unavailable">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Country Code (Flag)</label>
                <input type="text" id="input-country" value="JP" placeholder="Ex: JP, US...">
            </div>

            <div class="form-group">
                <label>Aircraft Model</label>
                <input type="text" id="input-aircraft" value="Boeing 787-8" placeholder="Ex: B788, N/A...">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Altitude (Feet)</label>
                <input type="text" id="input-altitude" value="35000 ft" placeholder="Ex: 35000 ft">
            </div>
            <div class="form-group">
                <label>Speed (Knots)</label>
                <input type="text" id="input-speed" value="480 kts" placeholder="Ex: 480 kts">
            </div>
        </div>

        <div class="form-group">
            <label>Live Status Label</label>
            <input type="text" id="input-live-label" value="LIVE NOW" placeholder="Ex: LIVE NOW, ON AIR...">
        </div>

        <div class="btn-row">
            <button class="main-btn btn-orange" onclick="pushSettingsToFirebase()">Update & Sync Overlay</button>
            <button class="main-btn btn-secondary" onclick="toggleChroma()">Chroma Green</button>
        </div>
        <div class="status-text" id="status-msg">Ready. Click weather icon anytime to open/close.</div>
    </div>

    <!-- Main Broadcast Overlay -->
    <div class="overlay-wrapper" id="overlay-wrapper">
        <div class="broadcast-bar">
            <!-- Left: Weather Section -->
            <div class="weather-section">
                <div class="weather-icon" id="weather-icon" onclick="togglePanel()" title="Click to open settings"></div>
                <div class="weather-info">
                    <div class="city-title" id="display-city-name">Nagoya</div>
                    <div class="weather-top-row">
                        <span class="main-temp" id="display-temp">--°C</span>
                        <span class="condition-text" id="display-condition">Loading...</span>
                    </div>
                    <div class="weather-details">
                        Wind: <span id="display-wind">-- km/h N</span>
                        &bull;
                        Pres: <span id="display-pressure">---- hPa</span>
                    </div>
                </div>
            </div>

            <div class="divider-v"></div>

            <!-- Center: Flight Tracking Block -->
            <div class="flight-block">
                <div class="flag-box">
                    <img id="display-flag-img" src="https://flagcdn.com/w80/jp.png" alt="Country Flag" onerror="this.src='https://flagcdn.com/w80/un.png'">
                </div>
                <div class="flight-main-info">
                    <div class="flight-sub-header">
                        <span class="callsign-text" id="display-callsign">JAL921</span>
                        <span class="airline-badge" id="display-airline">Japan Airlines</span>
                    </div>
                    <div class="route-text" id="display-route">
                        N/A <span class="route-arrow">&rarr;</span> N/A
                    </div>
                    <div class="aircraft-telemetry">
                        <span id="display-aircraft">B788</span> &bull; Alt: <span id="display-altitude">35000 ft</span> &bull; Spd: <span id="display-speed">480 kts</span>
                    </div>
                </div>
            </div>

            <div class="divider-v"></div>

            <!-- Right: Clock Section with Static Live Indicator -->
            <div class="clock-section">
                <div class="live-indicator">
                    <span class="live-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                        </svg>
                    </span>
                    <span class="live-text" id="display-live-label">LIVE NOW</span>
                </div>

                <div class="time-box">
                    <span class="clock-time" id="display-time">00:00</span>
                    <span class="clock-date" id="display-date">--------- --, ----</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/"
        };

        const AIRPORT_CODE_MAP = {
            "HND": "Tokyo", "NRT": "Tokyo", "KIX": "Osaka", "ITM": "Osaka",
            "NGO": "Nagoya", "CTS": "Sapporo", "FUK": "Fukuoka", "OKA": "Okinawa",
            "KOJ": "Kagoshima", "KMJ": "Kumamoto", "NGA": "Niigata", "SDJ": "Sendai",
            "TAK": "Takamatsu", "KIJ": "Niigata", "KKJ": "Kitakyushu", "FSZ": "Shizuoka",
            "AOJ": "Aomori", "HKD": "Hakodate", "IBR": "Ibaraki", "MYJ": "Matsuyama",
            "OIT": "Oita", "UBJ": "Ube", "MZV": "Matsumoto", "TPE": "Taipei", "ICN": "Seoul"
        };

        const AIRLINE_MAP = {
            "JAL": "Japan Airlines", "ANA": "All Nippon Airways", "EVA": "EVA Air",
            "CAL": "China Airlines", "FDA": "Fuji Dream Airlines", "SKY": "Skymark",
            "ADO": "Air Do", "SNJ": "Solaseed Air", "SFJ": "StarFlyer",
            "APJ": "Peach Aviation", "JJP": "Jetstar Japan", "KAL": "Korean Air",
            "AAR": "Asiana Airlines", "CPA": "Cathay Pacific", "SIA": "Singapore Airlines",
            "THA": "Thai Airways", "UAL": "United Airlines", "DAL": "Delta Air Lines",
            "AAL": "American Airlines"
        };

        let selectedCallsign = null; // Guarda o voo selecionado para atualizar em tempo real

        function getAirlineName(callsign) {
            if (!callsign) return "";
            const prefix = callsign.replace(/[^A-Za-z]/g, '').toUpperCase().substring(0, 3);
            return AIRLINE_MAP[prefix] || prefix;
        }

        function getCityName(code) {
            const cleanCode = code ? code.trim().toUpperCase() : "";
            return AIRPORT_CODE_MAP[cleanCode] || cleanCode;
        }

        function formatRouteWithCities(routeString) {
            if (!routeString || !routeString.includes('→')) {
                return routeString || "N/A <span class=\"route-arrow\">&rarr;</span> N/A";
            }
            const parts = routeString.split('→').map(s => s.trim());
            const origCode = parts[0];
            const destCode = parts.length > 1 ? parts[1] : "";
            
            const origCity = getCityName(origCode);
            const destCity = getCityName(destCode);

            return `${origCity} <span class="route-arrow">&rarr;</span> ${destCity}`;
        }

        const NO_ROUTE_LABEL = "N/A → N/A";

        async function resolveAircraftRoute(aircraft) {
            const callsign = (aircraft.flight || "").trim().toUpperCase();
            let routeLabel = NO_ROUTE_LABEL;

            if (callsign.length < 3) return routeLabel;

            try {
                const routeUrl = `https://vrs-standing-data.adsb.lol/routes/${callsign.slice(0, 2)}/${encodeURIComponent(callsign)}.json`;
                const response = await fetch(routeUrl);
                if (response.status === 404) return routeLabel;
                if (!response.ok) throw new Error(`Route lookup HTTP ${response.status}`);

                const route = await response.json();
                const airportCodes = route._airport_codes_iata && route._airport_codes_iata !== "unknown"
                    ? route._airport_codes_iata
                    : route.airport_codes;
                const codes = (airportCodes || "")
                    .split("-")
                    .map(code => code.trim().toUpperCase())
                    .filter(code => /^[A-Z0-9]{3,4}$/.test(code));

                if (codes.length >= 2) {
                    routeLabel = `${codes[0]} → ${codes[codes.length - 1]}`;
                }
            } catch (err) {
                console.error("Route lookup error:", err);
            }

            return routeLabel;
        }

        let db = null;
        let settingsRef = null;
        try {
            if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("http")) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                settingsRef = db.ref("flightOverlaySettings");
            }
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        function updateBarDimensions() {
            const widthVal = document.getElementById('slider-width').value;
            const heightVal = document.getElementById('slider-height').value;

            document.getElementById('val-width').innerText = `${widthVal}%`;
            document.getElementById('val-height').innerText = `${heightVal}px`;

            document.documentElement.style.setProperty('--bar-width', `${widthVal}%`);
            document.documentElement.style.setProperty('--bar-height', `${heightVal}px`);
        }

        let map = null;
        let aircraftLayer = null;
        let currentLat = 35.1815;
        let currentLon = 136.9066;

        function initRadarMap() {
            map = L.map('radar-map', {
                center: [currentLat, currentLon],
                zoom: 8,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 15,
                className: 'dark-map-tiles'
            }).addTo(map);

            aircraftLayer = L.layerGroup().addTo(map);
            refreshRadarFlights();
            
            // Sem chave da API, consultar a cada 4 minutos ajuda a evitar o limite diário.
            setInterval(refreshRadarFlights, 240000);
        }

        function deriveCountryFromReg(reg) {
            if (reg) {
                const r = reg.toUpperCase();
                if (r.startsWith("JA")) return "JP";
                if (r.startsWith("N")) return "US";
                if (r.startsWith("B-")) return "CN";
                if (r.startsWith("HL")) return "KR";
                if (r.startsWith("VH")) return "AU";
                if (r.startsWith("G-")) return "GB";
                if (r.startsWith("F-")) return "FR";
                if (r.startsWith("D-")) return "DE";
                if (r.startsWith("C-")) return "CA";
                if (r.startsWith("9V")) return "SG";
                if (r.startsWith("HS")) return "TH";
                if (r.startsWith("RP")) return "PH";
                if (r.startsWith("VN")) return "VN";
            }
            return "JP";
        }

        async function refreshRadarFlights() {
            const statusEl = document.getElementById('status-msg');
            if (!map) return;

            const center = map.getCenter();

            try {
                const workerUrl = `https://square-salad-3dab.iharuji.workers.dev/radar?lat=${center.lat.toFixed(4)}&lon=${center.lng.toFixed(4)}`;

                const res = await fetch(workerUrl);
                if (!res.ok) throw new Error(`Radar HTTP ${res.status}`);
                const data = await res.json();
 
                aircraftLayer.clearLayers();

                if (!data.ac || data.ac.length === 0) {
                    statusEl.innerText = "No aircraft detected in this area.";
                    return;
                }

                let count = 0;
                data.ac.forEach(ac => {
                    if (ac.lat && ac.lon) {
                        count++;
                        const callsign = (ac.flight || ac.r || ac.hex || "N/A").trim().toUpperCase();
                        const model = ac.t || "N/A";
                        const reg = ac.r || "";
                        const track = ac.track || 0;
                        
                        let altFeet = "0 ft";
                        if (ac.alt_baro !== undefined && ac.alt_baro !== "ground") {
                            altFeet = `${ac.alt_baro} ft`;
                        } else if (ac.alt_geom !== undefined) {
                            altFeet = `${ac.alt_geom} ft`;
                        }

                        let speedKnots = (ac.gs !== undefined) ? `${Math.round(ac.gs)} kts` : "0 kts";

                        let routeStr = NO_ROUTE_LABEL;
                        if (ac.from && ac.to) {
                            routeStr = `${ac.from} → ${ac.to}`;
                        }

                        // Se este é o avião selecionado, atualiza a altitude e velocidade em tempo real!
                        if (selectedCallsign && callsign === selectedCallsign) {
                            const altitudeInput = document.getElementById('input-altitude');
                            const speedInput = document.getElementById('input-speed');
                            const telemetryChanged = altitudeInput.value !== altFeet || speedInput.value !== speedKnots;

                            document.getElementById('display-altitude').innerText = altFeet;
                            document.getElementById('display-speed').innerText = speedKnots;
                            altitudeInput.value = altFeet;
                            speedInput.value = speedKnots;

                            if (settingsRef && telemetryChanged) {
                                settingsRef.update({ altitude: altFeet, speed: speedKnots })
                                    .catch(err => console.error("Telemetry sync error:", err));
                            }
                        }

                        const planeIcon = L.divIcon({
                            className: 'custom-plane-icon',
                            html: `<div style="transform: rotate(${track}deg); color: #F9A53E; font-size: 16px; text-shadow: 0 0 4px #000; cursor: pointer;">&#9992;</div>`,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        const marker = L.marker([ac.lat, ac.lon], { icon: planeIcon });
                        marker.bindTooltip(`${callsign} (${model}) - ${altFeet}`, { direction: 'top' });

                        marker.on('click', () => {
                            selectedCallsign = callsign; // Define o avião para rastreamento ao vivo
                            const country = deriveCountryFromReg(reg);
                            document.getElementById('input-callsign').value = callsign;
                            document.getElementById('input-aircraft').value = model;
                            document.getElementById('input-country').value = country;
                            document.getElementById('input-route').value = routeStr;
                            document.getElementById('input-altitude').value = altFeet;
                            document.getElementById('input-speed').value = speedKnots;

                            document.getElementById('display-callsign').innerText = callsign;
                            document.getElementById('display-airline').innerText = getAirlineName(callsign);
                            document.getElementById('display-route').innerHTML = formatRouteWithCities(NO_ROUTE_LABEL);
                            document.getElementById('display-aircraft').innerText = model;
                            document.getElementById('display-altitude').innerText = altFeet;
                            document.getElementById('display-speed').innerText = speedKnots;
                            document.getElementById('display-flag-img').src = `https://flagcdn.com/w80/${country.toLowerCase()}.png`;

                            statusEl.innerText = `Tracking ${callsign} live (Alt & Spd updating).`;
                            resolveAircraftRoute(ac).then(route => {
                                if (selectedCallsign !== callsign) return;
                                document.getElementById('input-route').value = route;
                                document.getElementById('display-route').innerHTML = formatRouteWithCities(route);
                                pushSettingsToFirebase();
                            });
                        });

                        marker.addTo(aircraftLayer);
                    }
                });

                statusEl.innerText = `Radar updated: ${count} aircraft found. Click any plane to track live.`;
            } catch (err) {
                console.error("Radar fetch error:", err);
                statusEl.innerText = err.message.includes("HTTP 429")
                    ? "Radar rate limit (HTTP 429)."
                    : "Radar update failed. Check console for details.";
            }
        }

        const weatherIcons = {
            clear: `<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="24" cy="24" r="11" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/><line x1="11" y1="11" x2="14" y2="14"/><line x1="37" y1="11" x2="34" y2="14"/><line x1="11" y1="37" x2="14" y2="34"/></g><path d="M46 46H22a10 10 0 0 1-1.5-19.9A13 13 0 0 1 45.8 29 8.5 8.5 0 0 1 46 46z" fill="#ffffff"/></svg>`,
            cloudy: `<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M48 46H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 27 9.5 9.5 0 0 1 48 46z" fill="#e2e8f0"/></svg>`,
            rain: `<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M48 40H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 21 9.5 9.5 0 0 1 48 40z" fill="#cbd5e1"/><g stroke="#38bdf8" stroke-width="3" stroke-linecap="round"><line x1="22" y1="46" x2="19" y2="54"/><line x1="32" y1="46" x2="29" y2="54"/><line x1="42" y1="46" x2="39" y2="54"/></g></svg>`
        };

        document.getElementById('weather-icon').innerHTML = weatherIcons.partlyCloudy;

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show') && map) {
                setTimeout(() => map.invalidateSize(), 250);
            }
        }

        function toggleChroma() {
            document.body.classList.toggle('chroma-green');
        }

        function getWindDirection(deg) {
            if (deg === undefined || deg === null) return "N";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return dirs[Math.round(deg / 45) % 8];
        }

        function interpretWeatherCode(code) {
            if (code === 0) return { label: "Clear Sky", icon: weatherIcons.clear };
            if (code === 1 || code === 2) return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
            if (code === 3) return { label: "Overcast", icon: weatherIcons.cloudy };
            if (code >= 45 && code <= 48) return { label: "Foggy", icon: weatherIcons.cloudy };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: "Rain", icon: weatherIcons.rain };
            if (code >= 71 && code <= 77) return { label: "Snow", icon: weatherIcons.cloudy };
            if (code >= 95) return { label: "Thunderstorm", icon: weatherIcons.rain };
            return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
        }

        async function fetchAndApplyWeather(city) {
            const statusEl = document.getElementById('status-msg');
            if (!city || city.trim() === "") return;

            statusEl.innerText = `Searching weather & radar for ${city}...`;
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.trim())}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) {
                    statusEl.innerText = `City "${city}" not found.`;
                    return;
                }
                
                const { latitude, longitude, name } = geoData.results[0];
                currentLat = latitude;
                currentLon = longitude;

                document.getElementById('display-city-name').innerText = name;

                if (map) {
                    map.setView([currentLat, currentLon], 8);
                    refreshRadarFlights();
                }

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,weather_code`);
                const weatherData = await weatherRes.json();
                
                const cur = weatherData.current;
                const temp = Math.round(cur.temperature_2m);
                const pressure = Math.round(cur.pressure_msl);
                const windSpeed = Math.round(cur.wind_speed_10m);
                const windDir = getWindDirection(cur.wind_direction_10m);
                const info = interpretWeatherCode(cur.weather_code);

                document.getElementById('display-temp').innerText = `${temp}°C`;
                document.getElementById('display-condition').innerText = info.label;
                document.getElementById('weather-icon').innerHTML = info.icon;
                document.getElementById('display-wind').innerText = `${windSpeed} km/h ${windDir}`;
                document.getElementById('display-pressure').innerText = `${pressure} hPa`;

                statusEl.innerText = `Weather updated for ${name}.`;
            } catch (err) {
                console.error("Weather fetch error:", err);
                statusEl.innerText = "Failed to fetch weather data.";
            }
        }

        function pushSettingsToFirebase() {
            const cityVal = document.getElementById('input-city').value.trim() || "Nagoya";
            const rawRoute = document.getElementById('input-route').value.trim() || "N/A → N/A";
            
            const payload = {
                city: cityVal,
                callsign: document.getElementById('input-callsign').value.trim() || "N/A",
                route: rawRoute,
                country: document.getElementById('input-country').value.trim() || "JP",
                aircraft: document.getElementById('input-aircraft').value.trim() || "N/A",
                altitude: document.getElementById('input-altitude').value.trim() || "35000 ft",
                speed: document.getElementById('input-speed').value.trim() || "480 kts",
                liveLabel: document.getElementById('input-live-label').value.trim() || "",
                barWidth: document.getElementById('slider-width').value,
                barHeight: document.getElementById('slider-height').value
            };

            applySettingsObject(payload);
            fetchAndApplyWeather(cityVal);

            if (settingsRef) {
                settingsRef.set(payload).then(() => {
                    document.getElementById('status-msg').innerText = "Synced with Firebase!";
                }).catch(() => {
                    document.getElementById('status-msg').innerText = "Local update applied (Firebase offline).";
                });
            }
        }

        function applySettingsObject(data) {
            if (!data) return;

            if (data.barWidth) {
                document.getElementById('slider-width').value = data.barWidth;
                document.getElementById('val-width').innerText = `${data.barWidth}%`;
                document.documentElement.style.setProperty('--bar-width', `${data.barWidth}%`);
            }
            if (data.barHeight) {
                document.getElementById('slider-height').value = data.barHeight;
                document.getElementById('val-height').innerText = `${data.barHeight}px`;
                document.documentElement.style.setProperty('--bar-height', `${data.barHeight}px`);
            }
            if (data.city) {
                document.getElementById('input-city').value = data.city;
                document.getElementById('display-city-name').innerText = data.city;
            }
            if (data.callsign) {
                document.getElementById('input-callsign').value = data.callsign;
                document.getElementById('display-callsign').innerText = data.callsign;
                document.getElementById('display-airline').innerText = getAirlineName(data.callsign);
            }
            if (data.route) {
                document.getElementById('input-route').value = data.route;
                document.getElementById('display-route').innerHTML = formatRouteWithCities(data.route);
            }
            if (data.country) {
                document.getElementById('input-country').value = data.country;
                document.getElementById('display-flag-img').src = `https://flagcdn.com/w80/${data.country.toLowerCase()}.png`;
            }
            if (data.aircraft) {
                document.getElementById('input-aircraft').value = data.aircraft;
                document.getElementById('display-aircraft').innerText = data.aircraft;
            }
            if (data.altitude) {
                document.getElementById('input-altitude').value = data.altitude;
                document.getElementById('display-altitude').innerText = data.altitude;
            }
            if (data.speed) {
                document.getElementById('input-speed').value = data.speed;
                document.getElementById('display-speed').innerText = data.speed;
            }
            if (data.liveLabel !== undefined) {
                document.getElementById('input-live-label').value = data.liveLabel;
                document.getElementById('display-live-label').innerText = data.liveLabel;
            }
        }

        if (settingsRef) {
            settingsRef.on("value", (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    applySettingsObject(data);

                    const previousCallsign = selectedCallsign;
                    const callsign = (data.callsign || "").trim().toUpperCase();
                    selectedCallsign = callsign && callsign !== "N/A" ? callsign : null;
                    if (selectedCallsign && selectedCallsign !== previousCallsign) {
                        resolveAircraftRoute({ flight: callsign }).then(route => {
                            if (selectedCallsign !== callsign || document.getElementById('input-callsign').value.trim().toUpperCase() !== callsign) return;
                            document.getElementById('input-route').value = route;
                            document.getElementById('display-route').innerHTML = formatRouteWithCities(route);
                        });
                    }
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('display-time').innerText = `${hours}:${minutes}`;

            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('display-date').innerText = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
        window.onload = () => {
            initRadarMap();
            fetchAndApplyWeather(document.getElementById('input-city').value);
        };
    </script>
</body>
</html>
