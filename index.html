<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sky Stations - Live Overlay</title>
<style>
  :root {
    --accent-blue: #3b82f6;
    --accent-orange: #f97316;
    --bg-glass: rgba(10, 15, 26, .85);
    --border: rgba(148, 163, 184, .25);
    --text: #ffffff;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  
  /* ===== OVERLAY ===== */
  .overlay {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 0 clamp(10px, 1.5vw, 30px) clamp(10px, 1.5vw, 30px);
  }
  .bar {
    position: relative; background: var(--bg-glass);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: clamp(10px, 1vw, 16px);
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    display: flex; flex-direction: column;
    padding: clamp(10px, 1vw, 16px) clamp(16px, 1.5vw, 24px);
    gap: clamp(6px, .8vw, 12px);
    overflow: hidden;
  }
  .bar::before, .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; }
  .bar::before { left: 0; background: var(--accent-blue); }
  .bar::after { right: 0; background: var(--accent-orange); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

  /* ===== TOP ROW ===== */
  .weather { display: flex; align-items: center; gap: clamp(10px, 1vw, 16px); }
  .w-icon { width: clamp(24px, 2.2vw, 36px); height: clamp(24px, 2.2vw, 36px); color: #fbbf24; display: flex; align-items: center; justify-content: center; }
  .w-icon svg { width: 100%; height: 100%; }
  .w-temp { font-size: clamp(20px, 2vw, 32px); font-weight: 600; letter-spacing: -.02em; }
  .divider { width: 1px; height: clamp(20px, 2vw, 28px); background: rgba(255,255,255,.2); border-radius: 2px; margin: 0 6px; }
  .w-cond { font-size: clamp(14px, 1.2vw, 20px); font-weight: 500; color: #e2e8f0; }
  
  .clock { display: flex; align-items: center; gap: clamp(10px, 1vw, 16px); }
  .time { font-size: clamp(24px, 2.5vw, 36px); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .date-box { display: flex; flex-direction: column; justify-content: center; }
  .date-top { font-size: clamp(11px, .9vw, 14px); font-weight: 600; color: #fff; line-height: 1.2; }
  .date-bottom { font-size: clamp(11px, .9vw, 14px); color: var(--text-dim); line-height: 1.2; }

  /* ===== BOTTOM ROW ===== */
  .left-info { display: flex; align-items: center; gap: clamp(10px, 1vw, 16px); flex-shrink: 0; max-width: 55%; }
  .location { display: flex; align-items: center; gap: 8px; font-size: clamp(14px, 1.1vw, 18px); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .location svg { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; }
  .news-label { background: var(--accent-blue); color: #fff; padding: 4px 12px; border-radius: 6px; font-size: clamp(11px, .9vw, 14px); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; flex-shrink: 0; }
  
  .ticker { flex: 1; overflow: hidden; position: relative; height: 100%; display: flex; align-items: center;
    mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
  }
  .ticker-track { display: flex; white-space: nowrap; will-change: transform; animation: marquee 30s linear infinite; }
  .ticker-group { display: inline-flex; align-items: center; gap: 2em; padding-right: 2em; }
  .tick-item { font-size: clamp(13px, 1vw, 16px); font-weight: 400; color: #fff; }
  .tick-sep { color: var(--accent-orange); font-size: 0.6em; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ===== PANEL TOGGLE ===== */
  .panel-toggle { position: fixed; top: calc(env(safe-area-inset-top) + 12px); right: 12px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(10,15,26,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--text); font-size: 20px; cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center; opacity: 0.2; transition: opacity 0.3s;
  }
  .panel-toggle:hover, .panel-toggle:active { opacity: 1; }

  /* ===== DRAWER ===== */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw);
    background: rgba(11,18,32,.98); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .3s ease; z-index: 200; overflow-y: auto; padding: 20px; color: var(--text);
  }
  .drawer.open { transform: translateX(0); }
  .drawer header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .drawer h1 { margin: 0; font-size: 18px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .drawer label { display: block; margin-top: 15px; font-size: 12px; color: var(--text-dim); }
  .drawer input, .drawer select, .drawer textarea { width: 100%; padding: 10px 12px; margin-top: 6px; border-radius: 8px; border: 1px solid var(--border); background: #182238; color: var(--text); font-size: 14px; font-family: inherit; }
  .btn-save { width: 100%; padding: 12px; margin-top: 20px; border-radius: 8px; border: none; background: #16a34a; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<button class="panel-toggle" id="panelToggle" title="Settings">⚙️</button>

<aside class="drawer" id="drawer">
  <header>
    <h1>Sky Stations Settings</h1>
    <button id="closeDrawer" style="background:none; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">✕</button>
  </header>
  <div>
    <label>City Name (Auto Weather)</label>
    <input type="text" id="cityInput" placeholder="e.g. Tokyo, Nagoya, London">
    
    <label>Manual Override Temperature (°C)</label>
    <input type="number" id="tempInput">
    
    <label>Manual Override Condition</label>
    <input type="text" id="condInput">
    
    <label>Airport / Location Display</label>
    <input type="text" id="locInput">

    <label>News Badge Label</label>
    <input type="text" id="labelInput" value="Aviation News">

    <label>Time Zone</label>
    <select id="tzInput">
      <option value="Asia/Tokyo">Tokyo (Japan Time)</option>
      <option value="Asia/Seoul">Seoul</option>
      <option value="Asia/Shanghai">Shanghai</option>
      <option value="UTC">UTC</option>
    </select>
    
    <label>Ticker Messages (one per line)</label>
    <textarea id="newsInput" rows="5"></textarea>
    
    <button class="btn-save" id="saveBtn">Save &amp; Sync Now</button>
  </div>
</aside>

<div class="overlay">
  <div class="bar">
    <div class="row">
      <div class="weather">
        <span class="w-icon" id="wIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>
        </span>
        <span class="w-temp" id="wTemp">--°C</span>
        <div class="divider"></div>
        <span class="w-cond" id="wCond">Loading...</span>
      </div>
      <div class="clock">
        <span class="time" id="timeDisplay">00:00</span>
        <div class="divider"></div>
        <div class="date-box">
          <span class="date-top" id="tzDisplay">Japan Time</span>
          <span class="date-bottom" id="dateDisplay">---</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="left-info">
        <div class="location">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span id="locDisplay">---</span>
        </div>
        <div class="divider"></div>
        <span class="news-label" id="labelDisplay">Aviation News</span>
      </div>
      <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
    </div>
  </div>
</div>

<script>
// Force cache bypass using timestamp URL parameter
const urlParams = new URLSearchParams(window.location.search);
if (!urlParams.has('t')) {
  window.location.search = '?t=' + Date.now();
}

const STORAGE_KEY = 'sky_stations_config_api_v2';

const ICONS = {
  clear:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`,
  partly:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/></svg>`,
  cloudy:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
  rain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>`,
  thunder:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></svg>`,
  snow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/></svg>`,
  fog:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 17H7"/><path d="M17 21H9"/></svg>`
};

function loadConfig() {
  const data = localStorage.getItem(STORAGE_KEY);
  const defaults = {
    city: '',
    temp: 18,
    cond: 'Partly Cloudy',
    loc: 'Nagoya Area (Komaki)',
    label: 'Aviation News',
    tz: 'Asia/Tokyo',
    news: [
      'JAL to increase international flights in 2027',
      'Winds calm, visibility 10 km'
    ]
  };
  return data ? JSON.parse(data) : defaults;
}

function saveConfig(config) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
  const currentParams = new URLSearchParams(window.location.search);
  currentParams.set('t', Date.now());
  window.location.search = currentParams.toString();
}

async function fetchWeather(cityName) {
  if (!cityName) return null;
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1`);
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) throw new Error("City not found");
    
    const { latitude, longitude } = geoData.results[0];
    
    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code`);
    const wData = await weatherRes.json();
    
    if (!wData.current) throw new Error("Weather data unavailable");

    return {
      temp: Math.round(wData.current.temperature_2m),
      conditionCode: wData.current.weather_code
    };
  } catch (error) {
    console.error("Weather fetch failed:", error);
    return null;
  }
}

function getWeatherDetails(code) {
  if (code === 0) return { text: "Clear Sky", icon: ICONS.clear };
  if ([1, 2, 3].includes(code)) return { text: "Partly Cloudy", icon: ICONS.partly };
  if ([45, 48].includes(code)) return { text: "Fog", icon: ICONS.fog };
  if ([51, 53, 55, 56, 57].includes(code)) return { text: "Drizzle", icon: ICONS.rain };
  if ([61, 63, 65, 66, 67].includes(code)) return { text: "Rain", icon: ICONS.rain };
  if ([71, 73, 75, 77, 85, 86].includes(code)) return { text: "Snow", icon: ICONS.snow };
  if ([80, 81, 82].includes(code)) return { text: "Rain Showers", icon: ICONS.rain };
  if ([95, 96, 99].includes(code)) return { text: "Thunderstorm", icon: ICONS.thunder };
  return { text: "Cloudy", icon: ICONS.cloudy };
}

async function updateUI() {
  const config = loadConfig();
  
  let displayTemp = config.temp;
  let displayCond = config.cond;
  let displayIcon = ICONS.partly;

  if (config.city) {
    const liveWeather = await fetchWeather(config.city);
    if (liveWeather) {
      displayTemp = liveWeather.temp;
      const details = getWeatherDetails(liveWeather.conditionCode);
      displayCond = details.text;
      displayIcon = details.icon;
    }
  }

  document.getElementById('wTemp').textContent = displayTemp + '°C';
  document.getElementById('wCond').textContent = displayCond;
  document.getElementById('wIcon').innerHTML = displayIcon;
  
  document.getElementById('locDisplay').textContent = config.loc;
  document.getElementById('labelDisplay').textContent = config.label;
  document.getElementById('tzDisplay').textContent = config.tz === 'Asia/Tokyo' ? 'Japan Time' : config.tz;

  document.getElementById('cityInput').value = config.city;
  document.getElementById('tempInput').value = config.temp;
  document.getElementById('condInput').value = config.cond;
  document.getElementById('locInput').value = config.loc;
  document.getElementById('labelInput').value = config.label;
  document.getElementById('tzInput').value = config.tz;
  document.getElementById('newsInput').value = config.news.join('\n');

  const track = document.getElementById('tickerTrack');
  const groupHtml = config.news.map(item => `<span class="tick-item">${item}</span><span class="tick-sep">◆</span>`).join('');
  track.innerHTML = `<div class="ticker-group">${groupHtml}</div><div class="ticker-group">${groupHtml}</div>`;
}

function updateClock() {
  const config = loadConfig();
  const tz = config.tz || 'Asia/Tokyo';
  const now = new Date();
  
  document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('en-GB', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false
  });
  
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', {
    timeZone: tz, month: 'short', day: '2-digit', year: 'numeric'
  });
}

setInterval(updateClock, 1000);
updateClock();

document.getElementById('panelToggle').addEventListener('click', () => document.getElementById('drawer').classList.add('open'));
document.getElementById('closeDrawer').addEventListener('click', () => document.getElementById('drawer').classList.remove('open'));

document.getElementById('saveBtn').addEventListener('click', () => {
  const newConfig = {
    city: document.getElementById('cityInput').value.trim(),
    temp: document.getElementById('tempInput').value || 18,
    cond: document.getElementById('condInput').value || 'Partly Cloudy',
    loc: document.getElementById('locInput').value,
    label: document.getElementById('labelInput').value,
    tz: document.getElementById('tzInput').value,
    news: document.getElementById('newsInput').value.split('\n').map(s => s.trim()).filter(Boolean)
  };
  saveConfig(newConfig);
});

window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) updateUI();
});

updateUI();
</script>
</body>
</html>
