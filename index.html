<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- Leaflet CSS & JS for Interactive Radar Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

        :root {
            --top-bg: rgba(6, 21, 45, 0.85);
            --top-border-color: #38bdf8;
            --bottom-border-color: #F9A53E;
            --bar-width: 92%;
            --bar-height: 82px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.chroma-green {
            background-color: #00b140;
        }

        /* ================= CONTROL PANEL ================= */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 440px;
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            background: rgba(13, 27, 42, 0.96);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        #control-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .panel-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #F9A53E;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-group label span {
            color: #38bdf8;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #F9A53E;
            cursor: pointer;
        }

        /* Mini Radar Map inside Control Panel */
        #radar-container {
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
        }

        #radar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #1e293b;
            font-size: 10px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        #radar-map {
            width: 100%;
            height: 165px;
            z-index: 1;
        }

        .dark-map-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .btn-mini {
            padding: 4px 8px;
            font-size: 10px;
            background: #38bdf8;
            color: #0d1b2a;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn-mini:hover {
            background: #7dd3fc;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button.main-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-orange {
            background: #F9A53E;
            color: #0d1b2a;
        }

        .btn-orange:hover {
            background: #e08e29;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 16px;
            font-weight: 600;
        }

        /* ================= BROADCAST OVERLAY ================= */
        .overlay-wrapper {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: var(--bar-width);
            max-width: 1600px;
            transition: width 0.1s ease;
        }

        .broadcast-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            align-items: center;
            height: var(--bar-height);
            padding: 0 28px;
            border-radius: 12px;
            background: var(--top-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 2px solid var(--top-border-color);
            border-bottom: 2px solid var(--bottom-border-color);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            overflow: hidden;
        }

        .divider-v {
            width: 2px;
            height: 55%;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 20px;
        }

        /* Left: Weather Section */
        .weather-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            color: #ffffff;
            min-width: 0;
        }

        .weather-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .weather-icon:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            white-space: nowrap;
        }

        .weather-top-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .main-temp {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .condition-text {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .weather-details {
            display: flex;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            margin-top: 4px;
        }

        .weather-details span {
            color: #e2e8f0;
        }

        /* Center: Flight Tracking Block */
        .flight-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #ffffff;
            min-width: 0;
        }

        .flag-box {
            width: 48px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
        }

        .flag-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .flight-main-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            white-space: nowrap;
        }

        .callsign-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .callsign-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
            color: #F9A53E;
        }

        .airline-name {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .route-text {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-arrow {
            color: #38bdf8;
            font-weight: 800;
        }

        .aircraft-model {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.75);
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Right: Clock Section with Static Live Indicator */
        .clock-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            color: #ffffff;
            min-width: 0;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .live-icon svg {
            display: block;
            fill: #ef4444;
        }

        .live-text {
            font-size: 13px;
            font-weight: 800;
            color: #fca5a5;
            letter-spacing: 0.5px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            white-space: nowrap;
        }

        .clock-time {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="panel-header">
            <h3>Sky Stations • Control Panel</h3>
            <button class="main-btn btn-secondary" style="flex:0; padding:4px 10px;" onclick="togglePanel()">Hide</button>
        </div>

        <!-- Bar Dimensions Sliders -->
        <div class="form-row">
            <div class="form-group">
                <label>Bar Width <span id="val-width">92%</span></label>
                <input type="range" id="slider-width" min="60" max="98" value="92" oninput="updateBarDimensions()">
            </div>
            <div class="form-group">
                <label>Bar Height <span id="val-height">82px</span></label>
                <input type="range" id="slider-height" min="68" max="120" value="82" oninput="updateBarDimensions()">
            </div>
        </div>

        <!-- Mini Live Radar Map -->
        <div id="radar-container">
            <div id="radar-header">
                <span>Live Radar (adsb.lol Auto-Retry)</span>
                <button class="btn-mini" onclick="refreshRadarFlights()">Scan Area</button>
            </div>
            <div id="radar-map"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City for Weather</label>
                <div style="display: flex; gap: 4px;">
                    <input type="text" id="input-city" value="Nagoya" placeholder="Ex: Nagoya, Osaka..." onchange="fetchAndApplyWeather(this.value)">
                    <button class="btn-mini" onclick="fetchAndApplyWeather(document.getElementById('input-city').value)">Go</button>
                </div>
            </div>

            <div class="form-group">
                <label>Flight Callsign</label>
                <input type="text" id="input-callsign" value="JAL921" placeholder="Ex: JAL921">
            </div>
        </div>

        <div class="form-group">
            <label>Route Display Label (Auto-City)</label>
            <input type="text" id="input-route" value="HND → ITM" placeholder="Ex: HND → ITM">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Country Code (Flag)</label>
                <input type="text" id="input-country" value="JP" placeholder="Ex: JP, US...">
            </div>

            <div class="form-group">
                <label>Aircraft Model</label>
                <input type="text" id="input-aircraft" value="Boeing 787-8" placeholder="Ex: B788, N/A...">
            </div>
        </div>

        <div class="form-group">
            <label>Live Status Label</label>
            <input type="text" id="input-live-label" value="LIVE NOW" placeholder="Ex: LIVE NOW, ON AIR...">
        </div>

        <div class="btn-row">
            <button class="main-btn btn-orange" onclick="pushSettingsToFirebase()">Update & Sync Overlay</button>
            <button class="main-btn btn-secondary" onclick="toggleChroma()">Chroma Green</button>
        </div>
        <div class="status-text" id="status-msg">Ready. Click weather icon anytime to open/close.</div>
    </div>

    <!-- Main Broadcast Overlay -->
    <div class="overlay-wrapper" id="overlay-wrapper">
        <div class="broadcast-bar">
            <!-- Left: Weather Section -->
            <div class="weather-section">
                <div class="weather-icon" id="weather-icon" onclick="togglePanel()" title="Click to open settings"></div>
                <div class="weather-info">
                    <div class="weather-top-row">
                        <span class="main-temp" id="display-temp">--°C</span>
                        <span class="condition-text" id="display-condition">Loading...</span>
                    </div>
                    <div class="weather-details">
                        Wind: <span id="display-wind">-- km/h N</span>
                        &bull;
                        Pres: <span id="display-pressure">---- hPa</span>
                    </div>
                </div>
            </div>

            <div class="divider-v"></div>

            <!-- Center: Flight Tracking Block -->
            <div class="flight-block">
                <div class="flag-box">
                    <img id="display-flag-img" src="https://flagcdn.com/w80/jp.png" alt="Country Flag" onerror="this.src='https://flagcdn.com/w80/un.png'">
                </div>
                <div class="flight-main-info">
                    <div class="callsign-row">
                        <span class="callsign-text" id="display-callsign">JAL921</span>
                        <span class="airline-name" id="display-airline">Japan Airlines</span>
                    </div>
                    <div class="route-text">
                        <span id="display-route">Tokyo <span class="route-arrow">&rarr;</span> Osaka</span>
                    </div>
                </div>
                <div class="aircraft-model" id="display-aircraft">Boeing 787-8</div>
            </div>

            <div class="divider-v"></div>

            <!-- Right: Clock Section with Static Live Indicator -->
            <div class="clock-section">
                <div class="live-indicator">
                    <span class="live-icon">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                        </svg>
                    </span>
                    <span class="live-text" id="display-live-label">LIVE NOW</span>
                </div>

                <div class="time-box">
                    <span class="clock-time" id="display-time">00:00</span>
                    <span class="clock-date" id="display-date">--------- --, ----</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= FIREBASE CONFIGURATION =================
        const firebaseConfig = {
            databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/"
        };

        const AIRLINE_CODE_MAP = {
            "JAL": "Japan Airlines", "JNA": "Japan Transocean Air", "J-AIR": "J-Air",
            "ANA": "All Nippon Airways", "ADO": "Air Do", "SNJ": "Skymid Air",
            "SKY": "Skymark Airlines", "APJ": "Peach Aviation", "SFJ": "StarFlyer",
            "IBX": "I-Bex Airlines", "FDA": "Fuji Dream Airlines", "ORC": "Oriental Air Bridge",
            "JAC": "Japan Air Commuter", "RAC": "Ryukyu Air Commuter", "JET": "Jetstar Japan",
            "AXT": "Spring Airlines Japan", "CPA": "Cathay Pacific", "KAL": "Korean Air",
            "AAR": "Asiana Airlines", "SIA": "Singapore Airlines", "CHH": "Hainan Airlines",
            "CCA": "Air China", "CSN": "China Southern", "CES": "China Eastern",
            "EVA": "EVA Air", "CAL": "China Airlines", "THA": "Thai Airways",
            "MAS": "Malaysia Airlines", "VNA": "Vietnam Airlines", "JST": "Jetstar",
            "QFA": "Qantas", "UAL": "United Airlines", "DAL": "Delta Air Lines",
            "AAL": "American Airlines", "SWA": "Southwest Airlines", "BAW": "British Airways",
            "AFR": "Air France", "DLH": "Lufthansa", "UAE": "Emirates", "QTR": "Qatar Airways"
        };

        function getAirlineName(callsign) {
            if (!callsign) return "";
            const clean = callsign.trim().toUpperCase();
            const match = clean.match(/^[A-Z]+/);
            if (match) {
                const prefix = match[0];
                return AIRLINE_CODE_MAP[prefix] || prefix;
            }
            return "";
        }

        const AIRPORT_CODE_MAP = {
            "HND": "Tokyo", "NRT": "Tokyo", "KIX": "Osaka", "ITM": "Osaka",
            "NGO": "Nagoya", "NKM": "Nagoya", "CTS": "Sapporo", "FUK": "Fukuoka",
            "OKA": "Okinawa", "KOJ": "Kagoshima", "SDJ": "Sendai", "ICN": "Seoul",
            "TPE": "Taipei", "HKG": "Hong Kong", "SIN": "Singapore", "LAX": "Los Angeles",
            "RJTT": "Tokyo", "RJAA": "Tokyo", "RJBB": "Osaka", "RJOO": "Osaka",
            "RJGG": "Nagoya", "RJNA": "Nagoya", "RJCC": "Sapporo", "RJFF": "Fukuoka"
        };

        function getCityName(code) {
            if (!code) return "";
            const cleanCode = code.trim().toUpperCase();
            return AIRPORT_CODE_MAP[cleanCode] || cleanCode;
        }

        function formatRouteWithCities(routeString) {
            if (!routeString) return "N/A → N/A";
            const separator = routeString.includes('→') ? '→' : (routeString.includes('-') ? '-' : null);
            if (!separator) return routeString;

            const parts = routeString.split(separator).map(s => s.trim());
            const origCity = getCityName(parts[0]);
            const destCity = parts.length > 1 ? getCityName(parts[1]) : "";

            return `${origCity} → ${destCity}`;
        }

        let db = null;
        let settingsRef = null;
        try {
            if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("http")) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                settingsRef = db.ref("flightOverlaySettings");
            }
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        function updateBarDimensions() {
            const widthVal = document.getElementById('slider-width').value;
            const heightVal = document.getElementById('slider-height').value;

            document.getElementById('val-width').innerText = `${widthVal}%`;
            document.getElementById('val-height').innerText = `${heightVal}px`;

            document.documentElement.style.setProperty('--bar-width', `${widthVal}%`);
            document.documentElement.style.setProperty('--bar-height', `${heightVal}px`);
        }

        // ================= ROBUST MULTI-PROXY WITH RETRIES =================
        async function fetchWithRetry(targetUrl, retries = 3) {
            const cacheBuster = `_t=${Date.now()}`;
            const urlWithBust = targetUrl.includes('?') ? `${targetUrl}&${cacheBuster}` : `${targetUrl}?${cacheBuster}`;

            const proxies = [
                urlWithBust,
                `https://corsproxy.io/?${encodeURIComponent(urlWithBust)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(urlWithBust)}`
            ];

            for (let attempt = 1; attempt <= retries; attempt++) {
                for (let i = 0; i < proxies.length; i++) {
                    try {
                        const res = await fetch(proxies[i]);
                        if (res.ok) {
                            const data = await res.json();
                            // Se for allorigins, vem encapsulado em .contents
                            if (proxies[i].includes('allorigins')) {
                                return JSON.parse(data.contents);
                            }
                            return data;
                        }
                    } catch (e) {
                        // Tenta o próximo proxy
                    }
                }
                // Aguarda 1.5s antes de tentar novamente o bloco de proxies
                if (attempt < retries) {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
            }
            throw new Error("All proxies and retries failed.");
        }

        // ================= MINI RADAR MAP =================
        let map = null;
        let aircraftLayer = null;
        let currentLat = 35.1815;
        let currentLon = 136.9066;

        function initRadarMap() {
            map = L.map('radar-map', {
                center: [currentLat, currentLon],
                zoom: 8,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 15,
                className: 'dark-map-tiles'
            }).addTo(map);

            aircraftLayer = L.layerGroup().addTo(map);
            refreshRadarFlights();
        }

        function deriveCountryFromReg(reg) {
            if (reg) {
                const r = reg.toUpperCase();
                if (r.startsWith("JA")) return "JP";
                if (r.startsWith("N")) return "US";
                if (r.startsWith("B-")) return "CN";
                if (r.startsWith("HL")) return "KR";
                if (r.startsWith("VH")) return "AU";
                if (r.startsWith("G-")) return "GB";
                if (r.startsWith("F-")) return "FR";
                if (r.startsWith("D-")) return "DE";
                if (r.startsWith("C-")) return "CA";
            }
            return "JP";
        }

        async function lookupFlightRoute(callsign, lat, lon) {
            if (!callsign || callsign === "N/A") return null;
            const cleanCallsign = callsign.trim().toUpperCase();

            try {
                const routeEndpoint = "https://api.adsb.lol/api/0/routeset";
                const bodyPayload = JSON.stringify({
                    planes: [{ callsign: cleanCallsign, lat: lat, lng: lon }]
                });

                let res = await fetch(`https://corsproxy.io/?${encodeURIComponent(routeEndpoint)}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: bodyPayload
                });

                if (res && res.ok) {
                    const routeData = await res.json();
                    if (Array.isArray(routeData) && routeData.length > 0 && routeData[0]._airport_codes_iata) {
                        return routeData[0]._airport_codes_iata.replace('-', ' → ');
                    }
                }
            } catch (err) {}
            return null;
        }

        async function refreshRadarFlights() {
            const statusEl = document.getElementById('status-msg');
            if (!map) return;

            const center = map.getCenter();
            statusEl.innerText = "Scanning live aircraft (connecting)...";

            try {
                const targetUrl = `https://api.adsb.lol/v2/lat/${center.lat.toFixed(4)}/lon/${center.lng.toFixed(4)}/dist/100`;
                const data = await fetchWithRetry(targetUrl);

                aircraftLayer.clearLayers();

                if (!data || !data.ac || data.ac.length === 0) {
                    statusEl.innerText = "No aircraft detected in this area.";
                    return;
                }

                let count = 0;
                data.ac.forEach(ac => {
                    if (ac.lat && ac.lon) {
                        count++;
                        const callsign = (ac.flight || ac.r || ac.hex || "N/A").trim();
                        const model = ac.t || "N/A";
                        const reg = ac.r || "";
                        const track = ac.track || 0;

                        const planeIcon = L.divIcon({
                            className: 'custom-plane-icon',
                            html: `<div style="transform: rotate(${track}deg); color: #F9A53E; font-size: 16px; text-shadow: 0 0 4px #000; cursor: pointer;">&#9992;</div>`,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        const marker = L.marker([ac.lat, ac.lon], { icon: planeIcon });
                        marker.bindTooltip(`${callsign} (${model})`, { direction: 'top' });

                        marker.on('click', async () => {
                            const country = deriveCountryFromReg(reg);
                            document.getElementById('input-callsign').value = callsign;
                            document.getElementById('input-aircraft').value = model;
                            document.getElementById('input-country').value = country;
                            document.getElementById('input-route').value = "Searching route...";
                            statusEl.innerText = `Fetching route for ${callsign}...`;

                            const detectedRoute = await lookupFlightRoute(callsign, ac.lat, ac.lon);
                            if (detectedRoute) {
                                document.getElementById('input-route').value = detectedRoute;
                                statusEl.innerText = `Selected ${callsign} (${detectedRoute}). Click Update & Sync!`;
                            } else {
                                document.getElementById('input-route').value = "";
                                statusEl.innerText = `Selected ${callsign}. Route not found — type manually (ex: HND → ITM).`;
                            }
                        });

                        marker.addTo(aircraftLayer);
                    }
                });

                statusEl.innerText = `Radar updated: ${count} aircraft found. Click any plane.`;
            } catch (err) {
                statusEl.innerText = "Radar error: Network busy. Click Scan Area to retry.";
            }
        }

        // ================= WEATHER & ICONS =================
        const weatherIcons = {
            clear: `<svg viewBox="0 0 64 64" width="44" height="44"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 64 64" width="44" height="44"><circle cx="24" cy="24" r="11" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/><line x1="11" y1="11" x2="14" y2="14"/><line x1="37" y1="11" x2="34" y2="14"/><line x1="11" y1="37" x2="14" y2="34"/></g><path d="M46 46H22a10 10 0 0 1-1.5-19.9A13 13 0 0 1 45.8 29 8.5 8.5 0 0 1 46 46z" fill="#ffffff"/></svg>`,
            cloudy: `<svg viewBox="0 0 64 64" width="44" height="44"><path d="M48 46H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 27 9.5 9.5 0 0 1 48 46z" fill="#e2e8f0"/></svg>`,
            rain: `<svg viewBox="0 0 64 64" width="44" height="44"><path d="M48 40H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 21 9.5 9.5 0 0 1 48 40z" fill="#cbd5e1"/><g stroke="#38bdf8" stroke-width="3" stroke-linecap="round"><line x1="22" y1="46" x2="19" y2="54"/><line x1="32" y1="46" x2="29" y2="54"/><line x1="42" y1="46" x2="39" y2="54"/></g></svg>`
        };

        document.getElementById('weather-icon').innerHTML = weatherIcons.partlyCloudy;

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show') && map) {
                setTimeout(() => map.invalidateSize(), 250);
            }
        }

        function toggleChroma() {
            document.body.classList.toggle('chroma-green');
        }

        function getWindDirection(deg) {
            if (deg === undefined || deg === null) return "N";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return dirs[Math.round(deg / 45) % 8];
        }

        function interpretWeatherCode(code) {
            if (code === 0) return { label: "Clear Sky", icon: weatherIcons.clear };
            if (code === 1 || code === 2) return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
            if (code === 3) return { label: "Overcast", icon: weatherIcons.cloudy };
            if (code >= 45 && code <= 48) return { label: "Foggy", icon: weatherIcons.cloudy };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: "Rain", icon: weatherIcons.rain };
            if (code >= 71 && code <= 77) return { label: "Snow", icon: weatherIcons.cloudy };
            if (code >= 95) return { label: "Thunderstorm", icon: weatherIcons.rain };
            return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
        }

        async function fetchAndApplyWeather(city) {
            const statusEl = document.getElementById('status-msg');
            if (!city || city.trim() === "") return;

            statusEl.innerText = `Searching weather & radar for ${city}...`;
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city.trim())}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) {
                    statusEl.innerText = `City "${city}" not found.`;
                    return;
                }
                
                const { latitude, longitude, name } = geoData.results[0];
                currentLat = latitude;
                currentLon = longitude;

                if (map) {
                    map.setView([currentLat, currentLon], 8);
                    refreshRadarFlights();
                }

                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,weather_code`);
                const weatherData = await weatherRes.json();
                
                const cur = weatherData.current;
                const temp = Math.round(cur.temperature_2m);
                const pressure = Math.round(cur.pressure_msl);
                const windSpeed = Math.round(cur.wind_speed_10m);
                const windDir = getWindDirection(cur.wind_direction_10m);
                const info = interpretWeatherCode(cur.weather_code);

                document.getElementById('display-temp').innerText = `${temp}°C`;
                document.getElementById('display-condition').innerText = info.label;
                document.getElementById('weather-icon').innerHTML = info.icon;
                document.getElementById('display-wind').innerText = `${windSpeed} km/h ${windDir}`;
                document.getElementById('display-pressure').innerText = `${pressure} hPa`;

                statusEl.innerText = `Weather updated for ${name}.`;
            } catch (err) {
                statusEl.innerText = "Failed to fetch weather data.";
            }
        }

        // ================= FIREBASE SYNC =================
        function pushSettingsToFirebase() {
            const cityVal = document.getElementById('input-city').value.trim() || "Nagoya";
            const rawRoute = document.getElementById('input-route').value.trim() || "N/A → N/A";
            const callsignVal = document.getElementById('input-callsign').value.trim() || "N/A";
            
            const payload = {
                city: cityVal,
                callsign: callsignVal,
                route: rawRoute,
                country: document.getElementById('input-country').value.trim() || "JP",
                aircraft: document.getElementById('input-aircraft').value.trim() || "N/A",
                liveLabel: document.getElementById('input-live-label').value.trim() || "",
                barWidth: document.getElementById('slider-width').value,
                barHeight: document.getElementById('slider-height').value
            };

            applySettingsObject(payload);
            fetchAndApplyWeather(cityVal);

            if (settingsRef) {
                settingsRef.set(payload).then(() => {
                    document.getElementById('status-msg').innerText = "Synced with Firebase!";
                }).catch(() => {
                    document.getElementById('status-msg').innerText = "Local update applied (Firebase offline).";
                });
            }
        }

        function applySettingsObject(data) {
            if (!data) return;

            if (data.barWidth) {
                document.getElementById('slider-width').value = data.barWidth;
                document.getElementById('val-width').innerText = `${data.barWidth}%`;
                document.documentElement.style.setProperty('--bar-width', `${data.barWidth}%`);
            }

            if (data.barHeight) {
                document.getElementById('slider-height').value = data.barHeight;
                document.getElementById('val-height').innerText = `${data.barHeight}px`;
                document.documentElement.style.setProperty('--bar-height', `${data.barHeight}px`);
            }

            if (data.city) {
                const prevCity = document.getElementById('input-city').value;
                document.getElementById('input-city').value = data.city;
                if (prevCity !== data.city) {
                    fetchAndApplyWeather(data.city);
                }
            }

            if (data.callsign) {
                document.getElementById('input-callsign').value = data.callsign;
                document.getElementById('display-callsign').innerText = data.callsign;
                document.getElementById('display-airline').innerText = getAirlineName(data.callsign);
            }

            if (data.route) {
                document.getElementById('input-route').value = data.route;
                const formattedRoute = formatRouteWithCities(data.route);
                document.getElementById('display-route').innerHTML = formattedRoute.replace('→', '<span class="route-arrow">&rarr;</span>');
            }

            if (data.country) {
                document.getElementById('input-country').value = data.country;
                document.getElementById('display-flag-img').src = `https://flagcdn.com/w80/${data.country.toLowerCase()}.png`;
            }

            if (data.aircraft) {
                document.getElementById('input-aircraft').value = data.aircraft;
                document.getElementById('display-aircraft').innerText = data.aircraft;
            }

            if (data.liveLabel !== undefined) {
                document.getElementById('input-live-label').value = data.liveLabel;
                const liveIndicator = document.querySelector('.live-indicator');
                if (data.liveLabel.trim() === "") {
                    liveIndicator.style.display = 'none';
                } else {
                    liveIndicator.style.display = 'flex';
                    document.getElementById('display-live-label').innerText = data.liveLabel;
                }
            }
        }

        if (settingsRef) {
            settingsRef.on('value', (snapshot) => {
                const val = snapshot.val();
                if (val) applySettingsObject(val);
            });
        }

        // ================= CLOCK LOOP =================
        function updateClock() {
            const now = new Date();
            document.getElementById('display-time').innerText = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('display-date').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ================= INITIALIZE =================
        window.addEventListener('DOMContentLoaded', () => {
            initRadarMap();
            fetchAndApplyWeather("Nagoya");
            document.getElementById('control-panel').classList.add('show');
        });
    </script>
</body>
</html>
