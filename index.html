<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.chroma-green {
            background-color: #00b140;
        }

        /* ================= CONTROL PANEL ================= */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 400px;
            background: rgba(13, 27, 42, 0.96);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 18px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #control-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
        }

        .panel-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #F9A53E;
        }

        .form-group {
            margin-bottom: 11px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: #F9A53E;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 9px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-orange {
            background: #F9A53E;
            color: #0d1b2a;
        }

        .btn-orange:hover {
            background: #e08e29;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 15px;
        }

        #reopen-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(13, 27, 42, 0.5);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            z-index: 9998;
            opacity: 0.4;
            transition: opacity 0.2s;
        }

        #reopen-btn:hover {
            opacity: 1;
            background: rgba(13, 27, 42, 0.95);
            color: #fff;
        }

        /* ================= OVERLAY LOWER THIRD ================= */
        .overlay-wrapper {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 1480px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.65));
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 62px;
            padding: 0 28px;
            border-radius: 12px;
            background: linear-gradient(90deg, #06152d 0%, #0d2b59 35%, #10346b 65%, #06152d 100%);
            border-top: 2px solid #38bdf8;
            border-bottom: 2px solid #F9A53E;
            position: relative;
            overflow: hidden;
        }

        .top-bar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            width: 220px;
            height: 3px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 50%, transparent 100%);
        }

        .top-bar::after {
            content: '';
            position: absolute;
            bottom: -1px;
            right: 25%;
            width: 240px;
            height: 3px;
            background: radial-gradient(circle, #ffffff 0%, #F9A53E 50%, transparent 100%);
        }

        .weather-section {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ffffff;
        }

        .weather-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temperature {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .divider-v {
            width: 2px;
            height: 28px;
            background: rgba(255, 255, 255, 0.35);
        }

        .weather-desc {
            font-size: 20px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .time-section {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #ffffff;
        }

        .clock-time {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .date-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.2;
        }

        .timezone-label {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
        }

        .date-label {
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 24px;
            border-radius: 10px;
            background: linear-gradient(90deg, #071936 0%, #0b244c 50%, #071936 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            gap: 18px;
        }

        .location-box {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }

        .pin-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        .news-badge {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border: 1px solid #60a5fa;
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 0.8px;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            color: #f1f5f9;
            font-size: 17px;
            font-weight: 500;
            padding-left: 100%;
            animation: marquee 28s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <button id="reopen-btn" onclick="togglePanel()">⚙ Config Panel</button>

    <div id="control-panel">
        <div class="panel-header">
            <h3>Sky Stations • Control Panel</h3>
            <button class="btn-secondary" style="flex:0; padding:4px 10px;" onclick="togglePanel()">Hide</button>
        </div>

        <div class="form-group">
            <label>Quick Airport Preset (Optional)</label>
            <select id="airport-preset" onchange="selectPreset()">
                <option value="custom">-- Custom City Below --</option>
                <option value="komaki" selected>Nagoya Komaki (NKM)</option>
                <option value="centrair">Chubu Centrair (NGO)</option>
                <option value="kansai">Kansai International (KIX)</option>
                <option value="itami">Osaka Itami (ITM)</option>
                <option value="haneda">Tokyo Haneda (HND)</option>
                <option value="narita">Tokyo Narita (NRT)</option>
            </select>
        </div>

        <div class="form-group">
            <label>City Search (English)</label>
            <input type="text" id="input-city" value="Komaki" placeholder="Ex: Komaki, Tokoname, Osaka...">
        </div>

        <div class="form-group">
            <label>Location Label (Overlay)</label>
            <input type="text" id="input-location-label" value="Nagoya Area (Komaki)" placeholder="Ex: Nagoya Area (Komaki)">
        </div>

        <div class="form-group">
            <label>News Badge</label>
            <input type="text" id="input-badge" value="AVIATION NEWS">
        </div>

        <div class="form-group">
            <label>News Ticker Items (separate with • )</label>
            <textarea id="input-news" rows="2">JAL to increase international flights in 2027   •   Tokyo Narita reports record cargo volume   •   Welcome to Sky Stations Live Plane Spotting!</textarea>
        </div>

        <div class="btn-row">
            <button class="btn-orange" onclick="applySettings()">Update Overlay</button>
            <button class="btn-secondary" onclick="toggleChroma()">Chroma Green</button>
        </div>
        <div class="status-text" id="status-msg"></div>
    </div>

    <div class="overlay-wrapper">
        <div class="top-bar">
            <div class="weather-section">
                <div class="weather-icon" id="weather-icon"></div>
                <span class="temperature" id="display-temp">--°C</span>
                <div class="divider-v"></div>
                <span class="weather-desc" id="display-desc">Loading...</span>
            </div>

            <div class="time-section">
                <span class="clock-time" id="display-time">00:00</span>
                <div class="divider-v"></div>
                <div class="date-box">
                    <span class="timezone-label">Japan Time</span>
                    <span class="date-label" id="display-date">Nov 17, 2026</span>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="location-box">
                <svg class="pin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span id="display-location">Nagoya Area (Komaki)</span>
            </div>

            <div class="divider-v" style="height: 22px;"></div>

            <div class="news-badge" id="display-badge">AVIATION NEWS</div>

            <div class="ticker-container">
                <div class="ticker-text" id="display-news">
                    JAL to increase international flights in 2027 &nbsp;&nbsp;•&nbsp;&nbsp; Tokyo Narita reports record cargo volume &nbsp;&nbsp;•&nbsp;&nbsp; Welcome to Sky Stations Live Plane Spotting!
                </div>
            </div>
        </div>
    </div>

    <script>
        const presets = {
            komaki:   { city: "Komaki",   label: "Nagoya Area (Komaki)",   lat: 35.2911, lon: 136.9122 },
            centrair: { city: "Tokoname", label: "Chubu Centrair (NGO)",   lat: 34.8584, lon: 136.8054 },
            kansai:   { city: "Izumisano",label: "Kansai Airport (KIX)",   lat: 34.4347, lon: 135.2442 },
            itami:    { city: "Itami",    label: "Osaka Itami (ITM)",      lat: 34.7855, lon: 135.4382 },
            haneda:   { city: "Tokyo",    label: "Tokyo Haneda (HND)",     lat: 35.5494, lon: 139.7798 },
            narita:   { city: "Narita",   label: "Tokyo Narita (NRT)",     lat: 35.7720, lon: 140.3929 }
        };

        let activeCoords = { lat: 35.2911, lon: 136.9122 };
        let currentCity = "Komaki";

        const icons = {
            clear: `<svg viewBox="0 0 64 64" width="42" height="42"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 64 64" width="42" height="42"><circle cx="24" cy="24" r="11" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/><line x1="11" y1="11" x2="14" y2="14"/><line x1="37" y1="11" x2="34" y2="14"/><line x1="11" y1="37" x2="14" y2="34"/></g><path d="M46 46H22a10 10 0 0 1-1.5-19.9A13 13 0 0 1 45.8 29 8.5 8.5 0 0 1 46 46z" fill="#ffffff"/></svg>`,
            cloudy: `<svg viewBox="0 0 64 64" width="42" height="42"><path d="M48 46H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 27 9.5 9.5 0 0 1 48 46z" fill="#e2e8f0"/></svg>`,
            rain: `<svg viewBox="0 0 64 64" width="42" height="42"><path d="M48 40H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 21 9.5 9.5 0 0 1 48 40z" fill="#cbd5e1"/><g stroke="#38bdf8" stroke-width="3" stroke-linecap="round"><line x1="22" y1="46" x2="19" y2="54"/><line x1="32" y1="46" x2="29" y2="54"/><line x1="42" y1="46" x2="39" y2="54"/></g></svg>`
        };

        // Set default icon immediately
        document.getElementById('weather-icon').innerHTML = icons.partlyCloudy;

        function interpretWeatherCode(code) {
            if (code === 0) return { label: "Clear Sky", icon: icons.clear };
            if (code === 1 || code === 2) return { label: "Partly Cloudy", icon: icons.partlyCloudy };
            if (code === 3) return { label: "Overcast", icon: icons.cloudy };
            if (code >= 45 && code <= 48) return { label: "Foggy", icon: icons.cloudy };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: "Rain", icon: icons.rain };
            if (code >= 71 && code <= 77) return { label: "Snow", icon: icons.cloudy };
            if (code >= 95) return { label: "Thunderstorm", icon: icons.rain };
            return { label: "Partly Cloudy", icon: icons.partlyCloudy };
        }

        function mapTextToIcon(desc) {
            const d = desc.toLowerCase();
            if (d.includes("sun") || d.includes("clear")) return icons.clear;
            if (d.includes("partly") || d.includes("few clouds")) return icons.partlyCloudy;
            if (d.includes("rain") || d.includes("drizzle") || d.includes("shower") || d.includes("storm")) return icons.rain;
            return icons.cloudy;
        }

        function selectPreset() {
            const key = document.getElementById('airport-preset').value;
            if (presets[key]) {
                document.getElementById('input-city').value = presets[key].city;
                document.getElementById('input-location-label').value = presets[key].label;
                activeCoords = { lat: presets[key].lat, lon: presets[key].lon };
            }
        }

        async function fetchWeather(city, coords = null) {
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = "Fetching live weather...";

            try {
                let lat, lon;

                if (coords) {
                    lat = coords.lat;
                    lon = coords.lon;
                } else {
                    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
                    const geoRes = await fetch(geoUrl);
                    if (!geoRes.ok) throw new Error("Geocoding failed");
                    const geoData = await geoRes.json();

                    if (!geoData.results || geoData.results.length === 0) {
                        document.getElementById('display-desc').innerText = "City not found";
                        statusEl.innerText = "City not found in database.";
                        return;
                    }
                    lat = geoData.results[0].latitude;
                    lon = geoData.results[0].longitude;
                    activeCoords = { lat, lon };
                }

                // Primary API: Open-Meteo current endpoint
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`;
                const weatherRes = await fetch(weatherUrl);
                if (!weatherRes.ok) throw new Error("Open-Meteo weather failed");
                const weatherData = await weatherRes.json();

                const temp = Math.round(weatherData.current.temperature_2m);
                const code = weatherData.current.weather_code;
                const info = interpretWeatherCode(code);

                document.getElementById('display-temp').innerText = `${temp}°C`;
                document.getElementById('display-desc').innerText = info.label;
                document.getElementById('weather-icon').innerHTML = info.icon;
                statusEl.innerText = "Updated via Open-Meteo ✔";
            } catch (primaryError) {
                // Fallback API: wttr.in JSON (No API Key required)
                try {
                    const fallbackRes = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
                    if (!fallbackRes.ok) throw new Error("Fallback failed");
                    const fallbackData = await fallbackRes.json();
                    const current = fallbackData.current_condition[0];
                    const temp = current.temp_C;
                    const desc = current.weatherDesc[0].value;

                    document.getElementById('display-temp').innerText = `${temp}°C`;
                    document.getElementById('display-desc').innerText = desc;
                    document.getElementById('weather-icon').innerHTML = mapTextToIcon(desc);
                    statusEl.innerText = "Updated via Backup Weather ✔";
                } catch (fallbackError) {
                    document.getElementById('display-desc').innerText = "Weather Offline";
                    statusEl.innerText = "Network/CORS block. Host on GitHub Pages to run live.";
                }
            }
        }

        function updateJapanClock() {
            const now = new Date();
            const timeOptions = { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Asia/Tokyo', month: 'short', day: 'numeric', year: 'numeric' };

            document.getElementById('display-time').innerText = now.toLocaleTimeString('en-US', timeOptions);
            document.getElementById('display-date').innerText = now.toLocaleDateString('en-US', dateOptions);
        }

        function applySettings() {
            const presetKey = document.getElementById('airport-preset').value;
            const cityInput = document.getElementById('input-city').value.trim();
            const locLabel = document.getElementById('input-location-label').value.trim();
            const badgeText = document.getElementById('input-badge').value.trim();
            const newsText = document.getElementById('input-news').value.trim();

            if (presetKey !== "custom" && presets[presetKey] && cityInput.toLowerCase() === presets[presetKey].city.toLowerCase()) {
                currentCity = presets[presetKey].city;
                fetchWeather(currentCity, activeCoords);
            } else if (cityInput) {
                document.getElementById('airport-preset').value = "custom";
                currentCity = cityInput;
                fetchWeather(currentCity, null);
            }

            if (locLabel) document.getElementById('display-location').innerText = locLabel;
            if (badgeText) document.getElementById('display-badge').innerText = badgeText;
            if (newsText) {
                const formattedNews = newsText.replace(/•/g, '&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;');
                document.getElementById('display-news').innerHTML = formattedNews;
            }
        }

        function togglePanel() {
            document.getElementById('control-panel').classList.toggle('hidden');
        }

        function toggleChroma() {
            document.body.classList.toggle('chroma-green');
        }

        updateJapanClock();
        fetchWeather(currentCity, activeCoords);

        setInterval(updateJapanClock, 1000);
        setInterval(() => fetchWeather(currentCity, activeCoords), 600000);
    </script>
</body>
</html>
