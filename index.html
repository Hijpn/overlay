<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

        :root {
            --top-bg: rgba(6, 21, 45, 0.55);
            --bottom-bg: rgba(7, 25, 54, 0.50);
            --top-border-color: rgba(56, 189, 248, 0.8);
            --bottom-border-color: rgba(249, 165, 62, 0.85);
            --sub-border-color: rgba(56, 189, 248, 0.35);
            --ticker-speed: 28s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.chroma-green {
            background-color: #00b140;
        }

        /* ================= CONTROL PANEL (HIDDEN BY DEFAULT) ================= */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 430px;
            max-height: 82vh;
            overflow-y: auto;
            background: rgba(13, 27, 42, 0.98);
            border: 1px solid #3b82f6;
            border-radius: 12px;
            padding: 18px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        #control-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
        }

        .panel-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #F9A53E;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group {
            margin-bottom: 11px;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .form-group label span {
            color: #F9A53E;
            font-weight: 700;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .form-group input[type="range"] {
            width: 100%;
            accent-color: #F9A53E;
            cursor: pointer;
            margin-top: 4px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #F9A53E;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 9px 12px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-orange {
            background: #F9A53E;
            color: #0d1b2a;
        }

        .btn-orange:hover {
            background: #e08e29;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 15px;
        }

        /* ================= OVERLAY LOWER THIRD ================= */
        .overlay-wrapper {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 1480px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 62px;
            padding: 0 28px;
            border-radius: 12px;
            background: var(--top-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 2px solid var(--top-border-color);
            border-bottom: 2px solid var(--bottom-border-color);
            position: relative;
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .weather-section {
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        }

        .weather-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temperature {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .divider-v {
            width: 2px;
            height: 28px;
            background: rgba(255, 255, 255, 0.35);
        }

        /* ================= FLIPPING WEATHER METRICS ================= */
        .flip-container {
            perspective: 600px;
            height: 32px;
            display: flex;
            align-items: center;
            min-width: 230px;
        }

        .weather-flip-text {
            font-size: 20px;
            font-weight: 600;
            color: #f1f5f9;
            display: inline-block;
            transform-origin: center center;
            backface-visibility: hidden;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
            white-space: nowrap;
        }

        .weather-flip-text.flip-out {
            transform: rotateX(90deg);
            opacity: 0;
        }

        .weather-flip-text.flip-in {
            transform: rotateX(0deg);
            opacity: 1;
        }

        .metric-highlight {
            color: #F9A53E;
            font-weight: 700;
        }

        .time-section {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        }

        .clock-time {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .date-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.25;
        }

        .live-status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .timezone-label {
            font-size: 13px;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 0.3px;
        }

        /* Live Indicator Icons */
        .live-dot-red {
            width: 9px;
            height: 9px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        .live-dot-orange {
            width: 9px;
            height: 9px;
            background-color: #F9A53E;
            border-radius: 50%;
            display: inline-block;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .live-svg-icon {
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .date-label {
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 24px;
            border-radius: 10px;
            background: var(--bottom-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--sub-border-color);
            gap: 18px;
            position: relative;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .location-box {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        }

        .pin-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* AVIATION NEWS badge (hidden toggle button) */
        .news-badge {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            border: 1px solid rgba(96, 165, 250, 0.75);
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            letter-spacing: 0.8px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: all 0.25s ease;
        }

        .news-badge:hover {
            filter: brightness(1.15);
            transform: scale(1.02);
        }

        .news-badge.panel-active {
            border-color: #F9A53E;
        }

        .ticker-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            color: #ffffff;
            font-size: 17px;
            font-weight: 500;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
            padding-left: 100%;
            animation: marquee var(--ticker-speed) linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <!-- Control Panel (Hidden by default - click AVIATION NEWS to toggle) -->
    <div id="control-panel">
        <div class="panel-header">
            <h3>Sky Stations • Control Panel</h3>
            <button class="btn-secondary" style="flex:0; padding:4px 10px;" onclick="togglePanel()">Hide</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Airport Preset</label>
                <select id="airport-preset" onchange="selectPreset()">
                    <option value="custom">-- Custom City --</option>
                    <option value="komaki" selected>Nagoya Komaki (NKM)</option>
                    <option value="centrair">Chubu Centrair (NGO)</option>
                    <option value="kansai">Kansai Intl (KIX)</option>
                    <option value="itami">Osaka Itami (ITM)</option>
                    <option value="haneda">Tokyo Haneda (HND)</option>
                    <option value="narita">Tokyo Narita (NRT)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bar Theme / Transparency</label>
                <select id="theme-select" onchange="applyTheme()">
                    <option value="navy-trans" selected>Navy Translucent (55%)</option>
                    <option value="ultra-clear">Ultra Clear Glass (25%)</option>
                    <option value="navy-solid">Solid Broadcast Navy</option>
                    <option value="stealth-dark">Stealth Dark (55%)</option>
                    <option value="aviation-teal">Aviation Teal (55%)</option>
                    <option value="amber-night">Amber Night (60%)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City Search (English)</label>
                <input type="text" id="input-city" value="Komaki" placeholder="Ex: Komaki, Tokoname...">
            </div>

            <div class="form-group">
                <label>Location Label</label>
                <input type="text" id="input-location-label" value="Nagoya Area (Komaki)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Status / Time Text</label>
                <input type="text" id="input-status-label" value="Japan Time" placeholder="Ex: LIVE, ON AIR, Japan Time...">
            </div>

            <div class="form-group">
                <label>Live Status Icon</label>
                <select id="live-icon-select" onchange="updateLiveIcon()">
                    <option value="none" selected>None (Text Only)</option>
                    <option value="dot-red">🔴 Red Pulsing Dot</option>
                    <option value="dot-orange">🟠 Orange Beacon Dot</option>
                    <option value="antenna">📡 Broadcast Signal</option>
                    <option value="plane">✈️ Aircraft Icon</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>News Badge Text</label>
                <input type="text" id="input-badge" value="AVIATION NEWS">
            </div>

            <div class="form-group">
                <label>Weather Flip Interval <span id="flip-val">4s</span></label>
                <input type="range" id="input-flip-speed" min="2" max="12" value="4" oninput="updateFlipSpeed()">
            </div>
        </div>

        <div class="form-group">
            <label>Ticker Scroll Speed <span id="speed-val">28s</span></label>
            <input type="range" id="input-speed" min="10" max="60" value="28" oninput="updateTickerSpeed()">
        </div>

        <div class="form-group">
            <label>News Ticker Items (separate with • )</label>
            <textarea id="input-news" rows="2">JAL to increase international flights in 2027   •   Tokyo Narita reports record cargo volume   •   Welcome to Sky Stations Live Plane Spotting!</textarea>
        </div>

        <div class="btn-row">
            <button class="btn-orange" onclick="applySettings()">Update & Sync Overlay</button>
            <button class="btn-secondary" onclick="toggleChroma()">Chroma Green</button>
        </div>
        <div class="status-text" id="status-msg"></div>
    </div>

    <!-- Main Overlay -->
    <div class="overlay-wrapper">
        <div class="top-bar">
            <div class="weather-section">
                <div class="weather-icon" id="weather-icon"></div>
                <span class="temperature" id="display-temp">--°C</span>
                <div class="divider-v"></div>
                <div class="flip-container">
                    <span class="weather-flip-text flip-in" id="display-flip-weather">Loading...</span>
                </div>
            </div>

            <div class="time-section">
                <span class="clock-time" id="display-time">00:00</span>
                <div class="divider-v"></div>
                <div class="date-box">
                    <div class="live-status-row">
                        <span id="live-icon-container"></span>
                        <span class="timezone-label" id="display-status-label">Japan Time</span>
                    </div>
                    <span class="date-label" id="display-date">Nov 17, 2026</span>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="location-box">
                <svg class="pin-icon" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                <span id="display-location">Nagoya Area (Komaki)</span>
            </div>

            <div class="divider-v" style="height: 22px;"></div>

            <!-- Click AVIATION NEWS to toggle settings -->
            <div class="news-badge" id="display-badge" onclick="togglePanel()" title="Click to open/close settings">AVIATION NEWS</div>

            <div class="ticker-container">
                <div class="ticker-text" id="display-news">
                    JAL to increase international flights in 2027 &nbsp;&nbsp;•&nbsp;&nbsp; Tokyo Narita reports record cargo volume &nbsp;&nbsp;•&nbsp;&nbsp; Welcome to Sky Stations Live Plane Spotting!
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= FIREBASE CONFIGURATION =================
        // PASTE YOUR FIREBASE DATABASE URL BELOW:
        const firebaseConfig = {
            databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/"
        };

        let db = null;
        try {
            if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("http")) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            }
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        const presets = {
            komaki:   { city: "Komaki",   label: "Nagoya Area (Komaki)",   lat: 35.2911, lon: 136.9122 },
            centrair: { city: "Tokoname", label: "Chubu Centrair (NGO)",   lat: 34.8584, lon: 136.8054 },
            kansai:   { city: "Izumisano",label: "Kansai Airport (KIX)",   lat: 34.4347, lon: 135.2442 },
            itami:    { city: "Itami",    label: "Osaka Itami (ITM)",      lat: 34.7855, lon: 135.4382 },
            haneda:   { city: "Tokyo",    label: "Tokyo Haneda (HND)",     lat: 35.5494, lon: 139.7798 },
            narita:   { city: "Narita",   label: "Tokyo Narita (NRT)",     lat: 35.7720, lon: 140.3929 }
        };

        const themes = {
            "navy-trans": {
                topBg: "rgba(6, 21, 45, 0.55)",
                bottomBg: "rgba(7, 25, 54, 0.50)",
                topBorder: "rgba(56, 189, 248, 0.8)",
                bottomBorder: "rgba(249, 165, 62, 0.85)",
                subBorder: "rgba(56, 189, 248, 0.35)"
            },
            "ultra-clear": {
                topBg: "rgba(6, 21, 45, 0.25)",
                bottomBg: "rgba(7, 25, 54, 0.22)",
                topBorder: "rgba(255, 255, 255, 0.55)",
                bottomBorder: "rgba(249, 165, 62, 0.75)",
                subBorder: "rgba(255, 255, 255, 0.25)"
            },
            "navy-solid": {
                topBg: "linear-gradient(90deg, #06152d 0%, #0d2b59 50%, #06152d 100%)",
                bottomBg: "linear-gradient(90deg, #071936 0%, #0b244c 50%, #071936 100%)",
                topBorder: "#38bdf8",
                bottomBorder: "#F9A53E",
                subBorder: "rgba(56, 189, 248, 0.45)"
            },
            "stealth-dark": {
                topBg: "rgba(15, 23, 42, 0.58)",
                bottomBg: "rgba(15, 23, 42, 0.52)",
                topBorder: "rgba(148, 163, 184, 0.65)",
                bottomBorder: "rgba(249, 165, 62, 0.85)",
                subBorder: "rgba(148, 163, 184, 0.3)"
            },
            "aviation-teal": {
                topBg: "rgba(8, 47, 73, 0.55)",
                bottomBg: "rgba(12, 74, 110, 0.48)",
                topBorder: "rgba(34, 211, 238, 0.8)",
                bottomBorder: "rgba(250, 204, 21, 0.8)",
                subBorder: "rgba(34, 211, 238, 0.35)"
            },
            "amber-night": {
                topBg: "rgba(23, 18, 36, 0.60)",
                bottomBg: "rgba(28, 22, 43, 0.52)",
                topBorder: "rgba(249, 165, 62, 0.85)",
                bottomBorder: "rgba(56, 189, 248, 0.75)",
                subBorder: "rgba(249, 165, 62, 0.35)"
            }
        };

        const liveIcons = {
            "none": "",
            "dot-red": `<span class="live-dot-red"></span>`,
            "dot-orange": `<span class="live-dot-orange"></span>`,
            "antenna": `<span class="live-svg-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#F9A53E" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="#F9A53E"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg></span>`,
            "plane": `<span class="live-svg-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="#38bdf8"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>`
        };

        let activeCoords = { lat: 35.2911, lon: 136.9122 };
        let currentCity = "Komaki";

        // Weather items array for flipping display
        let weatherItems = ["Loading..."];
        let currentFlipIndex = 0;
        let flipTimer = null;
        let flipIntervalMs = 4000;

        const weatherIcons = {
            clear: `<svg viewBox="0 0 64 64" width="42" height="42"><circle cx="32" cy="32" r="14" fill="#FDB813"/><g stroke="#FDB813" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="58"/><line x1="6" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="17.8" y2="17.8"/><line x1="46.2" y1="46.2" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="17.8" y2="46.2"/><line x1="46.2" y1="17.8" x2="50.4" y2="13.6"/></g></svg>`,
            partlyCloudy: `<svg viewBox="0 0 64 64" width="42" height="42"><circle cx="24" cy="24" r="11" fill="#FDB813"/><g stroke="#FDB813" stroke-width="3" stroke-linecap="round"><line x1="24" y1="6" x2="24" y2="10"/><line x1="6" y1="24" x2="10" y2="24"/><line x1="11" y1="11" x2="14" y2="14"/><line x1="37" y1="11" x2="34" y2="14"/><line x1="11" y1="37" x2="14" y2="34"/></g><path d="M46 46H22a10 10 0 0 1-1.5-19.9A13 13 0 0 1 45.8 29 8.5 8.5 0 0 1 46 46z" fill="#ffffff"/></svg>`,
            cloudy: `<svg viewBox="0 0 64 64" width="42" height="42"><path d="M48 46H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 27 9.5 9.5 0 0 1 48 46z" fill="#e2e8f0"/></svg>`,
            rain: `<svg viewBox="0 0 64 64" width="42" height="42"><path d="M48 40H18a11 11 0 0 1-1.6-21.9A14 14 0 0 1 43.8 21 9.5 9.5 0 0 1 48 40z" fill="#cbd5e1"/><g stroke="#38bdf8" stroke-width="3" stroke-linecap="round"><line x1="22" y1="46" x2="19" y2="54"/><line x1="32" y1="46" x2="29" y2="54"/><line x1="42" y1="46" x2="39" y2="54"/></g></svg>`
        };

        document.getElementById('weather-icon').innerHTML = weatherIcons.partlyCloudy;

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            const badge = document.getElementById('display-badge');
            panel.classList.toggle('show');
            badge.classList.toggle('panel-active');
        }

        function toggleChroma() {
            document.body.classList.toggle('chroma-green');
        }

        function startFlipCycle() {
            if (flipTimer) clearInterval(flipTimer);
            const el = document.getElementById('display-flip-weather');
            el.innerHTML = weatherItems[0];
            currentFlipIndex = 0;

            if (weatherItems.length <= 1) return;

            flipTimer = setInterval(() => {
                el.classList.remove('flip-in');
                el.classList.add('flip-out');

                setTimeout(() => {
                    currentFlipIndex = (currentFlipIndex + 1) % weatherItems.length;
                    el.innerHTML = weatherItems[currentFlipIndex];
                    el.classList.remove('flip-out');
                    el.classList.add('flip-in');
                }, 420);
            }, flipIntervalMs);
        }

        function updateFlipSpeed() {
            const sec = document.getElementById('input-flip-speed').value;
            document.getElementById('flip-val').innerText = `${sec}s`;
            flipIntervalMs = parseInt(sec, 10) * 1000;
            startFlipCycle();
        }

        function interpretWeatherCode(code) {
            if (code === 0) return { label: "Clear Sky", icon: weatherIcons.clear };
            if (code === 1 || code === 2) return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
            if (code === 3) return { label: "Overcast", icon: weatherIcons.cloudy };
            if (code >= 45 && code <= 48) return { label: "Foggy", icon: weatherIcons.cloudy };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: "Rain", icon: weatherIcons.rain };
            if (code >= 71 && code <= 77) return { label: "Snow", icon: weatherIcons.cloudy };
            if (code >= 95) return { label: "Thunderstorm", icon: weatherIcons.rain };
            return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
        }

        function mapTextToIcon(desc) {
            const d = desc.toLowerCase();
            if (d.includes("sun") || d.includes("clear")) return weatherIcons.clear;
            if (d.includes("partly") || d.includes("few clouds")) return weatherIcons.partlyCloudy;
            if (d.includes("rain") || d.includes("drizzle") || d.includes("shower") || d.includes("storm")) return weatherIcons.rain;
            return weatherIcons.cloudy;
        }

        function getWindDirection(deg) {
            if (deg === undefined || deg === null) return "";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return dirs[Math.round(deg / 45) % 8];
        }

        function selectPreset() {
            const key = document.getElementById('airport-preset').value;
            if (presets[key]) {
                document.getElementById('input-city').value = presets[key].city;
                document.getElementById('input-location-label').value = presets[key].label;
                activeCoords = { lat: presets[key].lat, lon: presets[key].lon };
            }
        }

        function applyTheme() {
            const key = document.getElementById('theme-select').value;
            const t = themes[key];
            if (!t) return;
            document.documentElement.style.setProperty('--top-bg', t.topBg);
            document.documentElement.style.setProperty('--bottom-bg', t.bottomBg);
            document.documentElement.style.setProperty('--top-border-color', t.topBorder);
            document.documentElement.style.setProperty('--bottom-border-color', t.bottomBorder);
            document.documentElement.style.setProperty('--sub-border-color', t.subBorder);
        }

        function updateLiveIcon() {
            const key = document.getElementById('live-icon-select').value;
            document.getElementById('live-icon-container').innerHTML = liveIcons[key] || "";
        }

        function updateTickerSpeed() {
            const speed = document.getElementById('input-speed').value;
            document.getElementById('speed-val').innerText = `${speed}s`;
            document.documentElement.style.setProperty('--ticker-speed', `${speed}s`);
        }

        async function fetchWeather(city, coords = null) {
            const statusEl = document.getElementById('status-msg');
            statusEl.innerText = "Fetching live weather...";

            try {
                let lat, lon;

                if (coords) {
                    lat = coords.lat;
                    lon = coords.lon;
                } else {
                    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
                    const geoRes = await fetch(geoUrl);
                    if (!geoRes.ok) throw new Error("Geocoding failed");
                    const geoData = await geoRes.json();

                    if (!geoData.results || geoData.results.length === 0) {
                        weatherItems = ["City not found"];
                        startFlipCycle();
                        statusEl.innerText = "City not found in database.";
                        return;
                    }
                    lat = geoData.results[0].latitude;
                    lon = geoData.results[0].longitude;
                    activeCoords = { lat, lon };
                }

                // Fetch temperature, condition, humidity, pressure, wind speed & wind direction
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,pressure_msl,wind_speed_10m,wind_direction_10m,weather_code`;
                const weatherRes = await fetch(weatherUrl);
                if (!weatherRes.ok) throw new Error("Open-Meteo weather failed");
                const weatherData = await weatherRes.json();

                const cur = weatherData.current;
                const temp = Math.round(cur.temperature_2m);
                const humidity = Math.round(cur.relative_humidity_2m);
                const pressure = Math.round(cur.pressure_msl);
                const windSpeed = Math.round(cur.wind_speed_10m);
                const windDir = getWindDirection(cur.wind_direction_10m);
                const info = interpretWeatherCode(cur.weather_code);

                document.getElementById('display-temp').innerText = `${temp}°C`;
                document.getElementById('weather-icon').innerHTML = info.icon;

                weatherItems = [
                    info.label,
                    `Wind: <span class="metric-highlight">${windDir} ${windSpeed} km/h</span>`,
                    `Humidity: <span class="metric-highlight">${humidity}%</span>`,
                    `Pressure: <span class="metric-highlight">${pressure} hPa</span>`
                ];
                startFlipCycle();
                statusEl.innerText = db ? "Updated & Synced ✔" : "Updated via Open-Meteo ✔";
            } catch (primaryError) {
                try {
                    const fallbackRes = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
                    if (!fallbackRes.ok) throw new Error("Fallback failed");
                    const fallbackData = await fallbackRes.json();
                    const current = fallbackData.current_condition[0];

                    const temp = current.temp_C;
                    const desc = current.weatherDesc[0].value;
                    const windSpeed = current.windspeedKmph;
                    const windDir = current.winddir16Point;
                    const humidity = current.humidity;
                    const pressure = current.pressure;

                    document.getElementById('display-temp').innerText = `${temp}°C`;
                    document.getElementById('weather-icon').innerHTML = mapTextToIcon(desc);

                    weatherItems = [
                        desc,
                        `Wind: <span class="metric-highlight">${windDir} ${windSpeed} km/h</span>`,
                        `Humidity: <span class="metric-highlight">${humidity}%</span>`,
                        `Pressure: <span class="metric-highlight">${pressure} hPa</span>`
                    ];
                    startFlipCycle();
                    statusEl.innerText = "Updated via Backup Weather ✔";
                } catch (fallbackError) {
                    weatherItems = ["Weather Offline"];
                    startFlipCycle();
                    statusEl.innerText = "Network/CORS block. Host on GitHub Pages to run live.";
                }
            }
        }

        function updateJapanClock() {
            const now = new Date();
            const timeOptions = { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false };
            const dateOptions = { timeZone: 'Asia/Tokyo', month: 'short', day: 'numeric', year: 'numeric' };

            document.getElementById('display-time').innerText = new Intl.DateTimeFormat('en-US', timeOptions).format(now);
            document.getElementById('display-date').innerText = new Intl.DateTimeFormat('en-US', dateOptions).format(now);
        }

        // ================= APPLY & SYNC SETTINGS =================
        function renderOverlayUI(settings) {
            document.getElementById('display-location').innerText = settings.locationLabel;
            document.getElementById('display-status-label').innerText = settings.statusLabel;
            document.getElementById('display-badge').innerText = settings.badgeText;
            document.getElementById('display-news').innerHTML = settings.newsText.replace(/•/g, '&nbsp;&nbsp;•&nbsp;&nbsp;');

            document.getElementById('airport-preset').value = settings.preset;
            document.getElementById('theme-select').value = settings.theme;
            document.getElementById('input-city').value = settings.city;
            document.getElementById('input-location-label').value = settings.locationLabel;
            document.getElementById('input-status-label').value = settings.statusLabel;
            document.getElementById('live-icon-select').value = settings.liveIcon;
            document.getElementById('input-badge').value = settings.badgeText;
            document.getElementById('input-flip-speed').value = settings.flipSpeed;
            document.getElementById('input-speed').value = settings.tickerSpeed;
            document.getElementById('input-news').value = settings.newsText;

            applyTheme();
            updateLiveIcon();
            updateFlipSpeed();
            updateTickerSpeed();

            currentCity = settings.city;
            const coords = presets[settings.preset] ? { lat: presets[settings.preset].lat, lon: presets[settings.preset].lon } : null;
            fetchWeather(currentCity, coords);
        }

        function applySettings() {
            const settings = {
                preset: document.getElementById('airport-preset').value,
                theme: document.getElementById('theme-select').value,
                city: document.getElementById('input-city').value.trim() || "Komaki",
                locationLabel: document.getElementById('input-location-label').value.trim() || "Nagoya Area (Komaki)",
                statusLabel: document.getElementById('input-status-label').value.trim() || "Japan Time",
                liveIcon: document.getElementById('live-icon-select').value,
                badgeText: document.getElementById('input-badge').value.trim() || "AVIATION NEWS",
                flipSpeed: document.getElementById('input-flip-speed').value,
                tickerSpeed: document.getElementById('input-speed').value,
                newsText: document.getElementById('input-news').value.trim(),
                updatedAt: new Date().toISOString()
            };

            renderOverlayUI(settings);

            // Save to Firebase Realtime Database
            if (db) {
                db.ref('sky_stations_overlay').set(settings)
                    .then(() => {
                        document.getElementById('status-msg').innerText = "Saved & synced to Firebase ✔";
                    })
                    .catch((err) => {
                        document.getElementById('status-msg').innerText = "Firebase save error: " + err.message;
                    });
            }
        }

        // ================= REAL-TIME LISTENER FROM FIREBASE =================
        if (db) {
            db.ref('sky_stations_overlay').on('value', (snapshot) => {
                const remoteData = snapshot.val();
                if (remoteData) {
                    renderOverlayUI(remoteData);
                }
            });
        }

        // Initial boot
        setInterval(updateJapanClock, 1000);
        updateJapanClock();
        fetchWeather("Komaki", activeCoords);
        setInterval(() => fetchWeather(currentCity, activeCoords), 600000); // Auto-refresh weather every 10 min
    </script>
</body>
</html>
