<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- Leaflet CSS & JS for Interactive Radar Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap');

        :root {
            --top-bg: rgba(6, 21, 45, 0.85);
            --top-border-color: #38bdf8;
            --bottom-border-color: #F9A53E;
            --bar-width: 92%;
            --bar-height: 82px;
            --overlay-font-bump: 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body.chroma-green {
            background-color: #00b140;
        }

        /* ================= CONTROL PANEL ================= */
        #control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 440px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            background: rgba(13, 27, 42, 0.96);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-20px);
        }

        #control-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .panel-header h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #F9A53E;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-group label span {
            color: #38bdf8;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #38bdf8;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #F9A53E;
            cursor: pointer;
        }

        /* Mini Radar Map inside Control Panel */
        #radar-container {
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            background: #0f172a;
        }

        #radar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: #1e293b;
            font-size: 10px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
        }

        #radar-map {
            width: 100%;
            height: 165px;
            z-index: 1;
        }

        .dark-map-tiles {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .btn-mini {
            padding: 4px 8px;
            font-size: 10px;
            background: #38bdf8;
            color: #0d1b2a;
            border-radius: 4px;
            font-weight: 800;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }

        .btn-mini:hover {
            background: #7dd3fc;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button.main-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-orange {
            background: #F9A53E;
            color: #0d1b2a;
        }

        .btn-orange:hover {
            background: #e08e29;
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status-text {
            font-size: 11px;
            color: #38bdf8;
            margin-top: 8px;
            min-height: 16px;
            font-weight: 600;
        }

        /* ================= BROADCAST OVERLAY RESPONSIVO ================= */
        .overlay-wrapper {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: var(--bar-width, 92%);
            max-width: 1600px;
            transition: width 0.1s ease;
        }

        .broadcast-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--bar-height, 82px);
            padding: 0 clamp(12px, 2vw, 28px);
            border-radius: 12px;
            background: var(--top-bg, rgba(6, 21, 45, 0.85));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 2px solid var(--top-border-color, #38bdf8);
            border-bottom: 2px solid var(--bottom-border-color, #F9A53E);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            gap: clamp(8px, 1.5vw, 20px);
        }

        .divider-v {
            width: 2px;
            height: 55%;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        /* Left: Weather Section */
        .weather-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(8px, 1.2vw, 14px);
            color: #ffffff;
            flex: 1;
            min-width: 0;
        }

        .weather-icon {
            width: clamp(36px, 4vw, 46px);
            height: clamp(36px, 4vw, 46px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .weather-icon:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .city-title {
            font-size: clamp(calc(13px + var(--overlay-font-bump)), calc(1.35vw + var(--overlay-font-bump)), calc(17px + var(--overlay-font-bump)));
            font-weight: 800;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .weather-top-row {
            display: flex;
            align-items: baseline;
            gap: clamp(6px, 1vw, 10px);
        }

        .main-temp {
            font-size: clamp(calc(20px + var(--overlay-font-bump)), calc(2.5vw + var(--overlay-font-bump)), calc(32px + var(--overlay-font-bump)));
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.5px;
        }

        .condition-text {
            font-size: clamp(calc(11px + var(--overlay-font-bump)), calc(1.2vw + var(--overlay-font-bump)), calc(14px + var(--overlay-font-bump)));
            font-weight: 600;
            color: #cbd5e1;
        }

        .weather-details {
            display: flex;
            gap: 6px;
            font-size: clamp(calc(9px + var(--overlay-font-bump)), calc(1vw + var(--overlay-font-bump)), calc(12px + var(--overlay-font-bump)));
            font-weight: 600;
            color: #94a3b8;
            margin-top: 3px;
        }

        .weather-details span {
            color: #e2e8f0;
        }

        /* Center: Flight Tracking Block */
        .flight-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.5vw, 16px);
            color: #ffffff;
            flex: 1.3;
            min-width: 0;
        }

        .airline-logo-box {
            width: clamp(34px, 4vw, 46px);
            height: clamp(34px, 4vw, 46px);
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
        }

        .airline-logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
        }

        .flight-main-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .flight-sub-header {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .callsign-text {
            font-size: clamp(calc(12px + var(--overlay-font-bump)), calc(1.3vw + var(--overlay-font-bump)), calc(16px + var(--overlay-font-bump)));
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            color: #F9A53E;
        }

        .airline-badge {
            font-size: clamp(calc(9px + var(--overlay-font-bump)), calc(1vw + var(--overlay-font-bump)), calc(11px + var(--overlay-font-bump)));
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 1px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .route-text {
            font-size: clamp(calc(14px + var(--overlay-font-bump)), calc(1.8vw + var(--overlay-font-bump)), calc(22px + var(--overlay-font-bump)));
            font-weight: 800;
            color: #ffffff;
            margin-top: 2px;
            line-height: 1.1;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .route-arrow {
            color: #38bdf8;
            font-weight: 800;
        }

        .aircraft-telemetry {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            font-size: clamp(calc(8px + var(--overlay-font-bump)), calc(0.9vw + var(--overlay-font-bump)), calc(10px + var(--overlay-font-bump)));
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
            margin-top: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .aircraft-telemetry span {
            color: #e2e8f0;
            white-space: nowrap;
        }

        /* Right: Clock Section with Static Live Indicator */
        .clock-section {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(8px, 1.2vw, 14px);
            color: #ffffff;
            flex: 1;
            min-width: 0;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: clamp(4px, 0.8vw, 6px) clamp(8px, 1vw, 12px);
            border-radius: 20px;
            white-space: nowrap;
        }

        .live-icon svg {
            display: block;
            fill: #ef4444;
        }

        .live-text {
            font-size: clamp(calc(10px + var(--overlay-font-bump)), calc(1.1vw + var(--overlay-font-bump)), calc(12px + var(--overlay-font-bump)));
            font-weight: 800;
            color: #fca5a5;
            letter-spacing: 0.5px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            white-space: nowrap;
        }

        .clock-time {
            font-size: clamp(calc(22px + var(--overlay-font-bump)), calc(2.8vw + var(--overlay-font-bump)), calc(36px + var(--overlay-font-bump)));
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: clamp(calc(10px + var(--overlay-font-bump)), calc(1.1vw + var(--overlay-font-bump)), calc(13px + var(--overlay-font-bump)));
            font-weight: 600;
            color: #cbd5e1;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .broadcast-bar {
                padding: 0 12px;
            }
            .divider-v {
                margin: 0 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        <div class="panel-header">
            <h3>Sky Stations • Control Panel</h3>
            <button class="main-btn btn-secondary" style="flex:0; padding:4px 10px;" onclick="togglePanel()">Hide</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Bar Width <span id="val-width">92%</span></label>
                <input type="range" id="slider-width" min="60" max="98" value="92" oninput="updateBarDimensions()">
            </div>
            <div class="form-group">
                <label>Bar Height <span id="val-height">82px</span></label>
                <input type="range" id="slider-height" min="68" max="120" value="82" oninput="updateBarDimensions()">
            </div>
        </div>
        <div class="form-group">
            <label>Overlay Font Size <span id="val-font-size">+0px</span></label>
            <input type="range" id="slider-font-size" min="0" max="6" step="1" value="0" oninput="updateOverlayFontSize()">
        </div>

        <div id="radar-container">
            <div id="radar-header">
                <span>Live Radar (adsb.lol)</span>
                <button class="btn-mini" onclick="refreshRadarFlights()">Scan Area</button>
            </div>
            <div class="form-group" style="margin: 8px 10px 4px;">
                <label><span id="api-key-label">adsb.lol API Key</span> <span id="api-key-status">Not saved</span></label>
                <div style="display: flex; gap: 4px;">
                    <input type="password" id="input-api-key" autocomplete="off" placeholder="Cole sua chave aqui">
                    <button class="btn-mini" id="api-key-save-button" type="button" onclick="saveAdsbApiKey()">Save</button>
                </div>
            </div>
            <div id="radar-map"></div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City for Weather</label>
                <div style="display: flex; gap: 4px;">
                    <input type="text" id="input-city" value="Nagoya" placeholder="Ex: Nagoya, Osaka..." onchange="fetchAndApplyWeather(this.value)">
                    <button class="btn-mini" onclick="fetchAndApplyWeather(document.getElementById('input-city').value)">Go</button>
                </div>
            </div>

            <div class="form-group">
                <label>Flight Callsign</label>
                <input type="text" id="input-callsign" value="JAL921" placeholder="Ex: JAL921">
            </div>
        </div>

        <div class="form-group">
            <label>Route Display Label (Auto-City)</label>
            <input type="text" id="input-route" value="N/A → N/A" placeholder="Auto from ADS-B; N/A if unavailable">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Country Code (Flag)</label>
                <input type="text" id="input-country" value="JP" placeholder="Ex: JP, US...">
            </div>

            <div class="form-group">
                <label>Aircraft Model</label>
                <input type="text" id="input-aircraft" value="Boeing 787-8" placeholder="Ex: B788, N/A...">
            </div>
        </div>

        <div class="form-group">
            <label>Live Status Label</label>
            <input type="text" id="input-live-label" value="LIVE NOW" placeholder="Ex: LIVE NOW, ON AIR...">
        </div>

        <div class="btn-row">
            <button class="main-btn btn-orange" onclick="pushSettingsToFirebase()">Update & Sync Overlay</button>
            <button class="main-btn btn-secondary" onclick="toggleChroma()">Chroma Green</button>
        </div>
        <div class="status-text" id="status-msg">Ready. Click weather icon anytime to open/close.</div>
    </div>

    <!-- Main Broadcast Overlay -->
    <div class="overlay-wrapper" id="overlay-wrapper">
        <div class="broadcast-bar">
            <!-- Left: Weather Section -->
            <div class="weather-section">
                <div class="weather-icon" id="weather-icon" onclick="togglePanel()" title="Click to open settings"></div>
                <div class="weather-info">
                    <div class="city-title" id="display-city-name">Nagoya</div>
                    <div class="weather-top-row">
                        <span class="main-temp" id="display-temp">--°C</span>
                        <span class="condition-text" id="display-condition">Loading...</span>
                    </div>
                    <div class="weather-details">
                        Wind: <span id="display-wind">-- km/h N</span>
                        &bull;
                        Pres: <span id="display-pressure">---- hPa</span>
                    </div>
                </div>
            </div>

            <div class="divider-v"></div>

            <!-- Center: Flight Tracking Block -->
            <div class="flight-block">
                <div class="airline-logo-box">
                    <img id="display-airline-logo" src="https://flagcdn.com/w80/jp.png" alt="Airline logo">
                </div>
                <div class="flight-main-info">
                    <div class="flight-sub-header">
                        <span class="callsign-text" id="display-callsign">JAL921</span>
                        <span class="airline-badge" id="display-airline">Japan Airlines</span>
                    </div>
                    <div class="route-text" id="display-route">
                        N/A <span class="route-arrow">&rarr;</span> N/A
                    </div>
                    <div class="aircraft-telemetry">
                        <span id="display-aircraft">B788</span>
                        <span id="display-altitude">ALT -- FT</span>
                        <span id="display-speed">GS -- KT</span>
                    </div>
                </div>
            </div>

            <div class="divider-v"></div>

            <!-- Right: Clock Section with Static Live Indicator -->
            <div class="clock-section">
                <div class="live-indicator">
                    <span class="live-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                        </svg>
                    </span>
                    <span class="live-text" id="display-live-label">LIVE NOW</span>
                </div>

                <div class="time-box">
                    <span class="clock-time" id="display-time">00:00</span>
                    <span class="clock-date" id="display-date">--------- --, ----</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = String(window.SKY_STATIONS_API_BASE || "").replace(/\/+$/, "");
        const API_ACCESS_STORAGE_KEY = "skyStationsWorkerPassword";
        let workerAccessPassword = null;

        function getWorkerAccessPassword() {
            if (workerAccessPassword !== null) return workerAccessPassword;
            try {
                workerAccessPassword = localStorage.getItem(API_ACCESS_STORAGE_KEY) || "";
            } catch (error) {
                workerAccessPassword = "";
                console.error("Could not read Worker password from browser storage:", error);
            }
            return workerAccessPassword;
        }

        function storeWorkerAccessPassword(password) {
            workerAccessPassword = password;
            try {
                localStorage.setItem(API_ACCESS_STORAGE_KEY, password);
            } catch (error) {
                console.error("Worker password will only remain active for this page session:", error);
            }
        }

        function loadWorkerPasswordFromUrl() {
            const prefix = "#worker-password=";
            if (!API_BASE_URL || !window.location.hash.startsWith(prefix)) return;

            let password;
            try {
                password = decodeURIComponent(window.location.hash.slice(prefix.length));
            } catch (error) {
                console.error("Could not read Worker password from URL fragment:", error);
                return;
            }
            if (!password) return;

            storeWorkerAccessPassword(password);
            history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
        }

        loadWorkerPasswordFromUrl();

        function apiFetch(path, options = {}) {
            const headers = new Headers(options.headers || {});
            if (API_BASE_URL) {
                const password = getWorkerAccessPassword();
                if (password) headers.set("X-Overlay-Password", password);
            }
            return fetch(`${API_BASE_URL}${path}`, { ...options, headers });
        }

        const firebaseConfig = {
            databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/"
        };

        const AIRPORT_CODE_MAP = {
            "HND": "Tokyo", "NRT": "Tokyo", "KIX": "Osaka", "ITM": "Osaka",
            "NGO": "Nagoya", "CTS": "Sapporo", "FUK": "Fukuoka", "OKA": "Okinawa",
            "KOJ": "Kagoshima", "KMJ": "Kumamoto", "NGA": "Niigata", "SDJ": "Sendai",
            "TAK": "Takamatsu", "KIJ": "Niigata", "KKJ": "Kitakyushu", "FSZ": "Shizuoka",
            "AOJ": "Aomori", "HKD": "Hakodate", "IBR": "Ibaraki", "MYJ": "Matsuyama",
            "OIT": "Oita", "UBJ": "Ube", "MZV": "Matsumoto", "TPE": "Taipei", "ICN": "Seoul"
        };

        const AIRLINE_MAP = {
            "JAL": "Japan Airlines", "ANA": "All Nippon Airways", "EVA": "EVA Air",
            "CAL": "China Airlines", "FDA": "Fuji Dream Airlines", "SKY": "Skymark",
            "ADO": "Air Do", "SNJ": "Solaseed Air", "SFJ": "StarFlyer",
            "APJ": "Peach Aviation", "JJP": "Jetstar Japan", "KAL": "Korean Air",
            "AAR": "Asiana Airlines", "CPA": "Cathay Pacific", "SIA": "Singapore Airlines",
            "THA": "Thai Airways", "UAL": "United Airlines", "DAL": "Delta Air Lines",
            "AAL": "American Airlines"
        };

        const AIRLINE_LOGO_BASE_URL = "https://raw.githubusercontent.com/Jxck-S/airline-logos/main/flightaware_logos";

        function updateAirlineLogo(callsign, countryCode = "un") {
            const image = document.getElementById('display-airline-logo');
            const prefix = (callsign || "").trim().toUpperCase().match(/^[A-Z0-9]{3}/);
            const fallbackCode = /^[A-Z]{2}$/i.test(countryCode) ? countryCode.toLowerCase() : "un";
            const fallbackUrl = `https://flagcdn.com/w80/${fallbackCode}.png`;

            if (!prefix) {
                image.onerror = null;
                image.src = fallbackUrl;
                image.alt = `${fallbackCode.toUpperCase()} country flag`;
                return;
            }

            image.alt = `${getAirlineName(callsign)} logo`;
            image.onerror = () => {
                image.onerror = null;
                image.src = fallbackUrl;
                image.alt = `${fallbackCode.toUpperCase()} country flag`;
            };
            image.src = `${AIRLINE_LOGO_BASE_URL}/${prefix[0]}.png`;
        }

        let selectedCallsign = null; // Guarda o voo selecionado para atualizar em tempo real

        function getAirlineName(callsign) {
            if (!callsign) return "";
            const prefix = callsign.replace(/[^A-Za-z]/g, '').toUpperCase().substring(0, 3);
            return AIRLINE_MAP[prefix] || prefix;
        }

        function getCityName(code) {
            const original = code ? code.trim() : "";
            const cleanCode = original.toUpperCase();
            return AIRPORT_CODE_MAP[cleanCode] || (/^[A-Z0-9]{3,4}$/.test(cleanCode) ? cleanCode : original);
        }

        function getRouteCityLabel(routeString) {
            if (!routeString || !routeString.includes('→')) {
                return routeString || NO_ROUTE_LABEL;
            }
            const parts = routeString.split('→').map(s => s.trim());
            return `${getCityName(parts[0])} → ${getCityName(parts[parts.length - 1])}`;
        }

        function formatRouteWithCities(routeString) {
            if (!routeString || !routeString.includes('→')) {
                return routeString || "N/A <span class=\"route-arrow\">&rarr;</span> N/A";
            }
            const parts = getRouteCityLabel(routeString).split('→').map(s => s.trim());

            return `${parts[0]} <span class="route-arrow">&rarr;</span> ${parts[1]}`;
        }

        const NO_ROUTE_LABEL = "N/A → N/A";

        async function resolveAircraftRoute(aircraft) {
            const callsign = (aircraft.flight || "").trim().toUpperCase();
            let routeLabel = aircraft.from && aircraft.to
                ? `${aircraft.from} → ${aircraft.to}`
                : NO_ROUTE_LABEL;

            if (callsign.length < 3) return routeLabel;

            try {
                const routeUrl = `/route?callsign=${encodeURIComponent(callsign)}`;
                const response = await apiFetch(routeUrl);
                if (response.status === 404) return routeLabel;
                if (!response.ok) throw new Error(`Route lookup HTTP ${response.status}`);

                const route = await response.json();
                const airports = route._airports || [];
                for (const airport of route._airports || []) {
                    const city = airport.location || airport.city || airport.municipality;
                    if (!city) continue;

                    for (const code of [airport.iata, airport.icao]) {
                        if (code) AIRPORT_CODE_MAP[code.trim().toUpperCase()] = city.trim();
                    }
                }

                if (airports.length >= 2) {
                    const origin = airports[0].location || airports[0].city || airports[0].municipality || airports[0].iata || airports[0].icao;
                    const destination = airports[airports.length - 1].location || airports[airports.length - 1].city || airports[airports.length - 1].municipality || airports[airports.length - 1].iata || airports[airports.length - 1].icao;
                    if (origin && destination) {
                        routeLabel = `${origin} → ${destination}`;
                        return routeLabel;
                    }
                }

                const airportCodes = route._airport_codes_iata && route._airport_codes_iata !== "unknown"
                    ? route._airport_codes_iata
                    : route.airport_codes;
                const codes = (airportCodes || "")
                    .split("-")
                    .map(code => code.trim().toUpperCase())
                    .filter(code => /^[A-Z0-9]{3,4}$/.test(code));

                if (codes.length >= 2) {
                    routeLabel = `${codes[0]} → ${codes[codes.length - 1]}`;
                }
            } catch (err) {
                console.error("Route lookup error:", err);
            }

            return routeLabel;
        }

        async function applyRouteForCallsign(callsign, aircraft, syncSettings = false) {
            const normalizedCallsign = (callsign || "").trim().toUpperCase();
            selectedCallsign = normalizedCallsign && normalizedCallsign !== "N/A"
                ? normalizedCallsign
                : null;

            if (!selectedCallsign) {
                updateFlightTelemetry(null);
                document.getElementById('input-route').value = NO_ROUTE_LABEL;
                document.getElementById('display-route').innerHTML = formatRouteWithCities(NO_ROUTE_LABEL);
                return;
            }

            const trackingCallsign = selectedCallsign;
            const hasTelemetry = aircraft && (
                Number.isFinite(aircraft.alt_baro) ||
                Number.isFinite(aircraft.alt_geom) ||
                Number.isFinite(aircraft.gs)
            );
            if (hasTelemetry) {
                updateFlightTelemetry(aircraft);
            } else {
                updateFlightTelemetry(null);
                refreshSelectedTelemetry();
            }

            const route = await resolveAircraftRoute(aircraft || { flight: trackingCallsign });
            if (selectedCallsign !== trackingCallsign) return;

            const cityRoute = getRouteCityLabel(route);
            document.getElementById('input-route').value = cityRoute;
            document.getElementById('display-route').innerHTML = formatRouteWithCities(cityRoute);
            if (syncSettings) pushSettingsToFirebase();
        }

        function updateFlightTelemetry(aircraft) {
            const altitude = aircraft && Number.isFinite(aircraft.alt_baro)
                ? aircraft.alt_baro
                : aircraft && Number.isFinite(aircraft.alt_geom)
                    ? aircraft.alt_geom
                    : null;
            const speed = aircraft && Number.isFinite(aircraft.gs) ? aircraft.gs : null;

            document.getElementById('display-altitude').innerText = altitude === null
                ? aircraft && aircraft.alt_baro === "ground" ? "ALT GROUND" : "ALT -- FT"
                : `ALT ${Math.round(altitude).toLocaleString('en-US')} FT`;
            document.getElementById('display-speed').innerText = speed === null
                ? "GS -- KT"
                : `GS ${Math.round(speed)} KT`;
        }

        let db = null;
        let settingsRef = null;
        try {
            if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("http")) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                settingsRef = db.ref("flightOverlaySettings");
            }
        } catch (err) {
            console.error("Firebase init error:", err);
        }

        function updateBarDimensions() {

            document.getElementById('val-width').innerText = `${widthVal}%`;

            document.getElementById('val-font-size').innerText = `+${increase}px`;
            document.documentElement.style.setProperty('--overlay-font-bump', `${increase}px`);
        }

        let aircraftLayer = null;
        let currentLat = 35.1815;
        let currentLon = 136.9066;
        let radarRefreshInProgress = false;
        let telemetryRefreshInProgress = false;

        async function saveAdsbApiKey() {
            const keyInput = document.getElementById('input-api-key');
            const key = keyInput.value.trim();
            const statusEl = document.getElementById('status-msg');
            try {
                if (API_BASE_URL) {
                    if (!key) throw new Error("Enter the private Worker password.");
                    storeWorkerAccessPassword(key);
                    keyInput.value = "";
                    const response = await apiFetch("/auth/check");
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error || `Worker access HTTP ${response.status}`);
                    document.getElementById('api-key-status').innerText = "Worker connected";
                    statusEl.innerText = "Cloudflare Worker connected. Scanning...";
                    refreshRadarFlights();
                    fetchAndApplyWeather(document.getElementById('input-city').value);
                    const callsign = document.getElementById('input-callsign').value.trim();
                    if (callsign) applyRouteForCallsign(callsign, { flight: callsign });
                    return;
                }

                const response = await apiFetch("/api/key", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ key })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Failed to save key");

                keyInput.value = "";
                document.getElementById('api-key-status').innerText = result.saved ? "Saved in proxy" : "Not saved";
                statusEl.innerText = result.saved
                    ? "adsb.lol API key saved. Scanning..."
                    : "API key removed.";
                if (result.saved) refreshRadarFlights();
            } catch (err) {
                document.getElementById('api-key-status').innerText = API_BASE_URL
                    ? "Worker password rejected"
                    : "Proxy unavailable";
                statusEl.innerText = API_BASE_URL
                    ? "Worker connection failed. Check the Worker password and Cloudflare settings."
                    : "Proxy unavailable. Start iniciar_proxy.bat and open http://127.0.0.1:8899/";
                console.error("API key save error:", err);
            }
        }

        function initRadarMap() {
            map = L.map('radar-map', {
                center: [currentLat, currentLon],
                zoom: 8,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 15,
                className: 'dark-map-tiles'
            }).addTo(map);

            aircraftLayer = L.layerGroup().addTo(map);
            refreshRadarFlights();
            setInterval(refreshRadarFlights, 240000);
            setInterval(refreshSelectedTelemetry, 180000);
        }

        function deriveCountryFromReg(reg) {
            if (reg) {
                const r = reg.toUpperCase();
                if (r.startsWith("JA")) return "JP";
                if (r.startsWith("N")) return "US";
                if (r.startsWith("B-")) return "CN";
                if (r.startsWith("HL")) return "KR";
                if (r.startsWith("VH")) return "AU";
                if (r.startsWith("G-")) return "GB";
                if (r.startsWith("F-")) return "FR";
                if (r.startsWith("D-")) return "DE";
                if (r.startsWith("C-")) return "CA";
                if (r.startsWith("9V")) return "SG";
                if (r.startsWith("HS")) return "TH";
                if (r.startsWith("RP")) return "PH";
                if (r.startsWith("VN")) return "VN";
            }
            return "JP";
        }

        async function refreshRadarFlights() {
            const statusEl = document.getElementById('status-msg');
            if (!map || radarRefreshInProgress) return;

            radarRefreshInProgress = true;
            const center = map.getCenter();

            try {
                const radiusNm = 150;
                const radarUrl = `/radar?lat=${center.lat.toFixed(4)}&lon=${center.lng.toFixed(4)}&radius=${radiusNm}`;
                const res = await apiFetch(radarUrl);
                if (!res.ok) {
                    const error = await res.json().catch(() => ({}));
                    throw new Error(error.error || `Radar HTTP ${res.status}`);
                }
                const data = await res.json();
 
                aircraftLayer.clearLayers();

                if (!data.ac || data.ac.length === 0) {
                    statusEl.innerText = "No aircraft detected in this area.";
                    return;
                }

                let count = 0;
                data.ac.forEach(ac => {
                    if (ac.lat && ac.lon) {
                        count++;
                        const callsign = (ac.flight || ac.r || ac.hex || "N/A").trim().toUpperCase();
                        const model = ac.t || "N/A";
                        const reg = ac.r || "";
                        const track = ac.track || 0;

                        if (selectedCallsign && callsign === selectedCallsign) {
                            const country = deriveCountryFromReg(reg);
                            document.getElementById('input-aircraft').value = model;
                            document.getElementById('input-country').value = country;
                            document.getElementById('display-aircraft').innerText = model;
                            updateAirlineLogo(callsign, country);
                            updateFlightTelemetry(ac);
                            if (ac.from && ac.to) {
                                const routeStr = `${ac.from} → ${ac.to}`;
                                document.getElementById('input-route').value = routeStr;
                                document.getElementById('display-route').innerHTML = formatRouteWithCities(routeStr);
                            }
                        }

                        let routeStr = NO_ROUTE_LABEL;
                        if (ac.from && ac.to) {
                            routeStr = `${ac.from} → ${ac.to}`;
                        }

                        const planeIcon = L.divIcon({
                            className: 'custom-plane-icon',
                            html: `<div style="transform: rotate(${track}deg); color: #F9A53E; font-size: 16px; text-shadow: 0 0 4px #000; cursor: pointer;">&#9992;</div>`,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        const marker = L.marker([ac.lat, ac.lon], { icon: planeIcon });
                        marker.bindTooltip(`${callsign} (${model})`, { direction: 'top' });

                        marker.on('click', () => {
                            const country = deriveCountryFromReg(reg);
                            document.getElementById('input-callsign').value = callsign;
                            document.getElementById('input-aircraft').value = model;
                            document.getElementById('input-country').value = country;
                            document.getElementById('input-route').value = routeStr;

                            document.getElementById('display-callsign').innerText = callsign;
                            document.getElementById('display-airline').innerText = getAirlineName(callsign);
                            document.getElementById('display-route').innerHTML = formatRouteWithCities(routeStr);
                            document.getElementById('display-aircraft').innerText = model;
                            updateFlightTelemetry(ac);
                            updateAirlineLogo(callsign, country);

                            statusEl.innerText = `Tracking ${callsign} live.`;
                            applyRouteForCallsign(callsign, ac, true);
                        });

                        marker.addTo(aircraftLayer);
                    }
                });

                statusEl.innerText = `Radar updated: ${count} aircraft found. Click any plane to track live.`;
            } catch (err) {
                console.error("Radar fetch error:", err);
                if (err.message.includes("HTTP 401")) {
                    document.getElementById('api-key-status').innerText = "Access denied (HTTP 401)";
                    statusEl.innerText = API_BASE_URL
                        ? "Worker access denied or ADSB.lol rejected its key."
                        : "ADSB.lol rejected the API key. Paste the raw key and save it again.";
                } else if (err.message.includes("HTTP 429")) {
                    statusEl.innerText = "Radar rate limit (HTTP 429).";
                } else {
                    statusEl.innerText = "Radar update failed. Check console for details.";
                }
            } finally {
                radarRefreshInProgress = false;
            }
        }

        async function refreshSelectedTelemetry() {
            const callsign = selectedCallsign;
            if (!callsign || telemetryRefreshInProgress) return;

            telemetryRefreshInProgress = true;
            try {
                const response = await apiFetch(`/telemetry?callsign=${encodeURIComponent(callsign)}`);
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error || `Telemetry HTTP ${response.status}`);
                }

                const data = await response.json();
                if (selectedCallsign !== callsign) return;
                const aircraft = (data.ac || []).find(ac =>
                    (ac.flight || "").trim().toUpperCase() === callsign
                );
                updateFlightTelemetry(aircraft || null);
            } catch (err) {
                console.error("Telemetry refresh error:", err);
                if (err.message.includes("HTTP 401")) {
                    document.getElementById('api-key-status').innerText = "Access denied (HTTP 401)";
                    document.getElementById('status-msg').innerText = API_BASE_URL
                        ? "Worker access denied or ADSB.lol rejected its key."
                        : "ADSB.lol rejected the API key. Paste the raw key and save it again.";
                } else if (err.message.includes("HTTP 429")) {
                    document.getElementById('status-msg').innerText = "Telemetry rate limit (HTTP 429).";
                }
            } finally {
                telemetryRefreshInProgress = false;
            }
        }

        document.getElementById('weather-icon').innerHTML = weatherIcons.partlyCloudy;

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            panel.classList.toggle('show');
            if (panel.classList.contains('show') && map) {
                setTimeout(() => map.invalidateSize(), 250);

        function getWindDirection(deg) {
            if (deg === undefined || deg === null) return "N";
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return dirs[Math.round(deg / 45) % 8];
        }

        function interpretWeatherCode(code) {
            if (code === 0) return { label: "Clear Sky", icon: weatherIcons.clear };
            if (code === 1 || code === 2) return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
            if (code === 3) return { label: "Overcast", icon: weatherIcons.cloudy };
            if (code >= 45 && code <= 48) return { label: "Foggy", icon: weatherIcons.cloudy };
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { label: "Rain", icon: weatherIcons.rain };
            if (code >= 71 && code <= 77) return { label: "Snow", icon: weatherIcons.cloudy };
            if (code >= 95) return { label: "Thunderstorm", icon: weatherIcons.rain };
            return { label: "Partly Cloudy", icon: weatherIcons.partlyCloudy };
        }

        async function fetchAndApplyWeather(city) {
            const statusEl = document.getElementById('status-msg');
            if (!city || city.trim() === "") return;

            statusEl.innerText = `Searching weather & radar for ${city}...`;
            try {
                const geoRes = await apiFetch(`/weather/geocode?name=${encodeURIComponent(city.trim())}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) {
                    statusEl.innerText = `City "${city}" not found.`;
                    return;
                }
                
                const { latitude, longitude, name } = geoData.results[0];
                currentLat = latitude;
                currentLon = longitude;

                document.getElementById('display-city-name').innerText = name;

                if (map) {
                    map.setView([currentLat, currentLon], 8);
                    refreshRadarFlights();
                }

                const weatherRes = await apiFetch(`/weather/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,pressure_msl,wind_speed_10m,wind_direction_10m,weather_code`);
                const weatherData = await weatherRes.json();
                
                const cur = weatherData.current;
                const temp = Math.round(cur.temperature_2m);
                const pressure = Math.round(cur.pressure_msl);
                const windSpeed = Math.round(cur.wind_speed_10m);
                const windDir = getWindDirection(cur.wind_direction_10m);
                const info = interpretWeatherCode(cur.weather_code);

                document.getElementById('display-temp').innerText = `${temp}°C`;
                document.getElementById('display-condition').innerText = info.label;
                document.getElementById('weather-icon').innerHTML = info.icon;
                document.getElementById('display-wind').innerText = `${windSpeed} km/h ${windDir}`;
                document.getElementById('display-pressure').innerText = `${pressure} hPa`;

                statusEl.innerText = `Weather updated for ${name}.`;
            } catch (err) {
                console.error("Weather fetch error:", err);
                statusEl.innerText = "Failed to fetch weather data.";
            }
        }

        function pushSettingsToFirebase() {
            const cityVal = document.getElementById('input-city').value.trim() || "Nagoya";
            const rawRoute = document.getElementById('input-route').value.trim() || "N/A → N/A";
            
            const payload = {
                city: cityVal,
                callsign: document.getElementById('input-callsign').value.trim() || "N/A",
                route: rawRoute,
                country: document.getElementById('input-country').value.trim() || "JP",
                aircraft: document.getElementById('input-aircraft').value.trim() || "N/A",
                liveLabel: document.getElementById('input-live-label').value.trim() || "",
                barWidth: document.getElementById('slider-width').value,
                barHeight: document.getElementById('slider-height').value,
                fontSizeIncrease: document.getElementById('slider-font-size').value
            };

            applySettingsObject(payload);
            fetchAndApplyWeather(cityVal);
            const callsign = payload.callsign.toUpperCase();
            if (callsign !== (selectedCallsign || "")) {
                applyRouteForCallsign(callsign, { flight: callsign });
            }

            if (settingsRef) {
                settingsRef.set(payload).then(() => {
                    document.getElementById('status-msg').innerText = "Synced with Firebase!";
                }).catch(() => {
                    document.getElementById('status-msg').innerText = "Local update applied (Firebase offline).";
                });
            }
        }

        function applySettingsObject(data) {
            if (!data) return;

            if (data.barWidth) {
                document.getElementById('slider-width').value = data.barWidth;
                document.getElementById('val-width').innerText = `${data.barWidth}%`;
                document.documentElement.style.setProperty('--bar-width', `${data.barWidth}%`);
            }
            if (data.barHeight) {
                document.getElementById('slider-height').value = data.barHeight;
                document.getElementById('val-height').innerText = `${data.barHeight}px`;
                document.documentElement.style.setProperty('--bar-height', `${data.barHeight}px`);
            }
            if (data.fontSizeIncrease !== undefined) {
                document.getElementById('slider-font-size').value = data.fontSizeIncrease;
                updateOverlayFontSize();
            }
            if (data.city) {
                document.getElementById('input-city').value = data.city;
                document.getElementById('display-city-name').innerText = data.city;
            }
            if (data.callsign) {
                document.getElementById('input-callsign').value = data.callsign;
                document.getElementById('display-callsign').innerText = data.callsign;
                document.getElementById('display-airline').innerText = getAirlineName(data.callsign);
                updateAirlineLogo(data.callsign, data.country || document.getElementById('input-country').value);
            }
            if (data.route) {
                document.getElementById('input-route').value = data.route;
                document.getElementById('display-route').innerHTML = formatRouteWithCities(data.route);
            }
            if (data.country) {
                document.getElementById('input-country').value = data.country;
                updateAirlineLogo(data.callsign || document.getElementById('input-callsign').value, data.country);
            }
            if (data.aircraft) {
                document.getElementById('input-aircraft').value = data.aircraft;
                document.getElementById('display-aircraft').innerText = data.aircraft;
            }
            if (data.liveLabel !== undefined) {
                document.getElementById('input-live-label').value = data.liveLabel;
                document.getElementById('display-live-label').innerText = data.liveLabel;
            }
        }

        if (settingsRef) {
            settingsRef.on("value", (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    applySettingsObject(data);

                    const previousCallsign = selectedCallsign;
                    const callsign = (data.callsign || "").trim().toUpperCase();
                    selectedCallsign = callsign && callsign !== "N/A" ? callsign : null;
                    if (selectedCallsign && selectedCallsign !== previousCallsign) {
                        applyRouteForCallsign(callsign, { flight: callsign });
                    }
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('display-time').innerText = `${hours}:${minutes}`;

            const options = { month: 'short', day: 'numeric', year: 'numeric' };
            document.getElementById('display-date').innerText = now.toLocaleDateString('en-US', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
        window.onload = () => {
            document.getElementById('api-key-status').innerText = "Not saved";
            if (API_BASE_URL) {
                document.getElementById('api-key-label').innerText = "Private Cloudflare Worker password";
                document.getElementById('input-api-key').placeholder = "Enter your private Worker password";
                document.getElementById('api-key-save-button').innerText = "Connect";
            }
            apiFetch("/health")
                .then(response => {
                    if (!response.ok) throw new Error(`Proxy health HTTP ${response.status}`);
                    return response.json();
                })
                .then(health => {
                    if (API_BASE_URL) {
                        if (!health.passwordConfigured) {
                            document.getElementById('api-key-status').innerText = "Worker password not configured";
                        } else if (!health.keyConfigured) {
                            document.getElementById('api-key-status').innerText = "ADSB key missing in Worker";
                        } else if (getWorkerAccessPassword()) {
                            document.getElementById('api-key-status').innerText = "Checking Worker password";
                            return apiFetch("/auth/check").then(response => {
                                document.getElementById('api-key-status').innerText = response.ok
                                    ? "Worker connected"
                                    : "Enter valid Worker password";
                            });
                        } else {
                            document.getElementById('api-key-status').innerText = "Worker password required";
                        }
                    } else {
                        document.getElementById('api-key-status').innerText = health.keyConfigured
                            ? "Key loaded in proxy"
                            : "Not saved";
                    }
                })
                .catch(err => {
                    document.getElementById('api-key-status').innerText = API_BASE_URL
                        ? "Cloudflare Worker unavailable"
                        : "Proxy unavailable";
                    console.error("Backend health check failed:", err);
                });
            const initialCallsign = document.getElementById('input-callsign').value;
            updateAirlineLogo(initialCallsign, document.getElementById('input-country').value);
            if (initialCallsign) applyRouteForCallsign(initialCallsign, { flight: initialCallsign });
            initRadarMap();
            fetchAndApplyWeather(document.getElementById('input-city').value);
        };
    </script>
</body>
</html>
