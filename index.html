<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Stations - Live Broadcast Overlay</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat version for real-time database sync) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-orange: #F9A53E;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --panel-bg: rgba(15, 23, 42, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: transparent;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        /* Main Broadcast Container */
        .overlay-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Bar: Weather & Clock */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .info-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .weather-flip {
            display: inline-block;
            min-width: 140px;
            transition: opacity 0.3s ease;
        }

        .clock-display {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: var(--accent-orange);
        }

        /* Bottom Ticker Bar acting as Toggle Trigger */
        .news-ticker-bar {
            display: flex;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            overflow: hidden;
            height: 48px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .news-ticker-bar:hover {
            border-color: var(--accent-orange);
        }

        .news-badge {
            background: var(--accent-orange);
            color: #0F172A;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .ticker-content {
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            width: 100%;
            padding-left: 20px;
        }

        .ticker-text {
            display: inline-block;
            animation: marquee 35s linear infinite;
            font-size: 14px;
            font-weight: 500;
            color: #E2E8F0;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Control Panel Drawer (Hidden by default) */
        .control-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 90%;
            max-width: 600px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .control-panel.active {
            display: flex;
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .control-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-orange);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group.full {
            grid-column: span 2;
        }

        .control-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .control-group input, .control-group select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .control-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-save {
            background: var(--accent-orange);
            color: #0F172A;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        .sync-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
        }

        .sync-dot.connected {
            background: #22c55e;
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <!-- Top Info Bar -->
        <div class="info-bar">
            <div class="info-group">
                <span><i class="fa-solid fa-location-dot" style="color: var(--accent-orange);"></i> <span id="location-name">Nagoya Komaki (RJNA)</span></span>
                <span>|</span>
                <span id="weather-container"><i class="fa-solid fa-cloud-sun"></i> <span class="weather-flip" id="weather-text">Loading Weather...</span></span>
            </div>
            <div class="info-group">
                <span class="sync-status"><span class="sync-dot" id="sync-indicator"></span> Firebase Sync</span>
                <span>|</span>
                <span><i class="fa-regular fa-clock"></i> <span class="clock-display" id="jp-clock">--:--:-- JST</span></span>
            </div>
        </div>

        <!-- Bottom News Ticker Bar (Click to open control panel) -->
        <div class="news-ticker-bar" onclick="toggleControlPanel()">
            <div class="news-badge">
                <i class="fa-solid fa-plane-departure"></i> Aviation News
            </div>
            <div class="ticker-content">
                <span class="ticker-text" id="ticker-display">Welcome to Sky Stations Live Broadcast! Monitoring Nagoya Komaki Airport (RJNA). Embraer 170/175 operations active. Please set your Firebase database URL in the control panel.</span>
            </div>
        </div>
    </div>

    <!-- Hidden Control Panel -->
    <div class="control-panel" id="controlPanel" onclick="event.stopPropagation()">
        <div class="control-header">
            <h3><i class="fa-solid fa-sliders"></i> Broadcast Control Center</h3>
            <button class="close-btn" onclick="toggleControlPanel()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="control-grid">
            <div class="control-group">
                <label>Airport Location</label>
                <select id="input-airport" onchange="updateLocationPreset()">
                    <option value="komaki">Nagoya Komaki (RJNA)</option>
                    <option value="centrair">Chubu Centrair (RJGG)</option>
                    <option value="itami">Osaka Itami (RJOO)</option>
                    <option value="kansai">Kansai Int. (RJBB)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Ticker Speed (Seconds)</label>
                <input type="number" id="input-speed" value="35" min="10" max="100">
            </div>
            <div class="control-group full">
                <label>Custom Ticker / Status Message</label>
                <input type="text" id="input-ticker" value="Welcome to Sky Stations Live Broadcast! Monitoring Nagoya Komaki Airport (RJNA).">
            </div>
            <div class="control-group full">
                <label>Firebase Database URL</label>
                <input type="text" id="input-db-url" placeholder="https://your-project-default-rtdb.firebaseio.com">
            </div>
        </div>
        <div class="control-actions">
            <button class="btn-save" onclick="saveSettingsToFirebase()">Save & Sync Settings</button>
        </div>
    </div>

    <script>
        // --- Firebase Configuration & Initialization ---
        // REPLACE WITH YOUR FIREBASE CONFIG URL WHEN READY
        const defaultFirebaseConfig = {
            databaseURL: "https://sky-stations-default-rtdb.firebaseio.com/" 
        };

        let db = null;
        let isConnected = false;

        function initFirebase(customUrl) {
            try {
                if (firebase.apps.length > 0) {
                    firebase.app().delete();
                }
                if (!customUrl) return;

                firebase.initializeApp({ databaseURL: customUrl });
                db = firebase.database();
                
                // Test connection path
                db.ref('.info/connected').on('value', (snap) => {
                    isConnected = (snap.val() === true);
                    const dot = document.getElementById('sync-indicator');
                    if (isConnected) {
                        dot.classList.add('connected');
                        console.log("Firebase connected successfully!");
                    } else {
                        dot.classList.remove('connected');
                    }
                });

                // Listen for remote configuration changes in real-time
                db.ref('broadcast_settings').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.tickerText) {
                            document.getElementById('ticker-text').innerText = data.tickerText;
                            document.getElementById('input-ticker').value = data.tickerText;
                        }
                        if (data.tickerSpeed) {
                            document.querySelector('.ticker-text').style.animationDuration = data.tickerSpeed + 's';
                            document.getElementById('input-speed').value = data.tickerSpeed;
                        }
                        if (data.airport) {
                            document.getElementById('input-airport').value = data.airport;
                            updateLocationPreset(true);
                        }
                    }
                });
            } catch (err) {
                console.error("Firebase initialization error:", err);
            }
        }

        // --- UI Interactions & Panel Toggle ---
        function toggleControlPanel() {
            const panel = document.getElementById('controlPanel');
            panel.classList.toggle('active');
        }

        // --- Real-Time Japan Clock (Asia/Tokyo) ---
        function updateClock() {
            const options = { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const timeString = new Intl.DateTimeFormat([], options).format(new Date());
            document.getElementById('jp-clock').innerText = timeString + " JST";
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Weather & Airport Data (Open-Meteo Integration) ---
        const airportCoords = {
            komaki: { name: "Nagoya Komaki (RJNA)", lat: 35.255, lon: 136.923 },
            centrair: { name: "Chubu Centrair (RJGG)", lat: 34.858, lon: 136.805 },
            itami: { name: "Osaka Itami (RJOO)", lat: 34.785, lon: 135.438 },
            kansai: { name: "Kansai Int. (RJBB)", lat: 34.434, lon: 135.244 }
        };

        async function fetchWeather(airportKey) {
            const apt = airportCoords[airportKey] || airportCoords.komaki;
            document.getElementById('location-name').innerText = apt.name;
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${apt.lat}&longitude=${apt.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`);
                const data = await response.json();
                if (data && data.current) {
                    const temp = data.current.temperature_2m;
                    const wind = data.current.wind_speed_10m;
                    const hum = data.current.relative_humidity_2m;
                    
                    // Weather metrics rotation ticker
                    window.weatherMetrics = [
                        `${temp}°C | Wind: ${wind} km/h`,
                        `Humidity: ${hum}%`,
                        apt.name.split(' ')[0] + " Live METAR"
                    ];
                    let index = 0;
                    if(window.weatherInterval) clearInterval(window.weatherInterval);
                    window.weatherInterval = setInterval(() => {
                        index = (index + 1) % window.weatherMetrics.length;
                        const wEl = document.getElementById('weather-text');
                        wEl.style.opacity = 0;
                        setTimeout(() => {
                            wEl.innerText = window.weatherMetrics[index];
                            wEl.style.opacity = 1;
                        }, 300);
                    }, 4000);
                    document.getElementById('weather-text').innerText = window.weatherMetrics[0];
                }
            } catch (e) {
                document.getElementById('weather-text').innerText = "Weather Unavailable";
            }
        }

        function updateLocationPreset(skipSave = false) {
            const val = document.getElementById('input-airport').value;
            fetchWeather(val);
            if (!skipSave && db && isConnected) {
                db.ref('broadcast_settings/airport').set(val);
            }
        }
        fetchWeather('komaki');

        // --- Save Settings & Sync to Firebase ---
        function saveSettingsToFirebase() {
            const tickerText = document.getElementById('input-ticker').value;
            const tickerSpeed = document.getElementById('input-speed').value;
            const airport = document.getElementById('input-airport').value;
            const dbUrl = document.getElementById('input-db-url').value.trim();

            // Update local view instantly
            document.getElementById('ticker-text').innerText = tickerText;
            document.querySelector('.ticker-text').style.animationDuration = tickerSpeed + 's';

            // Connect or re-connect Firebase if URL changed
            if (dbUrl && (!db || document.getElementById('input-db-url').dataset.lastUrl !== dbUrl)) {
                document.getElementById('input-db-url').dataset.lastUrl = dbUrl;
                initFirebase(dbUrl);
            }

            // Push to Firebase Realtime Database if connected
            if (db && isConnected) {
                db.ref('broadcast_settings').set({
                    tickerText: tickerText,
                    tickerSpeed: tickerSpeed,
                    airport: airport,
                    updatedAt: new Date().toISOString()
                }).then(() => {
                    alert("Settings successfully saved and synced to Firebase!");
                    toggleControlPanel();
                }).catch((error) => {
                    alert("Error saving to Firebase: " + error.message);
                });
            } else {
                alert("Settings applied locally! (Enter a valid Firebase Database URL to enable cloud sync).");
                toggleControlPanel();
            }
        }
    </script>
</body>
</html>
