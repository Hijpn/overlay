<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07131c">
  <title>Aviation Trivia</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --ink: #eaf5f6;
      --muted: #9ab0b9;
      --cyan: #66e4e6;
      --amber: #ffcb71;
      --panel: rgba(5, 15, 23, 0.94);
      --line: rgba(126, 207, 213, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      color: var(--ink);
    }

    .overlay {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .wind-canvas {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.9;
      pointer-events: none;
    }

    .airplane-image {
      position: absolute;
      z-index: 1;
      top: 9%;
      left: 50%;
      width: clamp(250px, 42vw, 560px);
      height: auto;
      filter: drop-shadow(0 0 14px rgba(102, 228, 230, 0.32));
      pointer-events: none;
      transform: translateX(-50%);
    }

    .quiz-card {
      position: absolute;
      z-index: 1;
      right: 4%;
      bottom: 3%;
      left: 4%;
      width: auto;
      padding: 21px 23px 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-left: 3px solid var(--cyan);
      border-radius: 8px;
      background:
        linear-gradient(125deg, rgba(10, 29, 39, 0.58), transparent 58%),
        var(--panel);
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.38), inset 0 0 28px rgba(70, 181, 190, 0.05);
      backdrop-filter: blur(10px);
      clip-path: inset(0 0 0 100%);
    }

    .quiz-card::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 110px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(102, 228, 230, 0.035));
      content: "";
      pointer-events: none;
    }

    .quiz-card::after {
      position: absolute;
      top: 0;
      right: 0;
      width: 3px;
      height: 100%;
      background: #ff9a4f;
      content: "";
      pointer-events: none;
    }

    .topline,
    .footer,
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .eyebrow,
    .round-label,
    .footer-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
    }

    .signal {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 10px rgba(255, 203, 113, 0.8);
    }

    .round-label,
    .footer-label {
      color: var(--muted);
    }

    h1 {
      max-width: 100%;
      margin: 15px 0 16px;
      font-size: clamp(20px, 2.2vw, 29px);
      font-weight: 650;
      line-height: 1.22;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .answer {
      display: flex;
      min-height: 42px;
      align-items: center;
      gap: 10px;
      padding: 8px 11px;
      border: 1px solid rgba(147, 184, 193, 0.2);
      border-radius: 5px;
      background: rgba(17, 35, 44, 0.72);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      line-height: 1.25;
      text-align: left;
      transition: border-color 160ms ease, background 160ms ease, opacity 160ms ease;
    }

    button.answer {
      cursor: pointer;
    }

    button.answer:hover:not(:disabled) {
      border-color: var(--cyan);
      background: rgba(31, 74, 81, 0.72);
    }

    button.answer:focus-visible,
    .next-button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    .answer-key {
      display: grid;
      width: 23px;
      height: 23px;
      flex: 0 0 23px;
      place-items: center;
      border: 1px solid rgba(102, 228, 230, 0.34);
      border-radius: 3px;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
    }

    .answer:disabled {
      cursor: default;
    }

    .answer.correct {
      border-color: rgba(117, 230, 174, 0.74);
      background: rgba(24, 91, 67, 0.35);
    }

    .answer.correct .answer-key {
      border-color: #75e6ae;
      color: #75e6ae;
    }

    .answer.incorrect {
      border-color: rgba(255, 130, 120, 0.72);
      background: rgba(112, 42, 43, 0.32);
    }

    .answer.incorrect .answer-key {
      border-color: #ff8278;
      color: #ff8278;
    }

    .answer.dimmed {
      opacity: 0.54;
    }

    .feedback {
      min-height: 18px;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .timer-row {
      margin-top: 12px;
    }

    .timer-track {
      height: 3px;
      flex: 1;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(159, 186, 194, 0.18);
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      transform: scaleX(1);
      transform-origin: left center;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
    }

    .timer-value {
      width: 30px;
      color: var(--amber);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }

    .footer {
      min-height: 30px;
      margin-top: 11px;
    }

    .next-button {
      padding: 6px 10px;
      border: 1px solid rgba(102, 228, 230, 0.42);
      border-radius: 4px;
      background: rgba(31, 74, 81, 0.42);
      color: var(--cyan);
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .next-button:hover {
      background: rgba(31, 74, 81, 0.78);
    }

    .overlay.is-entering .quiz-card {
      animation: reveal-card 1.55s cubic-bezier(0.2, 0.7, 0.2, 1) 0.2s forwards;
    }

    @keyframes reveal-card {
      0% { clip-path: inset(0 0 0 100%); }
      100% { clip-path: inset(0 0 0 0); }
    }

    @media (max-width: 700px) {
      .quiz-card {
        right: 3%;
        bottom: 3%;
        left: 3%;
        width: auto;
        padding: 16px;
      }

      h1 {
        margin: 12px 0;
      }

      .answer {
        min-height: 39px;
        padding: 7px;
        font-size: 12px;
      }

      .airplane-image {
        top: 7%;
        left: 50%;
        width: clamp(180px, 68vw, 280px);
        transform: translateX(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .overlay.is-entering .quiz-card {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>
<body>
  <main class="overlay" id="overlay" aria-label="Aviation quiz">
    <canvas class="wind-canvas" id="wind-canvas" aria-hidden="true"></canvas>
    <img class="airplane-image" src="assets/airplane.png?v=5" alt="" aria-hidden="true">
    <section class="quiz-card" aria-live="polite">
      <div class="topline">
        <div class="eyebrow"><span class="signal"></span> Aviation Trivia</div>
        <div class="round-label" id="round-label">Preparing</div>
      </div>
      <h1 id="question">Loading question...</h1>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback">The question will appear shortly.</p>
      <div class="timer-row">
        <div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div>
        <span class="timer-value" id="timer-value">20</span>
      </div>
      <div class="footer">
        <span class="footer-label" id="score-label">CORRECT 0</span>
        <button class="next-button" id="next-button" type="button">START QUIZ</button>
      </div>
    </section>
  </main>

  <script>
    const windCanvas = document.getElementById("wind-canvas");
    const windContext = windCanvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let windWidth = 0;
    let windHeight = 0;
    let windParticles = [];
    let windFrameId = 0;
    let lastWindFrame = 0;

    function createWindParticle(initial) {
      return {
        x: initial ? Math.random() * windWidth : -Math.random() * Math.min(windWidth * 0.1, 50),
        y: Math.random() * windHeight,
        age: initial ? Math.random() * 2 : 0,
        lifetime: Math.max(windWidth / 16, 10) * (0.85 + Math.random() * 0.3),
        width: 0.5 + Math.random() * 1.1,
        hue: 195 + Math.random() * 20,
        trail: []
      };
    }

    function resizeWindCanvas() {
      const bounds = windCanvas.getBoundingClientRect();
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      windWidth = bounds.width;
      windHeight = bounds.height;
      windCanvas.width = Math.round(windWidth * pixelRatio);
      windCanvas.height = Math.round(windHeight * pixelRatio);
      windContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      const particleCount = Math.max(260, Math.min(1000, Math.round(windWidth * windHeight / 1500)));
      windParticles = Array.from({ length: particleCount }, function () {
        return createWindParticle(true);
      });

      if (reducedMotion.matches) drawWindParticles();
    }

    function getWindVector(x, y, time) {
      const nx = x / Math.max(windWidth, 1);
      const ny = y / Math.max(windHeight, 1);
      const phase = time * 0.000018;
      const wavePhase = nx * Math.PI * 2 + (ny - 0.5) * 0.25 + phase;
      const wave = Math.sin(wavePhase);
      const velocityX = 17 + wave * 1.6;
      return {
        x: velocityX,
        y: Math.cos(wavePhase) * windHeight * 0.045 * (Math.PI * 2 / Math.max(windWidth, 1)) * velocityX
      };
    }

    function drawWindParticles() {
      windContext.clearRect(0, 0, windWidth, windHeight);

      windParticles.forEach(function (particle) {
        if (reducedMotion.matches) {
          windContext.beginPath();
          windContext.arc(particle.x, particle.y, particle.width, 0, Math.PI * 2);
          windContext.fillStyle = "hsl(" + particle.hue + ", 92%, 62%)";
          windContext.fill();
          return;
        }

        if (particle.trail.length < 2) return;
        const first = particle.trail[0];
        const last = particle.trail[particle.trail.length - 1];
        const gradient = windContext.createLinearGradient(first.x, first.y, last.x, last.y);
        gradient.addColorStop(0, "hsla(" + particle.hue + ", 96%, 58%, 0)");
        gradient.addColorStop(0.58, "hsla(" + particle.hue + ", 96%, 58%, 0.3)");
        gradient.addColorStop(1, "hsla(" + particle.hue + ", 100%, 70%, 0.92)");

        windContext.beginPath();
        windContext.moveTo(first.x, first.y);
        for (let index = 1; index < particle.trail.length; index += 1) {
          windContext.lineTo(particle.trail[index].x, particle.trail[index].y);
        }
        windContext.strokeStyle = gradient;
        windContext.lineWidth = particle.width;
        windContext.lineCap = "round";
        windContext.stroke();
      });
    }

    function animateWind(timestamp) {
      if (document.hidden || reducedMotion.matches) return;
      const delta = lastWindFrame ? Math.min((timestamp - lastWindFrame) / 1000, 0.04) : 0;
      lastWindFrame = timestamp;

      windParticles.forEach(function (particle, index) {
        const velocity = getWindVector(particle.x, particle.y, timestamp);
        const colorPhase = particle.x / Math.max(windWidth, 1) * Math.PI * 2 + timestamp * 0.000018;
        particle.hue = 210 - (Math.sin(colorPhase) + 1) * 0.5 * 175;
        particle.x += velocity.x * delta;
        particle.y += velocity.y * delta;
        particle.age += delta;
        particle.trail.push({ x: particle.x, y: particle.y });

        if (particle.trail.length > 120) particle.trail.shift();
        if (particle.age > particle.lifetime ||
            particle.x > windWidth + 8 || particle.y < -8 || particle.y > windHeight + 8) {
          windParticles[index] = createWindParticle(false);
        }
      });

      drawWindParticles();
      windFrameId = window.requestAnimationFrame(animateWind);
    }

    function startWindAnimation() {
      window.cancelAnimationFrame(windFrameId);
      lastWindFrame = 0;
      if (reducedMotion.matches) {
        drawWindParticles();
      } else if (!document.hidden) {
        windFrameId = window.requestAnimationFrame(animateWind);
      }
    }

    window.addEventListener("resize", resizeWindCanvas);
    document.addEventListener("visibilitychange", startWindAnimation);
    reducedMotion.addEventListener("change", startWindAnimation);
    resizeWindCanvas();
    startWindAnimation();

    const questions = [
      {
        question: "Which manufacturer makes the 737 and 787 Dreamliner?",
        answers: ["Airbus", "Boeing", "Embraer", "Bombardier"],
        correct: 1,
        detail: "The 737 and 787 are aircraft made by the American manufacturer Boeing."
      },
      {
        question: "Which of these aircraft is known as the Superjumbo?",
        answers: ["Airbus A380", "Boeing 757", "Embraer E195", "Airbus A321"],
        correct: 0,
        detail: "The Airbus A380 is the largest passenger airliner in service."
      },
      {
        question: "What does transponder code 7700 primarily indicate?",
        answers: ["Training flight", "General emergency", "Communication failure", "State aircraft"],
        correct: 1,
        detail: "Code 7700 is used to signal a general emergency."
      },
      {
        question: "Which Brazilian manufacturer builds the E-Jet family?",
        answers: ["Cessna", "ATR", "Embraer", "Pilatus"],
        correct: 2,
        detail: "Embraer builds the E-Jet and E-Jet E2 families."
      },
      {
        question: "What is the main purpose of flaps during approach?",
        answers: ["Increase lift and drag", "Reduce weight", "Increase cabin pressure", "Brake the wheels in flight"],
        correct: 0,
        detail: "Flaps help generate lift and drag at low speeds."
      },
      {
        question: "Which of these is a turboprop aircraft?",
        answers: ["Boeing 777", "Airbus A350", "ATR 72", "Boeing 787"],
        correct: 2,
        detail: "The ATR 72 is a turboprop commonly used on regional routes."
      }
    ];

    const duration = 20;
    const overlay = document.getElementById("overlay");
    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedbackElement = document.getElementById("feedback");
    const roundLabel = document.getElementById("round-label");
    const scoreLabel = document.getElementById("score-label");
    const timerFill = document.getElementById("timer-fill");
    const timerValue = document.getElementById("timer-value");
    const nextButton = document.getElementById("next-button");

    let questionIndex = -1;
    let score = 0;
    let timerId;
    let animationId;
    let roundActive = false;
    let answered = false;

    function updateTimer(secondsLeft) {
      const progress = Math.max(0, secondsLeft / duration);
      timerFill.style.transform = "scaleX(" + progress + ")";
      timerValue.textContent = String(Math.ceil(secondsLeft));
    }

    function finishRound(timedOut) {
      if (!roundActive) return;
      roundActive = false;
      answered = true;
      window.clearInterval(timerId);
      window.cancelAnimationFrame(animationId);

      const current = questions[questionIndex];
      const buttons = answersElement.querySelectorAll(".answer");
      buttons.forEach(function (button, index) {
        button.disabled = true;
        if (index === current.correct) {
          button.classList.add("correct");
        } else if (button.dataset.selected === "true") {
          button.classList.add("incorrect");
        } else {
          button.classList.add("dimmed");
        }
      });

      if (timedOut) {
        feedbackElement.textContent = "Time's up. " + current.detail;
      } else if (answersElement.querySelector('[data-selected="true"]') &&
          Number(answersElement.querySelector('[data-selected="true"]').dataset.index) === current.correct) {
        score += 1;
        feedbackElement.textContent = "Correct! " + current.detail;
      } else {
        feedbackElement.textContent = current.detail;
      }

      scoreLabel.textContent = "CORRECT " + score;
      nextButton.textContent = questionIndex === questions.length - 1 ? "VIEW RESULTS" : "NEXT QUESTION";
    }

    function chooseAnswer(index) {
      if (!roundActive || answered) return;
      const button = answersElement.querySelector('[data-index="' + index + '"]');
      if (!button) return;
      button.dataset.selected = "true";
      finishRound(false);
    }

    function showResults() {
      roundActive = false;
      questionElement.textContent = "Quiz complete!";
      answersElement.replaceChildren();
      feedbackElement.textContent = "You got " + score + " out of " + questions.length + " questions right.";
      roundLabel.textContent = "END OF ROUTE";
      timerValue.textContent = "—";
      timerFill.style.transform = "scaleX(0)";
      nextButton.textContent = "RESTART";
    }

    function startRound() {
      if (questionIndex >= questions.length - 1) {
        showResults();
        return;
      }

      questionIndex += 1;
      roundActive = false;
      answered = false;
      window.clearInterval(timerId);
      window.cancelAnimationFrame(animationId);

      const current = questions[questionIndex];
      questionElement.textContent = current.question;
      roundLabel.textContent = "QUESTION " + String(questionIndex + 1).padStart(2, "0") +
        " / " + String(questions.length).padStart(2, "0");
      feedbackElement.textContent = "Choose an answer. You have " + duration + " seconds.";
      answersElement.replaceChildren();

      current.answers.forEach(function (answer, index) {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.dataset.index = String(index);
        button.innerHTML = '<span class="answer-key">' + (index + 1) + '</span><span></span>';
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", function () {
          chooseAnswer(index);
        });
        answersElement.appendChild(button);
      });

      nextButton.textContent = "GET READY...";
      nextButton.disabled = true;
      updateTimer(duration);
      overlay.classList.remove("is-entering");
      void overlay.offsetWidth;
      overlay.classList.add("is-entering");

      window.setTimeout(function () {
        nextButton.disabled = false;
        nextButton.textContent = "ANSWER: 1–4";
        roundActive = true;
        const startedAt = performance.now();
        timerId = window.setInterval(function () {
          const elapsed = (performance.now() - startedAt) / 1000;
          const remaining = Math.max(0, duration - elapsed);
          updateTimer(remaining);
          if (remaining <= 0) finishRound(true);
        }, 100);
      }, 1800);
    }

    nextButton.addEventListener("click", function () {
      if (nextButton.textContent === "RESTART") {
        questionIndex = -1;
        score = 0;
        scoreLabel.textContent = "CORRECT 0";
      }
      if (!roundActive) startRound();
    });

    window.addEventListener("keydown", function (event) {
      if (/^[1-4]$/.test(event.key)) {
        chooseAnswer(Number(event.key) - 1);
      } else if (event.key === "Enter" && !roundActive && !nextButton.disabled) {
        nextButton.click();
      }
    });

    window.setTimeout(startRound, 700);
  </script>
</body>
</html>
